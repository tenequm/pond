# kache's remote for the windows-dist leg. Same shape and same reasoning as
# .github/kache/windows-verify.toml - see that file's header, or
# docs/plans/2608-24-ci-caching-architecture.md, for why the remote lives in a
# file and the credentials do not.
#
# A separate file rather than a shared one because each build shape carries
# its own prefix: nothing is shared across these two anyway (windows-dist
# inherits the dist profile's thin LTO and cgu=1, so the rustc flags differ per
# unit and the keys never collide).
#
# Selected by the KACHE_CONFIG that .github/actions/windows-bootstrap exports
# before the kache-action step; `prefix` MUST equal the s3-prefix it hands the
# action, and the bootstrap asserts it.
[cache.remote]
type = "s3"
bucket = "ttq"
endpoint = "https://nbg1.your-objectstorage.com"
region = "nbg1"
# Per-job and schema-tagged, same reasoning as windows-verify.toml. A freshly
# rotated prefix starts empty and the first release build into it is the cold
# one (~76 min).
#
# Prewarming it needs a PUSH TO MAIN, not a dispatch. Since kache 0.17 the
# remote is forced read-only for every GitHub event except a push to a
# protected branch (src/policy.rs, is_trusted_github_writer: event == push AND
# ref_type == branch AND GITHUB_REF_PROTECTED truthy), and KACHE_REMOTE_READONLY=0
# cannot override it. A `force_build` workflow_dispatch therefore compiles for
# real, pulls, and uploads NOTHING - it warms the runner it ran on and nobody
# else. Rotate together with a change that lands on main.
prefix = "kache/pond/windows-dist/k31"
