# kache's remote for the dist-build-unix job. Same shape and same reasoning as
# .github/kache/windows-verify.toml - see that file's header, or
# docs/plans/2608-24-ci-caching-architecture.md, for why the remote lives in a
# file and the credentials do not.
#
# Selected by the KACHE_CONFIG that .github/actions/devshell exports; the
# consumer is the `build-dist` task in the root moon.yml, which runs from the
# repo root with RUSTC_WRAPPER=kache. This file replaces the two-line
# ~/.config/kache/config.toml stub that task used to write, which named no
# bucket and leaned on the job's KACHE_S3_* env - the env a kache daemon
# spawn no longer inherits.
#
# The CLI still reads KACHE_S3_PREFIX ahead of this file, so dist-build-unix
# asserts the two agree before anything runs; a split would put the daemon on
# one prefix and the CLI on another.

# Unlike the two Windows legs, this one runs on the persistent pond-ci runner:
# /ci-cache survives every pod, so the local store usually already holds what a
# build needs and speculative prefetch is added work rather than a head start.
# kache's own guidance for persistent self-hosted runners
# (docs/remote-cache/ci.mdx, "Ephemeral and persistent runners"). Exact remote
# reads and uploads are unaffected - only the speculative planner is off. MUST
# stay above [cache.remote]: TOML would otherwise read the key as part of the
# remote table.
[cache]
prefetch_enabled = false

[cache.remote]
type = "s3"
bucket = "ttq"
endpoint = "https://nbg1.your-objectstorage.com"
region = "nbg1"
# Per-job and schema-tagged, same reasoning as windows-verify.toml (k33 =
# schema 31 + one manual GC rotation after Lance 12) - all legs bumped
# together, never one.
# The old shared kache/pond prefix is left in place as the revert window.
prefix = "kache/pond/linux-dist/k33"
