# kache's remote for the build-and-test-windows job (manifest key
# windows-verify, which names this file), in a committed file rather than in
# the job's environment because a daemon cannot watch an environment: kache
# strips KACHE_S3_BUCKET/ENDPOINT/REGION/PREFIX/PROFILE from every daemon it
# spawns itself (src/daemon.rs, AMBIENT_REMOTE_ENV_VARS) and keeps KACHE_CONFIG,
# which is why "file for the remote, env for the secrets" is the shape that
# survives the next bump.
#
# Selected by the job's KACHE_CONFIG in ci.yml; discovery is KACHE_CONFIG >
# nearest .kache.toml > XDG at both 0.9.0 and 0.14.2 (src/config.rs,
# resolve_config_path). NOT a repo-root .kache.toml: that is found by every
# contributor running kache as RUSTC_WRAPPER anywhere inside a checkout and
# silently points them at a bucket they have no credentials for. The only
# place the prefix is written: the `Start kache` step fails the job unless the
# daemon resolved it from here.
#
# An input of pond:lint-msvc and pond:test-msvc, so rotating the k-tag makes
# the leg compile into the new prefix instead of replaying moon's cache.
#
# [cache.remote] and nothing else. The store size, the prefetch caps,
# KACHE_NAMESPACE and KACHE_MANIFEST_KEY stay in env (the last two have no file
# form at all), and `[cache] ignore_env` is never set here because it would
# silence exactly those. Credentials stay in env too - KACHE_S3_ACCESS_KEY and
# KACHE_S3_SECRET_KEY come from the KACHE_R2_* repository secrets and never
# enter a file.
#
# Cloudflare R2, not the Hetzner bucket the Linux dist leg uses: Hetzner's
# conditional PUT rejects the standard quoted `If-Match` with 412, so every
# manifest merge after the first write failed there and prefetch went stale.
#
# Every key below except `pull_request_prefix` (1.x only) exists unchanged through 1.1.1
# (RemoteFileConfig). Full reasoning: docs/plans/2608-24-ci-caching-architecture.md.
[cache.remote]
type = "s3"
bucket = "pond-kache"
endpoint = "https://3db7dd8ff22ae68593205855d8bc0b25.r2.cloudflarestorage.com"
region = "auto"
# Per-job and schema-tagged: nothing is shared across build shapes anyway (the
# rustc flags differ per unit), and the tag keeps a rotation a sibling
# directory instead of a subtree - rotation IS the remote GC. The tag only moves forward and tracks kache upgrades, not the
# schema number: k35 is kache 1.1, whose corrected build-script and native keys
# miss k34's entries even though CACHE_KEY_VERSION is still 32.
prefix = "kache/pond/windows-verify/k35"
# Pull request jobs only (kache 1.x): they read `prefix` first, then this one,
# and write only here, so a labeled PR's next push reuses what its last push
# compiled. Trusted pushes never read it. Shared by every PR and never expired;
# it rotates with `prefix`, k-tag included.
pull_request_prefix = "kache/pond/windows-verify-pr/k35"
