name: winget

# Deliberately NOT `on: release`. release-plz publishes the GitHub release, and
# ci.yml uploads the binaries to it in a later step of the same job - so a
# release-triggered run would start while the release still carries no assets
# and hand winget-releaser an empty installer list. ci.yml calls this after the
# upload instead; dispatch re-runs a single version by hand.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Released version without the leading v (e.g. 0.14.10)
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Komac under the hood; there is no separate Komac action. fork-user
      # defaults to the repository owner, whose winget-pkgs fork the PR
      # branches off.
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: tenequm.pond
          version: ${{ inputs.version }}
          # The action defaults release-tag to github.ref_name, which is `main`
          # on the call from ci.yml.
          release-tag: v${{ inputs.version }}
          # Load-bearing: the default regex matches exe/msi/msix/appx only, and
          # pond ships a portable zip - without this line the action finds no
          # installer and publishes a manifest with no URL.
          installers-regex: '\.zip$'
          # Classic PAT with public_repo. winget-releaser rejects fine-grained
          # tokens.
          token: ${{ secrets.WINGET_PAT }}
