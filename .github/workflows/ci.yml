name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default read-only; publish-release elevates to contents:write for its own
# `gh release upload`. The release PR and publishes use the GH_RELEASE_TOKEN
# PAT, not the workflow token.
permissions:
  contents: read

# Concurrency is per-job, not workflow-level: a workflow-level cancel-in-progress
# also kills an in-flight release mid-publish (after release-plz cuts the tag, the
# is_release gate is false forever, so an interrupted publish can't auto-recover).
# So builds stay cancellable while publish-release is made non-cancellable below.

env:
  CARGO_TERM_COLOR: always
  # Remote cache only when the secret exists: fork PRs get no secrets and
  # moon hard-fails a configured remote with an empty auth header. Inert for
  # jobs that don't run moon.
  MOON_REMOTE_HOST: ${{ secrets.BAZEL_REMOTE_AUTH != '' && 'grpcs://bazel-remote.cascade.fyi:443' || '' }}
  BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}

jobs:
  build-and-test:
    # In-cluster ARC ephemeral runner (scale set `pond-ci`). Toolchain, cargo
    # registry, and target/ live on the runner's /ci-cache PVC, which persists
    # across the ephemeral pods.
    runs-on: pond-ci
    timeout-minutes: 60
    # A newer push to the same ref supersedes an in-flight build.
    concurrency: { group: "ci-build-${{ github.ref }}", cancel-in-progress: true }
    steps:
      # Full history: moon's vcs layer resolves vcs.defaultBranch, which a
      # shallow PR checkout doesn't have (git exit 128).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
      # One moon session: independent tasks interleave (cargo serializes the
      # heavy ones on its target-dir lock; format/changelog are instant).
      - run: moon run pond:check-changelog pond:check-package pond:format pond:lint pond:test

  # Maintain the release PR, and report ONLY whether a release is pending.
  # Detection is the tag check - release-plz's own first gate is "skip a package
  # whose tag already exists". (dry-run can't report this: in dry-run release-plz
  # always emits releases_created=false, it only logs the plan.)
  release-prep:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: "release-plz-${{ github.ref }}", cancel-in-progress: false }
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0, persist-credentials: false }
      # SHA-pinned, so the toolchain must be an explicit input (the action
      # otherwise derives it from the ref name).
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: stable }
      - uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with: { command: release-pr, config: .github/release-plz.toml }   # keep the release PR current; never publishes
        env:
          # PAT (not GITHUB_TOKEN) so the opened release PR triggers build-and-test.
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - id: detect
        run: |
          set -euo pipefail
          V=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[]|select(.name=="pond-db").version')
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi

  # Build, then publish everywhere. release-plz publishes crates.io + cuts the
  # tag/release HERE (after the build), so crates.io can't ship without binaries.
  publish-release:
    needs: [release-prep]
    if: needs.release-prep.outputs.is_release == 'true'
    # ARC runner pod: gh + nix-bin come from the runner image; rust lives on
    # the /ci-cache PVC (release-plz runs `cargo publish` here).
    runs-on: pond-ci
    # A fully cold 4-target dist build measured 56m; warm runs are minutes.
    timeout-minutes: 90
    permissions:
      contents: write   # `gh release upload` to this repo via the workflow token
    # Never cancel a release mid-publish: a newer push queues behind this run
    # instead of killing it between release-plz tagging and the four publishes.
    concurrency: { group: "pond-release-${{ github.ref }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/bootstrap

      # Machine cross-compile right on the runner (zig/zigbuild/SDK/rcodesign
      # from the pond-runner image, incremental cache on /ci-cache) - no
      # docker, no buildkit, no kubeconfig.
      - name: Build + package binaries
        run: moon run pond:build-dist
        env:
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}
          KACHE_S3_REGION: nbg1
          KACHE_S3_BUCKET: ttq
          KACHE_S3_ENDPOINT: https://nbg1.your-objectstorage.com
          KACHE_S3_PREFIX: kache/pond
          # Local store on the PVC so pods start warm and sync only moves
          # deltas; cap it well below the 100Gi shared PVC.
          KACHE_CACHE_DIR: /ci-cache/kache
          KACHE_MAX_SIZE: 20GiB

      - id: ver
        run: echo "v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[]|select(.name=="pond-db").version')" >> "$GITHUB_OUTPUT"
      
      - uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        id: release-plz
        with: { command: release, config: .github/release-plz.toml }
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Assemble pond's own release first: it is the single host of the release
      # binaries - the homebrew formula, the root flake, and the pond-nix legacy
      # mirror all fetch from it - so it must be complete before anything else.
      - name: Mirror binaries to pond release
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", V: "${{ steps.ver.outputs.v }}" }
        run: gh release upload "v$V" dist/pond-* dist/checksums.txt --repo tenequm/pond --clobber

      # One rendered nix derivation feeds both the root flake (canonical,
      # github:tenequm/pond) and the pond-nix legacy mirror.
      - name: Render nix package
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { V: "${{ steps.ver.outputs.v }}" }
        run: |
          set -euo pipefail
          sha() { sha256sum "dist/pond-$1.tar.xz" | cut -d' ' -f1; }
          cat > "$RUNNER_TEMP/pond.nix" <<EOF
          { lib, fetchurl, stdenv, autoPatchelfHook, installShellFiles, zlib }:
          let
            inherit (stdenv) hostPlatform;
            inherit (hostPlatform) system;
            version = "$V";
            base = "https://github.com/tenequm/pond/releases/download/v\${version}";
            shaMap = {
              x86_64-linux = "$(sha x86_64-unknown-linux-gnu)";
              aarch64-linux = "$(sha aarch64-unknown-linux-gnu)";
              aarch64-darwin = "$(sha aarch64-apple-darwin)";
            };
            urlMap = {
              x86_64-linux = "\${base}/pond-x86_64-unknown-linux-gnu.tar.xz";
              aarch64-linux = "\${base}/pond-aarch64-unknown-linux-gnu.tar.xz";
              aarch64-darwin = "\${base}/pond-aarch64-apple-darwin.tar.xz";
            };
          in
          stdenv.mkDerivation {
            pname = "pond";
            inherit version;

            src = fetchurl {
              url = urlMap.\${system};
              sha256 = shaMap.\${system};
            };

            sourceRoot = ".";

            # Prebuilt glibc ELF won't run on NixOS until its interpreter and RPATH
            # are rewritten to Nix-store paths; darwin Mach-O needs no patching.
            nativeBuildInputs = [ installShellFiles ] ++ lib.optionals hostPlatform.isLinux [ autoPatchelfHook ];

            # The released Linux build is CPU-only candle + vendored onig + rustls,
            # so the sole dynamic deps beyond glibc are libgcc_s/libstdc++.
            buildInputs = lib.optionals hostPlatform.isLinux [ stdenv.cc.cc.lib zlib ];

            # Completions ship pre-generated in the tarball: the binary can't
            # run here (autoPatchelfHook rewrites the interpreter later, in
            # fixupPhase).
            installPhase = ''
              runHook preInstall
              install -Dm755 pond \$out/bin/pond
              installShellCompletion --bash completions/pond.bash --zsh completions/_pond --fish completions/pond.fish
              runHook postInstall
            '';

            meta = {
              description = "Lossless storage and hybrid search for sessions from any AI agent client";
              homepage = "https://pond.locker/";
              changelog = "https://github.com/tenequm/pond/releases/tag/v\${version}";
              license = lib.licenses.asl20;
              mainProgram = "pond";
              sourceProvenance = with lib.sourceTypes; [ binaryNativeCode ];
              platforms = [ "aarch64-darwin" "aarch64-linux" "x86_64-linux" ];
              maintainers = with lib.maintainers; [ ];
            };
          }
          EOF

      # The tag was cut from this checkout's HEAD, so this lands one commit
      # after it: tag-pinned flake refs carry the previous release's hashes,
      # main is always current. [skip ci] keeps the push from triggering CI.
      - name: Point root flake at the new binaries
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_RELEASE_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}", V: "${{ steps.ver.outputs.v }}" }
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/pond.nix" nix/pond.nix
          git add nix/pond.nix
          git -c user.name=ci -c user.email=ci@pond commit -m "chore(release): point flake at v$V binaries [skip ci]"
          git fetch "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/pond" main
          git rebase FETCH_HEAD
          git push "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/pond" HEAD:main

      - name: Publish Homebrew formula
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_RELEASE_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}", V: "${{ steps.ver.outputs.v }}" }
        run: |
          set -euo pipefail
          base="https://github.com/tenequm/pond/releases/download/v$V"
          sha() { sha256sum "dist/pond-$1.tar.xz" | cut -d' ' -f1; }
          tap="$RUNNER_TEMP/tap"
          rm -rf "$tap"
          git clone --depth 1 "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/homebrew-tap" "$tap"
          cat > "$tap/Formula/pond.rb" <<EOF
          # typed: false
          # frozen_string_literal: true

          class Pond < Formula
            desc "Lossless storage and hybrid search for sessions from any AI agent client"
            homepage "https://pond.locker/"
            version "$V"
            license "Apache-2.0"

            livecheck do
              url :stable
              strategy :github_releases
              regex(/^v?(\d+(?:\.\d+)+)\$/i)
            end

            on_macos do
              depends_on arch: :arm64
              on_arm do
                url "$base/pond-aarch64-apple-darwin.tar.xz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "$base/pond-aarch64-apple-darwin.tar.xz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
            end

            on_linux do
              on_intel do
                url "$base/pond-x86_64-unknown-linux-gnu.tar.xz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
              on_arm do
                url "$base/pond-aarch64-unknown-linux-gnu.tar.xz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "pond"
              generate_completions_from_executable(bin/"pond", "completions")
            end

            test do
              assert_match "pond #{version}", shell_output("#{bin}/pond --version")
              system bin/"pond", "--help"
              assert_match "_pond", shell_output("#{bin}/pond completions zsh")
            end
          end
          EOF
          git -C "$tap" add Formula/pond.rb
          git -C "$tap" diff --quiet --staged || git -C "$tap" -c user.name=ci -c user.email=ci@pond commit -m "pond $V"
          git -C "$tap" push
      # Legacy mirror for existing github:tenequm/pond-nix users; the canonical
      # flake now lives in this repo. Both fetch binaries from pond's release,
      # so pond-nix no longer gets releases of its own.
      - name: Update pond-nix legacy mirror
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_RELEASE_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}", V: "${{ steps.ver.outputs.v }}" }
        run: |
          set -euo pipefail
          nix="$RUNNER_TEMP/pond-nix"
          rm -rf "$nix"
          git clone --depth 1 "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/pond-nix" "$nix"
          mkdir -p "$nix/pkgs/pond"
          cp "$RUNNER_TEMP/pond.nix" "$nix/pkgs/pond/default.nix"
          git -C "$nix" add pkgs/pond/default.nix
          git -C "$nix" diff --quiet --staged || git -C "$nix" -c user.name=ci -c user.email=ci@pond commit -m "pond $V"
          git -C "$nix" push
