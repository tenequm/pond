name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, added for the Windows jobs: windows-dist is release-gated,
  # so dispatch is the only way to exercise the shipped-artifact path before it
  # reaches main. Side effect accepted: build-and-test and flake-check carry no
  # event condition, so they run on dispatch too. release-prep and everything
  # downstream stay push-gated.
  workflow_dispatch:
    inputs:
      force_build:
        description: >
          Compile for real instead of replaying moon's remote cache. Required
          for any run whose kache numbers will be read, and for prewarming a
          fresh prefix: a CI-only diff changes none of the declared inputs of
          lint-msvc / test-msvc / build-dist-msvc, so moon serves the hash main
          already stored, cargo never runs, and the run yields no kache data
          and no warm store.
        type: boolean
        default: false

# Default read-only; publish-release elevates to contents:write for its own
# `gh release upload`. The release PR and publishes use the GH_RELEASE_TOKEN
# PAT, not the workflow token.
permissions:
  contents: read

# Concurrency is per-job, not workflow-level: a workflow-level cancel-in-progress
# also kills an in-flight release mid-publish (after release-plz cuts the tag, the
# is_release gate is false forever, so an interrupted publish can't auto-recover).
# So builds stay cancellable while publish-release is made non-cancellable below.

env:
  CARGO_TERM_COLOR: always
  # Remote cache only when the secret exists: fork PRs get no secrets and
  # moon hard-fails a configured remote with an empty auth header. Inert for
  # jobs that don't run moon.
  MOON_REMOTE_HOST: ${{ secrets.BAZEL_REMOTE_AUTH != '' && 'grpcs://bazel-remote.cascade.fyi:443' || '' }}
  BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}

jobs:
  build-and-test:
    # In-cluster ARC ephemeral runner (scale set `pond-ci`). Toolchain, cargo
    # registry, and target/ live on the runner's /ci-cache PVC, which persists
    # across the ephemeral pods.
    runs-on: pond-ci
    timeout-minutes: 60
    # A newer push to the same ref supersedes an in-flight build.
    concurrency: { group: "ci-build-${{ github.ref }}", cancel-in-progress: true }
    steps:
      # Full history: moon's vcs layer resolves vcs.defaultBranch, which a
      # shallow PR checkout doesn't have (git exit 128).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
      # One moon session: independent tasks interleave (cargo serializes the
      # heavy ones on its target-dir lock; format/changelog are instant). The
      # plugin suites run here too - they cost seconds next to the Rust build,
      # and moon provisions their node/uv itself, so they need nothing from the
      # bootstrap.
      - run: >
          moon run
          repo:check-changelog
          pond:check-package pond:format pond:lint pond:test
          openclaw-pond:typecheck openclaw-pond:test
          pi-pond:typecheck pi-pond:test
          hermes-pond:test

  # Hosted, never pond-ci: those runner pods are unprivileged with a root-owned
  # /nix (the image ships nix-bin only for `nix-hash`), so nix there would need
  # its sandbox off - weaker conditions than the users this check protects.
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: { group: "ci-flake-${{ github.ref }}", cancel-in-progress: true }
    # The workflow-level env hands this secret to every job, and the last step
    # runs a binary downloaded from a GitHub release. Blank it here.
    env:
      BAZEL_REMOTE_AUTH: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      # Without --all-systems the darwin and aarch64 outputs go unevaluated on
      # an x86_64 runner and the job passes anyway.
      - run: nix flake check --all-systems --no-update-lock-file
      # ops/nix is a second flake with its own lock, not reached by the root
      # check; it backs the older `?dir=ops/nix#pond` install URL.
      - run: nix flake check ./ops/nix --all-systems --no-update-lock-file
      # flake check only evaluates - nothing above ever fetches a tarball. This
      # is the step that proves the rendered sha256/URLs and autoPatchelfHook.
      - run: nix run .#pond -- --version

  # Windows runs as TWO jobs, deliberately. One serial job cost 46 min warm
  # (20.7 test + 23.8 dist). Split, they start together on separate hosted
  # runners - separate machines, separate disks, nothing shared - so Windows
  # contributes the longer of the two to a release, not the sum.
  #
  # windows-verify runs moon's `pond:test-msvc`, never `pond:test`: the task
  # fingerprint carries command/args/deps/env/inputs/outputs but no OS or
  # architecture (crates/task-hasher/src/task_fingerprint.rs), so sharing one
  # task would hit the hash the Linux runner already stored and go green without
  # compiling a line here. The differing command is what keeps them apart, and
  # the remote cache is what lets a prose-only commit skip the leg entirely.
  # windows-dist runs `repo:build-dist-msvc` for the same two reasons: its own
  # task so the OS-less fingerprint cannot collide with `repo:build-dist`, and a
  # moon task so it is cacheable at all.
  #
  # The two carry DIFFERENT kache manifest-keys. Sharing one would make each
  # overwrite the other's warm-prefetch manifest, silently dropping both to a
  # near-cold fetch.

  # The gate: the full suite, natively. Runs on ordinary PRs too - at 20.7 min
  # warm there is no reason to defer a Windows regression to release time (the
  # plan deferred it only because a run was estimated at 50-75 min, before kache).
  # Skipped for fork PRs: they get no secrets, so kache has no S3 credentials.
  windows-verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2025
    # No `needs:` - starts at t=0 alongside the Linux jobs and windows-dist.
    # 180 is measured headroom: this leg was 76 min on a fully cold cache.
    timeout-minutes: 180
    # Cancellable, like build-and-test: a newer push supersedes it. That makes
    # this the one `needs:` of publish-release that can be cancelled - the
    # sibling windows-dist is explicitly not, being an artifact producer. It is
    # safe because release-plz cuts the tag INSIDE publish-release, so a
    # cancelled run leaves is_release still true and the superseding push simply
    # re-runs the whole release path. The same exposure build-and-test already
    # carries. Do not "fix" this to false without that reasoning changing.
    concurrency: { group: "ci-windows-verify-${{ github.ref }}", cancel-in-progress: true }
    # RUSTFLAGS is deliberately absent: setting it anywhere in this job silently
    # REPLACES the +crt-static rustflags from .cargo/config.toml.
    #
    # BAZEL_REMOTE_AUTH is NOT blanked here, unlike flake-check: moon only skips
    # a task on a cache hit, and a hosted runner starts with an empty local cache
    # every run, so without the remote there is nothing to hit.
    steps:
      # MUST precede checkout, and cannot live in the composite action (a local
      # action only resolves once the repo is checked out). pond's longest
      # tracked path is 456 characters - a claude-desktop fixture nesting an
      # encoded project slug inside a session dir - and Git for Windows refuses
      # it ("Filename too long", exit 128) regardless of the LongPathsEnabled
      # registry key, because git only opts into `\\?\` paths when
      # core.longpaths is set. --system, not --global: actions/checkout
      # relocates HOME while it edits global config.
      - name: Allow long paths in git
        shell: pwsh
        run: git config --system core.longpaths true
      # Full history for the same reason build-and-test needs it: moon's vcs
      # layer resolves vcs.defaultBranch, which a shallow PR checkout lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/windows-bootstrap
        with:
          kache-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          manifest-key: windows-verify
          # verify only, never windows-dist: a restored harness has unresolved
          # .pdb paths, so a failing test gets a weaker backtrace. Worth ~3 min
          # of link time here; not worth it on the leg whose output ships.
          cache-executables: 'true'

      # Diagnostic only, transfers nothing: --dry-run prints how many artifacts
      # a real pull would move, and how long the enumeration itself takes. Both
      # numbers size the bulk warm-up in slice 2 of
      # docs/plans/2608-24-ci-caching-architecture.md - the lock-filtered path
      # this measures is one sequential LIST per Cargo.lock crate, which is the
      # cost that decides between it and `--pull --all` on a per-job prefix.
      # Runs from the workspace root because the filter is parsed out of the
      # Cargo.lock in the cwd. Output is capped: the dry run prints one line per
      # key and the shared prefix holds tens of thousands. Bounded and
      # non-blocking - a diagnostic must never be what fails the Windows gate.
      - name: kache pull dry run
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $out = kache sync --pull --dry-run
          $sw.Stop()
          "kache sync --pull --dry-run took $([math]::Round($sw.Elapsed.TotalSeconds, 1))s"
          $out | Select-String -Pattern '^Plan:'
          $out | Select-Object -First 30

      # moon replays the hash main already stored when a diff touches none of a
      # task's declared inputs, which is every CI-only change - so a run whose
      # kache numbers will be read has to defeat it deliberately. Written only
      # when asked: MOON_FORCE is presence-checked, so exporting it as "0" would
      # force every run instead.
      - name: Force a real compile
        if: inputs.force_build
        shell: pwsh
        run: '"MOON_FORCE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      # Full suite, not a subset: DataFusion, axum and rmcp have no Windows CI
      # anywhere upstream, so this is the first place they ever run on Windows.
      - name: Test
        run: moon run pond:lint-msvc pond:test-msvc

      # Permanent diagnostics - this is how a cache regression shows up in the
      # log instead of in stopwatch comparisons. The action's own summary is not
      # enough: its "Prefetch: 0/N" line counts plan entries, not downloads
      # (kunobi-ninja/kache#618), so it reads as a total miss on a run that hit
      # 99.7%. `kache stats` carries the honest
      # `Hit rate: X% (local/prefetch/remote/dup/miss)` split plus the `Remote:`
      # and `Daemon:` lines that say which prefix actually served the run, and
      # the daemon log is the only place a remote timeout is recorded.
      #
      # NOT `kache daemon log`: at v0.14.2 its Windows branch shells out to
      # `Get-Content -Wait` (src/service.rs), which follows the file forever and
      # would hold the job to its 180 min timeout. Read the file instead - the
      # auto-started daemon writes stderr next to its socket, and the socket
      # defaults to <cache_dir>/daemon.sock.
      #
      # continue-on-error is load-bearing under pwsh: GitHub appends an
      # `exit $LASTEXITCODE` check, so any non-zero kache exit would otherwise
      # fail the step after the gate has already passed.
      - name: kache diagnostics
        if: always()
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 2
        run: |
          kache stats
          $log = Join-Path $env:KACHE_CACHE_DIR 'daemon.log'
          if (Test-Path $log) { Get-Content -Tail 200 $log } else { "no daemon log at $log" }

  # The shipped msvc zip. Release-gated rather than per-PR: it produces an
  # artifact nobody consumes outside a release, and it is the only thing in the
  # pipeline that ever executes a Windows binary.
  # `!cancelled()` is load-bearing: release-prep only runs on a main push, and a
  # skipped `needs` skips its dependents, so a bare `needs:` would stop the
  # workflow_dispatch escape hatch ever running.
  # Deliberately NOT pre-flighted on the release PR: a failure here cuts no tag,
  # so is_release stays true and `gh run rerun --failed` recovers it.
  windows-dist:
    needs: [release-prep]
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-prep.outputs.is_release == 'true'
      )
    runs-on: windows-2025
    timeout-minutes: 180
    # Not cancellable, same rule as dist-build: this produces a release artifact
    # publish-release needs. Cancelling it mid-release cancels the publish with
    # it, and after release-plz cuts the tag the is_release gate is false
    # forever - an interrupted publish cannot auto-recover.
    concurrency: { group: "ci-windows-dist-${{ github.ref }}", cancel-in-progress: false }
    steps:
      - name: Allow long paths in git
        shell: pwsh
        run: git config --system core.longpaths true
      # Full history, like the sibling Windows job: moon's vcs layer resolves
      # vcs.defaultBranch, which a shallow checkout lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/windows-bootstrap
        with:
          kache-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          kache-secret-access-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          manifest-key: windows-dist

      # Same reasoning as the sibling job: a dispatch meant to prewarm a fresh
      # prefix prewarms nothing if moon serves the stored hash, and the release
      # then pays the cold build inline.
      - name: Force a real compile
        if: inputs.force_build
        shell: pwsh
        run: '"MOON_FORCE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      # Build + smoke + package, as a moon task so the leg gets the same
      # task-level remote cache every other build has. `--profile dist`, not
      # `--release`: `release` is pond's no-LTO iteration profile, and every
      # shipped binary is built with `dist`.
      - name: Build release zip
        run: moon run repo:build-dist-msvc
        env:
          # moon aborts remote-cache uploads still queued 60s after a task ends
          # (BACKGROUND_FLUSH_TIMEOUT, a hard-coded const), which this ~76 MB
          # artifact never beat - so the task never cached. This takes the inline
          # branch added in v2.5.0, awaiting the upload instead; keep the moon
          # pin at or above that.
          MOON_DAEMON_RUNNING: "1"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows
          path: dist/pond-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          retention-days: 1

      # Same permanent diagnostics as windows-verify, and for the same reason:
      # this leg runs rarely enough that a silent cache regression would first
      # be noticed as a slow release. See the sibling job for why the daemon log
      # is read as a file and why continue-on-error is load-bearing under pwsh.
      - name: kache diagnostics
        if: always()
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 2
        run: |
          kache stats
          $log = Join-Path $env:KACHE_CACHE_DIR 'daemon.log'
          if (Test-Path $log) { Get-Content -Tail 200 $log } else { "no daemon log at $log" }

  # Maintain the release PR, and report ONLY whether a release is pending.
  # Detection is the tag check - release-plz's own first gate is "skip a package
  # whose tag already exists". (dry-run can't report this: in dry-run release-plz
  # always emits releases_created=false, it only logs the plan.)
  release-prep:
    # A skipped `needs` job skips its dependents, so flake-check must stay
    # unconditional: give it a `paths:` filter or an `if:` and releases silently
    # stop happening.
    needs: [build-and-test, flake-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: "release-plz-${{ github.ref }}", cancel-in-progress: false }
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # SHA-pinned, so the toolchain must be an explicit input (the action
      # otherwise derives it from the ref name).
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: stable }
      # When GitHub's GraphQL API is degraded, the action's cargo-binstall cannot
      # discover the prebuilt release-plz asset and degrades to a source build.
      # RUSTUP_TOOLCHAIN outranks rust-toolchain.toml, so that build uses stable
      # rather than pond's pin, which is too old for release-plz's dep tree.
      - uses: release-plz/action@1a0c5beec2fe4e91727549b5d2d0715ed28684bb # v0.5.131
        with: { command: release-pr, config: .github/release-plz.toml }   # keep the release PR current; never publishes
        env:
          RUSTUP_TOOLCHAIN: stable
          # PAT (not GITHUB_TOKEN) so the opened release PR triggers build-and-test.
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - id: detect
        run: |
          set -euo pipefail
          V=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[]|select(.name=="pond-db").version')
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi

  # Build + Developer ID sign. Split from publish-release so notarization and
  # the macOS checks can gate the publish without re-running the 3-target build.
  dist-build:
    needs: [release-prep]
    if: needs.release-prep.outputs.is_release == 'true'
    # ARC runner pod: zig/zigbuild/SDK/rcodesign come from the pond-runner
    # image, incremental cache on /ci-cache - no docker, no buildkit.
    runs-on: pond-ci
    # A fully cold 3-target dist build measured 56m; warm runs are minutes.
    timeout-minutes: 90
    concurrency: { group: "pond-dist-${{ github.ref }}", cancel-in-progress: false }
    outputs:
      v: ${{ steps.ver.outputs.v }}
      signed: ${{ steps.identity.outputs.signed }}
    # Job-level, not step-level, so the bootstrap can see KACHE_S3_PREFIX and
    # assert it against the prefix in .github/kache/linux-dist.toml before
    # anything compiles. Bucket/endpoint/region stay here as well because the
    # 0.9.0 CLI reads them ahead of the file, so removing them would change
    # which settings are live rather than just where they are written.
    # Credentials are deliberately env-only: they are the two KACHE_S3_*
    # variables a 0.15.0 daemon spawn does not strip, and they never enter a
    # committed file.
    env:
      KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
      KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}
      KACHE_S3_REGION: nbg1
      KACHE_S3_BUCKET: ttq
      KACHE_S3_ENDPOINT: https://nbg1.your-objectstorage.com
      KACHE_S3_PREFIX: kache/pond
      # Local store on the PVC so pods start warm and sync only moves
      # deltas; cap it well below the 100Gi shared PVC.
      KACHE_CACHE_DIR: /ci-cache/kache
      KACHE_MAX_SIZE: 20GiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/bootstrap

      # Reports only whether the cert exists, never its value: the signature
      # and notarize steps skip cleanly until the Apple secrets are populated,
      # so this lands safely before the credentials do.
      - id: identity
        run: echo "signed=${{ secrets.APPLE_P12_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      # The KACHE_S3_* / KACHE_CACHE_DIR block this step used to carry now sits
      # at job level, so the bootstrap can assert the prefix against the config
      # file. Only the signing credentials stay step-scoped.
      - name: Build + package binaries
        run: moon run repo:build-dist
        env:
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}

      - id: ver
        run: echo "v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[]|select(.name=="pond-db").version')" >> "$GITHUB_OUTPUT"

      # Two artifacts, not one: the macOS jobs only need the 38MB darwin
      # tarball, while publish needs all three cross-compiled tarballs plus
      # checksums (the Windows zip reaches it separately, from windows-dist).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-darwin
          path: dist/pond-aarch64-apple-darwin.tar.xz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-all
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Notarization does NOT alter the artifact: a bare Mach-O has nowhere to hold
  # a ticket, so Apple serves it online and every sha256 computed from the
  # signed binary in dist-build stays valid.
  #
  # One macOS job does launch smoke, signature assertions, and notarization:
  # macos-15 ships `xcrun notarytool`, so the Mac notarizes itself rather than
  # bouncing the artifact through a second Linux job.
  macos-verify:
    needs: [dist-build]
    runs-on: macos-15
    timeout-minutes: 45
    # Same rule as flake-check: this job runs a binary built elsewhere.
    env: { BAZEL_REMOTE_AUTH: "" }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist-darwin }

      # The cross-compiled Mach-O is never built or run on macOS before this.
      # `completions` is what the Homebrew formula shells out to at install
      # time, so a binary that cannot run here breaks `brew install`, not just
      # `pond`.
      - name: Launch the cross-compiled binary
        run: |
          set -euo pipefail
          tar -xJf pond-aarch64-apple-darwin.tar.xz
          ./pond --version
          ./pond --help > /dev/null
          # Redirect, don't pipe: `grep -q` closes the pipe at its first match,
          # and the EPIPE that hands the still-writing binary is an unwrap inside
          # clap_complete, so the assertion killed the release it was gating.
          ./pond completions zsh > completions.zsh
          grep -q '_pond' completions.zsh

      - name: Verify code signature
        if: needs.dist-build.outputs.signed == 'true'
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 ./pond
          # Gatekeeper cannot be asked directly: `spctl --assess --type exec`
          # rejects ANY bare CLI binary ("does not seem to be an app"), even a
          # correctly notarized one. Assert the two properties notarization
          # actually requires instead.
          codesign -dvvv ./pond 2>&1 | tee sig.txt
          grep -q 'Authority=Developer ID Application' sig.txt
          grep -qE 'flags=0x[0-9a-f]*\(.*runtime.*\)' sig.txt

      - name: Notarize with Apple
        if: needs.dist-build.outputs.signed == 'true'
        env:
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The notary accepts .zip/.dmg/.pkg only - this zip is a submission
          # envelope, never a released asset. A bare Mach-O cannot be stapled,
          # so Apple serves the ticket online and the artifact is unchanged.
          ditto -c -k ./pond notarize.zip
          creds="$(mktemp -d)"
          printf '%s' "$APPLE_ASC_KEY_P8" | base64 --decode > "$creds/key.p8"
          # `notarytool submit --wait` exits 0 even when the notary returns
          # Invalid, so the JSON status is the gate, not the exit code.
          xcrun notarytool submit notarize.zip \
            --key "$creds/key.p8" \
            --key-id "$APPLE_ASC_KEY_ID" \
            --issuer "$APPLE_ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee result.json
          rm -rf "$creds"
          test "$(jq -r .status result.json)" = "Accepted"

  # Publish everywhere. release-plz publishes crates.io + cuts the tag/release
  # HERE (after build AND macos-verify), so crates.io can't ship without
  # binaries, and no channel can ship a binary macOS refuses to run.
  publish-release:
    needs: [dist-build, macos-verify, windows-verify, windows-dist]
    # ARC runner pod: gh + nix-bin come from the runner image; rust lives on
    # the /ci-cache PVC (release-plz runs `cargo publish` here).
    runs-on: pond-ci
    timeout-minutes: 30
    permissions:
      contents: write   # `gh release upload` to this repo via the workflow token
    # Never cancel a release mid-publish: a newer push queues behind this run
    # instead of killing it between release-plz tagging and the four publishes.
    concurrency: { group: "pond-release-${{ github.ref }}", cancel-in-progress: false }
    env:
      V: ${{ needs.dist-build.outputs.v }}
    outputs:
      released: ${{ steps.release-plz.outputs.releases_created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/bootstrap
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist-all, path: dist }
      # The msvc zip is built natively by windows-dist, not by the moon dist
      # task, so it arrives as its own artifact.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist-windows, path: dist }

      # checksums.txt is produced INSIDE the cached moon dist task, so it
      # structurally cannot cover an artifact built on another runner.
      # Regenerate over the merged dist/ before anything reads it - the
      # `gh release upload` below globs dist/pond-* and would otherwise ship a
      # checksums file with no line for the Windows zip.
      - name: Merge the Windows zip into checksums
        run: |
          set -euo pipefail
          test -f dist/pond-x86_64-pc-windows-msvc.zip
          ( cd dist && sha256sum pond-* > checksums.txt )
          cat dist/checksums.txt

      # Same binstall exposure as release-prep (see the comment there). The Linux
      # bootstrap installs rustup with --default-toolchain none and materializes
      # only the pin, so stable has to be added explicitly - rustup 1.28+ no
      # longer auto-installs the toolchain RUSTUP_TOOLCHAIN names.
      - name: Add stable for the release-plz install fallback
        run: rustup toolchain install stable --no-self-update --profile minimal

      - uses: release-plz/action@1a0c5beec2fe4e91727549b5d2d0715ed28684bb # v0.5.131
        id: release-plz
        with: { command: release, config: .github/release-plz.toml }
        env:
          RUSTUP_TOOLCHAIN: stable
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Assemble pond's own release first: it is the single host of the release
      # binaries - the homebrew formula, the repo flake (ops/nix), and the pond-nix legacy
      # mirror all fetch from it - so it must be complete before anything else.
      - name: Mirror binaries to pond release
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release upload "v$V" dist/pond-* dist/checksums.txt --repo tenequm/pond --clobber

      # One rendered nix derivation feeds both the repo flake (canonical,
      # github:tenequm/pond - the root flake.nix callPackages this file) and
      # the pond-nix legacy mirror.
      - name: Render nix package
        if: ${{ steps.release-plz.outputs.releases_created }}
        run: |
          set -euo pipefail
          sha() { sha256sum "dist/pond-$1.tar.xz" | cut -d' ' -f1; }
          cat > "$RUNNER_TEMP/pond.nix" <<EOF
          { lib, fetchurl, stdenv, autoPatchelfHook, installShellFiles, zlib }:
          let
            inherit (stdenv) hostPlatform;
            inherit (hostPlatform) system;
            version = "$V";
            base = "https://github.com/tenequm/pond/releases/download/v\${version}";
            shaMap = {
              x86_64-linux = "$(sha x86_64-unknown-linux-gnu)";
              aarch64-linux = "$(sha aarch64-unknown-linux-gnu)";
              aarch64-darwin = "$(sha aarch64-apple-darwin)";
            };
            urlMap = {
              x86_64-linux = "\${base}/pond-x86_64-unknown-linux-gnu.tar.xz";
              aarch64-linux = "\${base}/pond-aarch64-unknown-linux-gnu.tar.xz";
              aarch64-darwin = "\${base}/pond-aarch64-apple-darwin.tar.xz";
            };
          in
          stdenv.mkDerivation {
            pname = "pond";
            inherit version;

            src = fetchurl {
              url = urlMap.\${system};
              sha256 = shaMap.\${system};
            };

            sourceRoot = ".";

            # Prebuilt glibc ELF won't run on NixOS until its interpreter and RPATH
            # are rewritten to Nix-store paths; darwin Mach-O needs no patching.
            nativeBuildInputs = [ installShellFiles ] ++ lib.optionals hostPlatform.isLinux [ autoPatchelfHook ];

            # The released Linux build is CPU-only candle + vendored onig + rustls,
            # so the sole dynamic deps beyond glibc are libgcc_s/libstdc++.
            buildInputs = lib.optionals hostPlatform.isLinux [ stdenv.cc.cc.lib zlib ];

            # Completions ship pre-generated in the tarball: the binary can't
            # run here (autoPatchelfHook rewrites the interpreter later, in
            # fixupPhase).
            installPhase = ''
              runHook preInstall
              install -Dm755 pond \$out/bin/pond
              installShellCompletion --bash completions/pond.bash --zsh completions/_pond --fish completions/pond.fish
              runHook postInstall
            '';

            meta = {
              description = "Lossless storage, full-text search, and optional semantic search for sessions from any AI agent client";
              homepage = "https://pond.locker/";
              changelog = "https://github.com/tenequm/pond/releases/tag/v\${version}";
              license = lib.licenses.asl20;
              mainProgram = "pond";
              sourceProvenance = with lib.sourceTypes; [ binaryNativeCode ];
              platforms = [ "aarch64-darwin" "aarch64-linux" "x86_64-linux" ];
              maintainers = with lib.maintainers; [ ];
            };
          }
          EOF

      # The tag was cut from this checkout's HEAD, so this lands one commit
      # after it: tag-pinned flake refs carry the previous release's hashes,
      # main is always current. [skip ci] keeps the push from triggering CI.
      - name: Point the repo flake at the new binaries
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_RELEASE_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}" }
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/pond.nix" ops/nix/pond.nix
          git add ops/nix/pond.nix
          git -c user.name=ci -c user.email=ci@pond commit -m "chore(release): point flake at v$V binaries [skip ci]"
          git fetch "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/pond" main
          git rebase FETCH_HEAD
          git push "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/pond" HEAD:main

      - name: Publish Homebrew formula
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_RELEASE_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}" }
        run: |
          set -euo pipefail
          base="https://github.com/tenequm/pond/releases/download/v$V"
          sha() { sha256sum "dist/pond-$1.tar.xz" | cut -d' ' -f1; }
          tap="$RUNNER_TEMP/tap"
          rm -rf "$tap"
          git clone --depth 1 "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/homebrew-tap" "$tap"
          cat > "$tap/Formula/pond.rb" <<EOF
          # typed: false
          # frozen_string_literal: true

          class Pond < Formula
            desc "Lossless storage, full-text search, and optional semantic search for sessions from any AI agent client"
            homepage "https://pond.locker/"
            license "Apache-2.0"

            livecheck do
              url :stable
              strategy :github_releases
              regex(/^v?(\d+(?:\.\d+)+)\$/i)
            end

            on_macos do
              # Apple Silicon only: there is no x86_64-apple-darwin build, so
              # depends_on refuses Intel before any download is attempted.
              depends_on arch: :arm64
              url "$base/pond-aarch64-apple-darwin.tar.xz"
              sha256 "$(sha aarch64-apple-darwin)"
            end

            on_linux do
              on_intel do
                url "$base/pond-x86_64-unknown-linux-gnu.tar.xz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
              on_arm do
                url "$base/pond-aarch64-unknown-linux-gnu.tar.xz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "pond"
              generate_completions_from_executable(bin/"pond", "completions")
            end

            test do
              assert_match "pond #{version}", shell_output("#{bin}/pond --version")
              system bin/"pond", "--help"
              assert_match "_pond", shell_output("#{bin}/pond completions zsh")
            end
          end
          EOF
          git -C "$tap" add Formula/pond.rb
          git -C "$tap" diff --quiet --staged || git -C "$tap" -c user.name=ci -c user.email=ci@pond commit -m "pond $V"
          git -C "$tap" push
      # Legacy mirror for existing github:tenequm/pond-nix users; the canonical
      # flake now lives in this repo. Both fetch binaries from pond's release,
      # so pond-nix no longer gets releases of its own.
      - name: Update pond-nix legacy mirror
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_RELEASE_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}" }
        run: |
          set -euo pipefail
          nix="$RUNNER_TEMP/pond-nix"
          rm -rf "$nix"
          git clone --depth 1 "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/pond-nix" "$nix"
          mkdir -p "$nix/pkgs/pond"
          cp "$RUNNER_TEMP/pond.nix" "$nix/pkgs/pond/default.nix"
          git -C "$nix" add pkgs/pond/default.nix
          git -C "$nix" diff --quiet --staged || git -C "$nix" -c user.name=ci -c user.email=ci@pond commit -m "pond $V"
          git -C "$nix" push

  # The npm plugins (openclaw-pond, pi-pond) ride the same release train,
  # published right after the crate release so a new binary never waits on
  # stale plugin descriptions. GitHub-hosted runner ONLY: npm trusted
  # publishing (OIDC) does not support self-hosted runners. Auth is the
  # workflow id-token - no npm token secret exists - which also earns the
  # packages provenance attestations; each package's npmjs.com settings name
  # this repo + ci.yml as the trusted publisher. Idempotent via the
  # registry-version check in the script: a release without a plugin version
  # bump publishes nothing, and "Re-run failed jobs" retries safely.
  npm-publish:
    needs: [publish-release]
    if: ${{ needs.publish-release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # OIDC token for npm trusted publishing
      contents: read
    # Same rule as flake-check/macos-verify: the workflow-level env hands the
    # remote-cache secret to every job; nothing here needs it.
    env:
      BAZEL_REMOTE_AUTH: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: ops/scripts/publish-npm.sh packages/openclaw-pond packages/pi-pond

  # Not `on: release`: release-plz publishes the release, and publish-release
  # uploads the binaries to it several steps later, so a release-triggered run
  # would hand winget-releaser an empty installer list. Its own job rather than
  # a step in publish-release so an upstream hiccup cannot red-flag a release
  # that already published; "Re-run failed jobs" retries just this.
  winget-publish:
    needs: [dist-build, publish-release]
    if: ${{ needs.publish-release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same rule as flake-check/macos-verify: the workflow-level env hands this
    # secret to every job, and the action below binstalls and runs komac.
    env:
      BAZEL_REMOTE_AUTH: ""
    steps:
      # winget-releaser hard-fails until the package exists upstream; self-clears once microsoft/winget-pkgs#419055 merges.
      - id: winget
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api repos/microsoft/winget-pkgs/contents/manifests/t/tenequm/pond >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::winget package tenequm.pond is not yet in microsoft/winget-pkgs (microsoft/winget-pkgs#419055 still open); skipping winget-releaser"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.winget.outputs.present == 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: tenequm.pond
          version: ${{ needs.dist-build.outputs.v }}
          # Unlimited (the default) would accumulate every pond patch release in
          # winget-pkgs. Trades away `winget install --version` for versions
          # older than the last 5.
          max-versions-to-keep: 5
          # Defaults to github.ref_name, which is `main` here.
          release-tag: v${{ needs.dist-build.outputs.v }}
          # The default regex matches exe/msi/msix/appx only; pond ships a
          # portable zip, so without this the manifest gets no installer URL.
          installers-regex: '\.zip$'
          # Classic PAT: winget-releaser rejects fine-grained tokens.
          token: ${{ secrets.WINGET_PAT }}
