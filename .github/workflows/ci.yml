name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default read-only; publish-release elevates to contents:write for its own
# `gh release upload`. The release PR and publishes use the GH_RELEASE_TOKEN
# PAT, not the workflow token.
permissions:
  contents: read

# Concurrency is per-job, not workflow-level: a workflow-level cancel-in-progress
# also kills an in-flight release mid-publish (after release-plz cuts the tag, the
# is_release gate is false forever, so an interrupted publish can't auto-recover).
# So builds stay cancellable while publish-release is made non-cancellable below.

env:
  CARGO_TERM_COLOR: always
  # Remote cache only when the secret exists: fork PRs get no secrets and
  # moon hard-fails a configured remote with an empty auth header. Inert for
  # jobs that don't run moon.
  MOON_REMOTE_HOST: ${{ secrets.BAZEL_REMOTE_AUTH != '' && 'grpcs://bazel-remote.cascade.fyi:443' || '' }}
  BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}

jobs:
  build-and-test:
    # In-cluster ARC ephemeral runner (scale set `pond-ci`). Toolchain, cargo
    # registry, and target/ live on the runner's /ci-cache PVC, which persists
    # across the ephemeral pods.
    runs-on: pond-ci
    timeout-minutes: 60
    # A newer push to the same ref supersedes an in-flight build.
    concurrency: { group: "ci-build-${{ github.ref }}", cancel-in-progress: true }
    steps:
      # Full history: moon's vcs layer resolves vcs.defaultBranch, which a
      # shallow PR checkout doesn't have (git exit 128).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
      # One moon session: independent tasks interleave (cargo serializes the
      # heavy ones on its target-dir lock; format/changelog are instant). The
      # plugin suites run here too - they cost seconds next to the Rust build,
      # and moon provisions their node/uv itself, so they need nothing from the
      # bootstrap.
      - run: >
          moon run
          repo:check-changelog
          pond:check-package pond:format pond:lint pond:test
          openclaw-pond:typecheck openclaw-pond:test
          hermes-pond:test

  # Hosted, never pond-ci: those runner pods are unprivileged with a root-owned
  # /nix (the image ships nix-bin only for `nix-hash`), so nix there would need
  # its sandbox off - weaker conditions than the users this check protects.
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: { group: "ci-flake-${{ github.ref }}", cancel-in-progress: true }
    # The workflow-level env hands this secret to every job, and the last step
    # runs a binary downloaded from a GitHub release. Blank it here.
    env:
      BAZEL_REMOTE_AUTH: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      # Without --all-systems the darwin and aarch64 outputs go unevaluated on
      # an x86_64 runner and the job passes anyway.
      - run: nix flake check --all-systems --no-update-lock-file
      # ops/nix is a second flake with its own lock, not reached by the root
      # check; it backs the older `?dir=ops/nix#pond` install URL.
      - run: nix flake check ./ops/nix --all-systems --no-update-lock-file
      # flake check only evaluates - nothing above ever fetches a tarball. This
      # is the step that proves the rendered sha256/URLs and autoPatchelfHook.
      - run: nix run .#pond -- --version

  # Maintain the release PR, and report ONLY whether a release is pending.
  # Detection is the tag check - release-plz's own first gate is "skip a package
  # whose tag already exists". (dry-run can't report this: in dry-run release-plz
  # always emits releases_created=false, it only logs the plan.)
  release-prep:
    # A skipped `needs` job skips its dependents, so flake-check must stay
    # unconditional: give it a `paths:` filter or an `if:` and releases silently
    # stop happening.
    needs: [build-and-test, flake-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: "release-plz-${{ github.ref }}", cancel-in-progress: false }
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # SHA-pinned, so the toolchain must be an explicit input (the action
      # otherwise derives it from the ref name).
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: stable }
      - uses: release-plz/action@1a0c5beec2fe4e91727549b5d2d0715ed28684bb # v0.5.131
        with: { command: release-pr, config: .github/release-plz.toml }   # keep the release PR current; never publishes
        env:
          # PAT (not GITHUB_TOKEN) so the opened release PR triggers build-and-test.
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - id: detect
        run: |
          set -euo pipefail
          V=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[]|select(.name=="pond-db").version')
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi

  # Build + Developer ID sign. Split from publish-release so notarization and
  # the macOS checks can gate the publish without re-running the 4-target build.
  dist-build:
    needs: [release-prep]
    if: needs.release-prep.outputs.is_release == 'true'
    # ARC runner pod: zig/zigbuild/SDK/rcodesign come from the pond-runner
    # image, incremental cache on /ci-cache - no docker, no buildkit.
    runs-on: pond-ci
    # A fully cold 4-target dist build measured 56m; warm runs are minutes.
    timeout-minutes: 90
    concurrency: { group: "pond-dist-${{ github.ref }}", cancel-in-progress: false }
    outputs:
      v: ${{ steps.ver.outputs.v }}
      signed: ${{ steps.identity.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/bootstrap

      # Reports only whether the cert exists, never its value: the signature
      # and notarize steps skip cleanly until the Apple secrets are populated,
      # so this lands safely before the credentials do.
      - id: identity
        run: echo "signed=${{ secrets.APPLE_P12_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Build + package binaries
        run: moon run repo:build-dist
        env:
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}
          KACHE_S3_REGION: nbg1
          KACHE_S3_BUCKET: ttq
          KACHE_S3_ENDPOINT: https://nbg1.your-objectstorage.com
          KACHE_S3_PREFIX: kache/pond
          # Local store on the PVC so pods start warm and sync only moves
          # deltas; cap it well below the 100Gi shared PVC.
          KACHE_CACHE_DIR: /ci-cache/kache
          KACHE_MAX_SIZE: 20GiB
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}

      - id: ver
        run: echo "v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[]|select(.name=="pond-db").version')" >> "$GITHUB_OUTPUT"

      # Two artifacts, not one: the macOS jobs only need the 38MB darwin
      # tarball, while publish needs all four plus checksums.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-darwin
          path: dist/pond-aarch64-apple-darwin.tar.xz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-all
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Notarization does NOT alter the artifact: a bare Mach-O has nowhere to hold
  # a ticket, so Apple serves it online and every sha256 computed from the
  # signed binary in dist-build stays valid.
  #
  # One macOS job does launch smoke, signature assertions, and notarization:
  # macos-15 ships `xcrun notarytool`, so the Mac notarizes itself rather than
  # bouncing the artifact through a second Linux job.
  macos-verify:
    needs: [dist-build]
    runs-on: macos-15
    timeout-minutes: 45
    # Same rule as flake-check: this job runs a binary built elsewhere.
    env: { BAZEL_REMOTE_AUTH: "" }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist-darwin }

      # The cross-compiled Mach-O is never built or run on macOS before this.
      # `completions` is what the Homebrew formula shells out to at install
      # time, so a binary that cannot run here breaks `brew install`, not just
      # `pond`.
      - name: Launch the cross-compiled binary
        run: |
          set -euo pipefail
          tar -xJf pond-aarch64-apple-darwin.tar.xz
          ./pond --version
          ./pond --help > /dev/null
          ./pond completions zsh | grep -q '_pond'

      - name: Verify code signature
        if: needs.dist-build.outputs.signed == 'true'
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 ./pond
          # Gatekeeper cannot be asked directly: `spctl --assess --type exec`
          # rejects ANY bare CLI binary ("does not seem to be an app"), even a
          # correctly notarized one. Assert the two properties notarization
          # actually requires instead.
          codesign -dvvv ./pond 2>&1 | tee sig.txt
          grep -q 'Authority=Developer ID Application' sig.txt
          grep -qE 'flags=0x[0-9a-f]*\(.*runtime.*\)' sig.txt

      - name: Notarize with Apple
        if: needs.dist-build.outputs.signed == 'true'
        env:
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The notary accepts .zip/.dmg/.pkg only - this zip is a submission
          # envelope, never a released asset. A bare Mach-O cannot be stapled,
          # so Apple serves the ticket online and the artifact is unchanged.
          ditto -c -k ./pond notarize.zip
          creds="$(mktemp -d)"
          printf '%s' "$APPLE_ASC_KEY_P8" | base64 --decode > "$creds/key.p8"
          # `notarytool submit --wait` exits 0 even when the notary returns
          # Invalid, so the JSON status is the gate, not the exit code.
          xcrun notarytool submit notarize.zip \
            --key "$creds/key.p8" \
            --key-id "$APPLE_ASC_KEY_ID" \
            --issuer "$APPLE_ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee result.json
          rm -rf "$creds"
          test "$(jq -r .status result.json)" = "Accepted"

  # Publish everywhere. release-plz publishes crates.io + cuts the tag/release
  # HERE (after build AND macos-verify), so crates.io can't ship without
  # binaries, and no channel can ship a binary macOS refuses to run.
  publish-release:
    needs: [dist-build, macos-verify]
    # ARC runner pod: gh + nix-bin come from the runner image; rust lives on
    # the /ci-cache PVC (release-plz runs `cargo publish` here).
    runs-on: pond-ci
    timeout-minutes: 30
    permissions:
      contents: write   # `gh release upload` to this repo via the workflow token
    # Never cancel a release mid-publish: a newer push queues behind this run
    # instead of killing it between release-plz tagging and the four publishes.
    concurrency: { group: "pond-release-${{ github.ref }}", cancel-in-progress: false }
    env:
      V: ${{ needs.dist-build.outputs.v }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/bootstrap
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist-all, path: dist }

      - uses: release-plz/action@1a0c5beec2fe4e91727549b5d2d0715ed28684bb # v0.5.131
        id: release-plz
        with: { command: release, config: .github/release-plz.toml }
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Assemble pond's own release first: it is the single host of the release
      # binaries - the homebrew formula, the repo flake (ops/nix), and the pond-nix legacy
      # mirror all fetch from it - so it must be complete before anything else.
      - name: Mirror binaries to pond release
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release upload "v$V" dist/pond-* dist/checksums.txt --repo tenequm/pond --clobber

      # One rendered nix derivation feeds both the repo flake (canonical,
      # github:tenequm/pond - the root flake.nix callPackages this file) and
      # the pond-nix legacy mirror.
      - name: Render nix package
        if: ${{ steps.release-plz.outputs.releases_created }}
        run: |
          set -euo pipefail
          sha() { sha256sum "dist/pond-$1.tar.xz" | cut -d' ' -f1; }
          cat > "$RUNNER_TEMP/pond.nix" <<EOF
          { lib, fetchurl, stdenv, autoPatchelfHook, installShellFiles, zlib }:
          let
            inherit (stdenv) hostPlatform;
            inherit (hostPlatform) system;
            version = "$V";
            base = "https://github.com/tenequm/pond/releases/download/v\${version}";
            shaMap = {
              x86_64-linux = "$(sha x86_64-unknown-linux-gnu)";
              aarch64-linux = "$(sha aarch64-unknown-linux-gnu)";
              aarch64-darwin = "$(sha aarch64-apple-darwin)";
            };
            urlMap = {
              x86_64-linux = "\${base}/pond-x86_64-unknown-linux-gnu.tar.xz";
              aarch64-linux = "\${base}/pond-aarch64-unknown-linux-gnu.tar.xz";
              aarch64-darwin = "\${base}/pond-aarch64-apple-darwin.tar.xz";
            };
          in
          stdenv.mkDerivation {
            pname = "pond";
            inherit version;

            src = fetchurl {
              url = urlMap.\${system};
              sha256 = shaMap.\${system};
            };

            sourceRoot = ".";

            # Prebuilt glibc ELF won't run on NixOS until its interpreter and RPATH
            # are rewritten to Nix-store paths; darwin Mach-O needs no patching.
            nativeBuildInputs = [ installShellFiles ] ++ lib.optionals hostPlatform.isLinux [ autoPatchelfHook ];

            # The released Linux build is CPU-only candle + vendored onig + rustls,
            # so the sole dynamic deps beyond glibc are libgcc_s/libstdc++.
            buildInputs = lib.optionals hostPlatform.isLinux [ stdenv.cc.cc.lib zlib ];

            # Completions ship pre-generated in the tarball: the binary can't
            # run here (autoPatchelfHook rewrites the interpreter later, in
            # fixupPhase).
            installPhase = ''
              runHook preInstall
              install -Dm755 pond \$out/bin/pond
              installShellCompletion --bash completions/pond.bash --zsh completions/_pond --fish completions/pond.fish
              runHook postInstall
            '';

            meta = {
              description = "Lossless storage and hybrid search for sessions from any AI agent client";
              homepage = "https://pond.locker/";
              changelog = "https://github.com/tenequm/pond/releases/tag/v\${version}";
              license = lib.licenses.asl20;
              mainProgram = "pond";
              sourceProvenance = with lib.sourceTypes; [ binaryNativeCode ];
              platforms = [ "aarch64-darwin" "aarch64-linux" "x86_64-linux" ];
              maintainers = with lib.maintainers; [ ];
            };
          }
          EOF

      # The tag was cut from this checkout's HEAD, so this lands one commit
      # after it: tag-pinned flake refs carry the previous release's hashes,
      # main is always current. [skip ci] keeps the push from triggering CI.
      - name: Point the repo flake at the new binaries
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_RELEASE_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}" }
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/pond.nix" ops/nix/pond.nix
          git add ops/nix/pond.nix
          git -c user.name=ci -c user.email=ci@pond commit -m "chore(release): point flake at v$V binaries [skip ci]"
          git fetch "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/pond" main
          git rebase FETCH_HEAD
          git push "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/pond" HEAD:main

      - name: Publish Homebrew formula
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_RELEASE_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}" }
        run: |
          set -euo pipefail
          base="https://github.com/tenequm/pond/releases/download/v$V"
          sha() { sha256sum "dist/pond-$1.tar.xz" | cut -d' ' -f1; }
          tap="$RUNNER_TEMP/tap"
          rm -rf "$tap"
          git clone --depth 1 "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/homebrew-tap" "$tap"
          cat > "$tap/Formula/pond.rb" <<EOF
          # typed: false
          # frozen_string_literal: true

          class Pond < Formula
            desc "Lossless storage and hybrid search for sessions from any AI agent client"
            homepage "https://pond.locker/"
            license "Apache-2.0"

            livecheck do
              url :stable
              strategy :github_releases
              regex(/^v?(\d+(?:\.\d+)+)\$/i)
            end

            on_macos do
              # Apple Silicon only: there is no x86_64-apple-darwin build, so
              # depends_on refuses Intel before any download is attempted.
              depends_on arch: :arm64
              url "$base/pond-aarch64-apple-darwin.tar.xz"
              sha256 "$(sha aarch64-apple-darwin)"
            end

            on_linux do
              on_intel do
                url "$base/pond-x86_64-unknown-linux-gnu.tar.xz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
              on_arm do
                url "$base/pond-aarch64-unknown-linux-gnu.tar.xz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "pond"
              generate_completions_from_executable(bin/"pond", "completions")
            end

            test do
              assert_match "pond #{version}", shell_output("#{bin}/pond --version")
              system bin/"pond", "--help"
              assert_match "_pond", shell_output("#{bin}/pond completions zsh")
            end
          end
          EOF
          git -C "$tap" add Formula/pond.rb
          git -C "$tap" diff --quiet --staged || git -C "$tap" -c user.name=ci -c user.email=ci@pond commit -m "pond $V"
          git -C "$tap" push
      # Legacy mirror for existing github:tenequm/pond-nix users; the canonical
      # flake now lives in this repo. Both fetch binaries from pond's release,
      # so pond-nix no longer gets releases of its own.
      - name: Update pond-nix legacy mirror
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_RELEASE_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}" }
        run: |
          set -euo pipefail
          nix="$RUNNER_TEMP/pond-nix"
          rm -rf "$nix"
          git clone --depth 1 "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/pond-nix" "$nix"
          mkdir -p "$nix/pkgs/pond"
          cp "$RUNNER_TEMP/pond.nix" "$nix/pkgs/pond/default.nix"
          git -C "$nix" add pkgs/pond/default.nix
          git -C "$nix" diff --quiet --staged || git -C "$nix" -c user.name=ci -c user.email=ci@pond commit -m "pond $V"
          git -C "$nix" push
