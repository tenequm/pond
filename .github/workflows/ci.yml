name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default read-only; publish-release elevates to contents:write for its own
# `gh release upload`. The release PR and publishes use the GH_RELEASE_TOKEN
# PAT, not the workflow token.
permissions:
  contents: read

# Concurrency is per-job, not workflow-level: a workflow-level cancel-in-progress
# also kills an in-flight release mid-publish (after release-plz cuts the tag, the
# is_release gate is false forever, so an interrupted publish can't auto-recover).
# So builds stay cancellable while publish-release is made non-cancellable below.

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    # A newer push to the same ref supersedes an in-flight build.
    concurrency: { group: "ci-build-${{ github.ref }}", cancel-in-progress: true }
    env:
      BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}
    steps:
      # clean: false persists target/ + caches on the self-hosted disk between
      # runs. moon, cargo/rustc, protoc, and kache are preinstalled on the runner.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          clean: false
      - run: moon run pond:format
      - run: moon run pond:lint
      - run: moon run pond:test

  # Maintain the release PR, and report ONLY whether a release is pending.
  # Detection is the tag check - release-plz's own first gate is "skip a package
  # whose tag already exists". (dry-run can't report this: in dry-run release-plz
  # always emits releases_created=false, it only logs the plan.)
  release-prep:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: "release-plz-${{ github.ref }}", cancel-in-progress: false }
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0, persist-credentials: false }
      # SHA-pinned, so the toolchain must be an explicit input (the action
      # otherwise derives it from the ref name).
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: stable }
      - uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with: { command: release-pr }   # keep the release PR current; never publishes
        env:
          # PAT (not GITHUB_TOKEN) so the opened release PR triggers build-and-test.
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - id: detect
        run: |
          set -euo pipefail
          V=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[]|select(.name=="pond-db").version')
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi

  # Build, then publish everywhere. release-plz publishes crates.io + cuts the
  # tag/release HERE (after the build), so crates.io can't ship without binaries.
  publish-release:
    needs: [release-prep]
    if: needs.release-prep.outputs.is_release == 'true'
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write   # `gh release upload` to this repo via the workflow token
    # Never cancel a release mid-publish: a newer push queues behind this run
    # instead of killing it between release-plz tagging and the four publishes.
    concurrency: { group: "pond-release-${{ github.ref }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0, clean: false, persist-credentials: false }
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Bootstrap cluster access + buildx builder
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_CASCADE }}
        run: |
          export KUBECONFIG="$RUNNER_TEMP/.kube-cascade"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          printf '%s' "$KUBECONFIG_DATA" | base64 -d > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          docker buildx rm pond-hetzner 2>/dev/null || true
          # PVC -> StatefulSet so the RUN --mount=type=cache dirs survive autoshutdown
          # scale-to-0 (x402 buildkit-autoshutdown chart). Needs buildx >= v0.34.0.
          docker buildx create --name pond-hetzner --driver kubernetes \
            --driver-opt namespace=pond-buildkit,replicas=1,nodeselector=workload=buildkit,timeout=10m \
            --driver-opt requests.cpu=12,requests.memory=24Gi,limits.memory=48Gi \
            --driver-opt persistent-volume-claim.requests.storage=100Gi \
            --platform linux/amd64

      - name: Build + package binaries
        run: moon run pond:build-dist
        env:
          # moon's remote cache (bazel-remote gRPC) needs this here too; the
          # build-and-test job scopes its own copy separately.
          BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}
          KACHE_S3_REGION: nbg1
          # Bucket-virtual-host form; build-dist strips the bucket subdomain to
          # derive the buildx S3 cache endpoint.
          KACHE_S3_ENDPOINT: https://ttq.nbg1.your-objectstorage.com

      - id: ver
        run: echo "v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[]|select(.name=="pond-db").version')" >> "$GITHUB_OUTPUT"
      
      - uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        id: release-plz
        with: { command: release }
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Assemble pond's own release first: it is the source of truth the
      # homebrew/nix mirrors copy their notes from, so it must be complete before
      # any mirror runs - and a later mirror failure must never starve it.
      - name: Mirror binaries to pond release
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", V: "${{ steps.ver.outputs.v }}" }
        run: gh release upload "v$V" dist/pond-* dist/checksums.txt --repo tenequm/pond --clobber

      - name: Release binaries to homebrew-tap
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}", V: "${{ steps.ver.outputs.v }}" }
        # Explicit globs, not dist/*: the self-hosted runner persists dist/ and
        # carries stale goreleaser-era files (incl a 0-byte digests.txt that
        # GitHub rejects with "Bad Content-Length"). pond-* + checksums.txt is
        # exactly our archives, signatures, and checksums.
        # Notes mirror pond's own release body (release-plz changelog) so
        # downstream tap users see the changelog without a second lookup.
        run: |
          notes=$(gh release view "v$V" -R tenequm/pond --json body -q .body)
          gh release create "pond-v$V" dist/pond-* dist/checksums.txt --repo tenequm/homebrew-tap \
            --title "pond v$V" --notes "$notes" \
          || gh release upload "pond-v$V" dist/pond-* dist/checksums.txt --repo tenequm/homebrew-tap --clobber
          gh release edit "pond-v$V" --repo tenequm/homebrew-tap --title "pond v$V" --notes "$notes"

      - name: Publish Homebrew formula
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_RELEASE_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}", V: "${{ steps.ver.outputs.v }}" }
        run: |
          set -euo pipefail
          base="https://github.com/tenequm/homebrew-tap/releases/download/pond-v$V"
          sha() { sha256sum "dist/pond-$1.tar.xz" | cut -d' ' -f1; }
          # Clone outside the workspace: a clone left in the working tree would
          # persist (clean:false) and make `cargo publish` refuse a dirty tree.
          tap="$RUNNER_TEMP/tap"
          rm -rf "$tap"
          git clone --depth 1 "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/homebrew-tap" "$tap"
          cat > "$tap/Formula/pond.rb" <<EOF
          # typed: false
          # frozen_string_literal: true

          class Pond < Formula
            desc "Lossless storage and hybrid search for sessions from any AI agent client"
            homepage "https://pond.locker/"
            version "$V"
            license "Apache-2.0"

            livecheck do
              url :stable
              strategy :github_releases
              regex(/^pond[._-]v?(\d+(?:\.\d+)+)\$/i)
            end

            on_macos do
              on_arm do
                url "$base/pond-aarch64-apple-darwin.tar.xz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
            end

            on_linux do
              on_intel do
                url "$base/pond-x86_64-unknown-linux-gnu.tar.xz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
              on_arm do
                url "$base/pond-aarch64-unknown-linux-gnu.tar.xz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "pond"
              generate_completions_from_executable(bin/"pond", "completions")
            end

            test do
              assert_match "pond #{version}", shell_output("#{bin}/pond --version")
              system bin/"pond", "--help"
              assert_match "_pond", shell_output("#{bin}/pond completions zsh")
            end
          end
          EOF
          git -C "$tap" add Formula/pond.rb
          git -C "$tap" diff --quiet --staged || git -C "$tap" -c user.name=ci -c user.email=ci@pond commit -m "pond $V"
          git -C "$tap" push
      - name: Publish pond-nix package
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_RELEASE_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}", GH_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}", V: "${{ steps.ver.outputs.v }}" }
        run: |
          set -euo pipefail
          # pond-nix hosts its own binaries; the flake fetches from this repo's releases.
          base="https://github.com/tenequm/pond-nix/releases/download/pond-v$V"
          nix32() { nix-hash --type sha256 --to-base32 "$(sha256sum "dist/pond-$1.tar.xz" | cut -d' ' -f1)"; }
          nix="$RUNNER_TEMP/pond-nix"
          rm -rf "$nix"
          git clone --depth 1 "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/pond-nix" "$nix"
          mkdir -p "$nix/pkgs/pond"
          cat > "$nix/pkgs/pond/default.nix" <<EOF
          { lib, fetchurl, stdenv, autoPatchelfHook, installShellFiles, zlib }:
          let
            inherit (stdenv) hostPlatform;
            inherit (hostPlatform) system;
            version = "$V";
            shaMap = {
              x86_64-linux = "$(nix32 x86_64-unknown-linux-gnu)";
              aarch64-linux = "$(nix32 aarch64-unknown-linux-gnu)";
              aarch64-darwin = "$(nix32 aarch64-apple-darwin)";
            };
            urlMap = {
              x86_64-linux = "$base/pond-x86_64-unknown-linux-gnu.tar.xz";
              aarch64-linux = "$base/pond-aarch64-unknown-linux-gnu.tar.xz";
              aarch64-darwin = "$base/pond-aarch64-apple-darwin.tar.xz";
            };
          in
          stdenv.mkDerivation {
            pname = "pond";
            inherit version;

            src = fetchurl {
              url = urlMap.\${system};
              sha256 = shaMap.\${system};
            };

            sourceRoot = ".";

            # Prebuilt glibc ELF won't run on NixOS until its interpreter and RPATH
            # are rewritten to Nix-store paths; darwin Mach-O needs no patching.
            nativeBuildInputs = [ installShellFiles ] ++ lib.optionals hostPlatform.isLinux [ autoPatchelfHook ];

            # The released Linux build is CPU-only candle + vendored onig + rustls,
            # so the sole dynamic deps beyond glibc are libgcc_s/libstdc++.
            buildInputs = lib.optionals hostPlatform.isLinux [ stdenv.cc.cc.lib zlib ];

            # Completions ship pre-generated in the tarball: the binary can't
            # run here (autoPatchelfHook rewrites the interpreter later, in
            # fixupPhase).
            installPhase = ''
              runHook preInstall
              install -Dm755 pond \$out/bin/pond
              installShellCompletion --bash completions/pond.bash --zsh completions/_pond --fish completions/pond.fish
              runHook postInstall
            '';

            meta = {
              description = "Lossless storage and hybrid search for sessions from any AI agent client";
              homepage = "https://pond.locker/";
              changelog = "https://github.com/tenequm/pond-nix/releases/tag/pond-v\${version}";
              license = lib.licenses.asl20;
              mainProgram = "pond";
              sourceProvenance = with lib.sourceTypes; [ binaryNativeCode ];
              platforms = [ "aarch64-darwin" "aarch64-linux" "x86_64-linux" ];
              maintainers = with lib.maintainers; [ ];
            };
          }
          EOF
          git -C "$nix" add pkgs/pond/default.nix
          git -C "$nix" diff --quiet --staged || git -C "$nix" -c user.name=ci -c user.email=ci@pond commit -m "pond $V"
          git -C "$nix" push
          # The flake fetches binaries from this release; attach the tarballs +
          # the changelog notes, and target the default.nix commit we just pushed.
          notes=$(gh release view "v$V" -R tenequm/pond --json body -q .body)
          gh release create "pond-v$V" dist/pond-*.tar.xz dist/checksums.txt --repo tenequm/pond-nix \
            --target "$(git -C "$nix" rev-parse HEAD)" --title "pond v$V" --notes "$notes" \
          || { gh release upload "pond-v$V" dist/pond-*.tar.xz dist/checksums.txt --repo tenequm/pond-nix --clobber; \
               gh release edit "pond-v$V" --repo tenequm/pond-nix --title "pond v$V" --notes "$notes"; }
