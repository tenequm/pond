name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64]
    steps:
      # clean: false persists target/ + caches on the self-hosted disk between
      # runs. moon, cargo/rustc, protoc, and kache are preinstalled on the runner.
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          clean: false
      - run: moon run pond:format
      - run: moon run pond:lint
      - run: moon run pond:test

  # Maintain the release PR, and report ONLY whether a release is pending.
  # Detection is the tag check - release-plz's own first gate is "skip a package
  # whose tag already exists". (dry-run can't report this: in dry-run release-plz
  # always emits releases_created=false, it only logs the plan.)
  release-prep:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: "release-plz-${{ github.ref }}", cancel-in-progress: false }
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
    steps:
      - uses: actions/checkout@v6.0.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with: { command: release-pr }   # keep the release PR current; never publishes
        env:
          # PAT (not GITHUB_TOKEN) so the opened release PR triggers build-and-test.
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - id: detect
        run: |
          set -euo pipefail
          V=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[]|select(.name=="pond-db").version')
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi

  # Build, then publish everywhere. release-plz publishes crates.io + cuts the
  # tag/release HERE (after the build), so crates.io can't ship without binaries.
  publish-release:
    needs: [release-prep]
    if: needs.release-prep.outputs.is_release == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6.0.2
        with: { fetch-depth: 0, clean: false, persist-credentials: false }
      - uses: cachix/install-nix-action@v31   # nix-hash for publish-nur

      - name: Bootstrap cluster access + buildx builder
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_CASCADE }}
        run: |
          export KUBECONFIG="$RUNNER_TEMP/.kube-cascade"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          printf '%s' "$KUBECONFIG_DATA" | base64 -d > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          docker buildx rm pond-hetzner 2>/dev/null || true
          # PVC -> StatefulSet so the RUN --mount=type=cache dirs survive autoshutdown
          # scale-to-0 (x402 buildkit-autoshutdown chart). Needs buildx >= v0.34.0.
          docker buildx create --name pond-hetzner --driver kubernetes \
            --driver-opt namespace=pond-buildkit,replicas=1,nodeselector=workload=buildkit,timeout=10m \
            --driver-opt requests.cpu=12,requests.memory=24Gi,limits.memory=48Gi \
            --driver-opt persistent-volume-claim.requests.storage=100Gi \
            --platform linux/amd64

      - name: Build + package binaries
        run: moon run pond:build-dist
        env:
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}
          KACHE_S3_REGION: nbg1
          # Bucket-virtual-host form; build-dist strips the bucket subdomain to
          # derive the buildx S3 cache endpoint.
          KACHE_S3_ENDPOINT: https://ttq.nbg1.your-objectstorage.com

      - id: ver
        run: echo "v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[]|select(.name=="pond-db").version')" >> "$GITHUB_OUTPUT"
      
      - uses: release-plz/action@v0.5
        with: { command: release }
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Release binaries to homebrew-tap
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}", V: "${{ steps.ver.outputs.v }}" }
        # Explicit globs, not dist/*: the self-hosted runner persists dist/ and
        # carries stale goreleaser-era files (incl a 0-byte digests.txt that
        # GitHub rejects with "Bad Content-Length"). pond-* + checksums.txt is
        # exactly our archives, signatures, and checksums.
        run: |
          gh release create "pond-v$V" dist/pond-* dist/checksums.txt --repo tenequm/homebrew-tap \
            --title "pond v$V" --notes "pond v$V" \
          || gh release upload "pond-v$V" dist/pond-* dist/checksums.txt --repo tenequm/homebrew-tap --clobber

      # crates.io + git tag + GitHub release on pond.


      - name: Publish Homebrew formula
        if: ${{ steps.release-plz.outputs.releases_created }}
        run: moon run pond:publish-brew
        env: { V: "${{ steps.ver.outputs.v }}", GH_RELEASE_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}" }
      - name: Publish NUR package
        if: ${{ steps.release-plz.outputs.releases_created }}
        run: moon run pond:publish-nur
        env: { V: "${{ steps.ver.outputs.v }}", GH_RELEASE_TOKEN: "${{ secrets.GH_RELEASE_TOKEN }}" }

      # Mirror the binaries onto pond's own (private) release.
      - name: Mirror binaries to pond release
        if: ${{ steps.release-plz.outputs.releases_created }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", V: "${{ steps.ver.outputs.v }}" }
        run: gh release upload "v$V" dist/pond-* dist/checksums.txt --repo tenequm/pond --clobber
