name: CI

on:
  push:
    branches: [main]
  # `labeled` is how a PR opts into build-and-test-windows: adding the `windows`
  # label starts a new run, so on an already-green PR wait for that run's ci-ok
  # before merging. Every label re-runs the whole graph on purpose: release-plz
  # labels each release PR (`pr_labels`), and a run skipped at the roots would
  # post an all-skipped green ci-ok over a red one.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Manual trigger, added for the Windows jobs: dist-build-windows is
  # release-gated, so dispatch is the only way to exercise the shipped-artifact
  # path before it reaches main. Side effect accepted: the roots run on dispatch
  # too, and a dispatch on main redeploys the docs. release-prep and everything
  # downstream except dist-build-windows stay push-gated.
  workflow_dispatch:
    inputs:
      force_build:
        description: >
          Compile for real instead of replaying moon's remote cache. Required
          for any run whose kache numbers will be read: a CI-only diff changes
          none of the declared inputs of lint-msvc / test-msvc /
          build-dist-msvc, so moon serves the hash main already stored, cargo
          never runs, and the run yields no kache data.
          NOT a way to prewarm a kache prefix. Since kache 0.17 the remote is
          forced read-only on every event except a push to a protected branch
          (src/policy.rs), so a dispatch pulls and compiles but uploads
          nothing - warm a fresh prefix with a push to main instead.
        type: boolean
        default: false

# Default read-only; publish-release elevates to contents:write for its own
# asset uploads. The release PR and publishes use the GH_RELEASE_TOKEN
# PAT, not the workflow token.
permissions:
  contents: read

# Concurrency is per-job, not workflow-level: a workflow-level cancel-in-progress
# also kills an in-flight release mid-publish (after release-plz cuts the tag, the
# is_release gate is false forever, so an interrupted publish can't auto-recover).
# So builds stay cancellable while publish-release is made non-cancellable below.
#
# ci-ok at the bottom needs every job and is the single required check. Event
# conditions sit on the roots only (release-prep and dist-build-windows are the
# two documented exceptions), so a job's position in the graph says when it runs.

env:
  CARGO_TERM_COLOR: always
  # Remote cache only when the secret exists: fork PRs get no secrets and
  # moon hard-fails a configured remote with an empty auth header. Inert for
  # jobs that don't run moon.
  MOON_REMOTE_HOST: ${{ secrets.BAZEL_REMOTE_AUTH != '' && 'grpcs://bazel-remote.cascade.fyi:443' || '' }}
  BAZEL_REMOTE_AUTH: ${{ secrets.BAZEL_REMOTE_AUTH }}
  # .moon/workspace.yml turns the local CAS + shared worktree cache on for
  # developer machines; env overrides the file, keeping the experiment off CI.
  MOON_EXPERIMENT_CAS_OUTPUTS_CACHE: 'false'

jobs:
  build-and-test-linux:
    # In-cluster ARC ephemeral runner (scale set `pond-ci`). The toolchain comes
    # from the flake devShell, realized in the node's /nix store volume; the
    # cargo registry, target/ and proto's tool tree stay on the /ci-cache PVC.
    # Both persist across the ephemeral pods.
    # Fork PRs run hosted instead: those volumes are writable and shared with
    # the release jobs, so untrusted code must never touch them. Same test as
    # build-and-test-windows, inverted; a PR whose head repo is gone also lands
    # hosted. A hosted run is always cold (the Windows leg measured 76 min
    # cold), hence its longer timeout.
    runs-on: >-
      ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      'ubuntu-latest' || 'pond-ci' }}
    timeout-minutes: >-
      ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      120 || 60 }}
    # A newer push to the same ref supersedes an in-flight build.
    concurrency: { group: "ci-build-${{ github.ref }}", cancel-in-progress: true }
    steps:
      # Full history: moon's vcs layer resolves vcs.defaultBranch, which a
      # shallow PR checkout doesn't have (git exit 128).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Hosted-runner stand-ins for the pod's volumes, so the devshell action
      # runs unchanged: a single-user install leaves /nix owned by the runner
      # user (the daemon install's root-owned store fails the action's
      # writable-store check), and /ci-cache is a throwaway directory.
      # The image guarantees only ~14 GB free, less than the toolchain closure
      # plus a cold target/, so the largest unused SDKs go first. /mnt is no
      # longer guaranteed to exist, so it is not an option.
      - if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo install -d -o "$(id -u)" -g "$(id -g)" /ci-cache
          df -h /
      - if: runner.environment == 'github-hosted'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_options: --no-daemon
          # Ubuntu 24.04's AppArmor userns restriction breaks an unprivileged
          # sandbox, and sandbox-fallback does not catch it. pond-ci runs
          # sandbox-less too.
          extra_nix_config: |
            sandbox = false
            extra-substituters = https://pond-nix-cache.nbg1.your-objectstorage.com
            extra-trusted-public-keys = pond-nix-cache-1:hKrVA6Y14HOfAzfEP8C0Ev3T3FQPxqouI0awr6hffbU=
      - uses: ./.github/actions/devshell
        id: devshell
      # One moon session: independent tasks interleave (cargo serializes the
      # heavy ones on its target-dir lock; format/changelog are instant). The
      # plugin suites run here too - they cost seconds next to the Rust build,
      # and moon provisions their node itself through proto (the devshell's node
      # is for direct use; .moon/toolchains.yml still pins a version, so moon
      # downloads its own into PROTO_HOME either way).
      #
      # `moon ci`, not `moon run`: it drops targets that the changed files do
      # not affect BEFORE hashing them, so a Rust-only PR never pays the two
      # uncached `npm ci` installs that dominate today's cache-hit path. The
      # explicit target list still applies - `moon ci` filters it, it does not
      # widen it. Requires the fetch-depth: 0 checkout above; moon resolves the
      # merge base from full history and mis-detects on a shallow clone.
      #
      # dist-build-unix and dist-build-windows deliberately stay on `moon run`:
      # under affected-only filtering a release commit that touches no declared
      # input would build nothing and publish nothing.
      #
      # Base revision is moon's own detection (the ci_env crate): the PR base
      # ref for a pull_request, HEAD~1 for a push to main. Accepted as-is -
      # every merge into main here is a squash, so a push is one commit. A
      # multi-commit push would under-select, and the fix is MOON_BASE.
      - run: >
          moon ci
          repo:check-changelog
          pond:check-package pond:format pond:lint pond:test
          openclaw-pond:typecheck openclaw-pond:test
          pi-pond:typecheck pi-pond:test
          hermes-pond:test

      # Publishes the toolchain closure this job entered, so cold pods, fork PRs
      # and dev machines substitute it (plan 2.7). Main pushes only: the signing
      # credential lives nowhere else (plan 2.8 point 2). Non-fatal - the cache
      # is a cold-start optimization; nix copy skips paths the bucket already has.
      - name: Push the devshell closure to the binary cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.devshell.outputs.profile != '' }}
        continue-on-error: true
        # continue-on-error does not cover the job timeout: a stalled upload
        # must fail this step, not run out the job's clock and redden the build.
        timeout-minutes: 15
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          # kache's Hetzner key pair also has write access to pond-nix-cache.
          AWS_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}
          PROFILE: ${{ steps.devshell.outputs.profile }}
        run: |
          set -euo pipefail
          key=$(mktemp -p "$RUNNER_TEMP")
          trap 'rm -f "$key"' EXIT INT TERM
          printf '%s' "$NIX_CACHE_SIGNING_KEY" | tr -d '\n' > "$key"
          # region must be nbg1: Hetzner rejects signatures for any other region.
          nix --extra-experimental-features nix-command copy \
            --to "s3://pond-nix-cache?endpoint=nbg1.your-objectstorage.com&region=nbg1&compression=zstd&secret-key=$key" \
            "$(readlink -f "$PROFILE")"

  # Hosted, never pond-ci: the pond-ci pods are unprivileged, so their nix runs
  # with `sandbox = false` - weaker conditions than the users this check
  # protects. That the toolchain jobs next door now enter a devshell does not
  # change it; this is the one job whose job is to be reproducible.
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: { group: "ci-flake-${{ github.ref }}", cancel-in-progress: true }
    # The workflow-level env hands this secret to every job, and the last step
    # runs a binary downloaded from a GitHub release. Blank it here.
    env:
      BAZEL_REMOTE_AUTH: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # pond's binary cache, public read and no credential. Written into
          # nix.conf rather than relied on from the flake's own nixConfig:
          # `nix flake check --all-systems` builds the devShells, and the
          # toolchain closure is most of that.
          extra_nix_config: |
            extra-substituters = https://pond-nix-cache.nbg1.your-objectstorage.com
            extra-trusted-public-keys = pond-nix-cache-1:hKrVA6Y14HOfAzfEP8C0Ev3T3FQPxqouI0awr6hffbU=
      # Without --all-systems the darwin and aarch64 outputs go unevaluated on
      # an x86_64 runner and the job passes anyway.
      - run: nix flake check --all-systems --no-update-lock-file
      # ops/nix is a second flake with its own lock, not reached by the root
      # check; it backs the older `?dir=ops/nix#pond` install URL.
      - run: nix flake check ./ops/nix --all-systems --no-update-lock-file
      # flake check only evaluates - nothing above ever fetches a tarball. This
      # is the step that proves the rendered sha256/URLs and autoPatchelfHook.
      - run: nix run .#pond -- --version
      # toolVersions holds plain literals wherever it does not read a pin file,
      # so a reader without Nix can extract it by text. This step keeps that
      # text form honest: the literals, plus the pins
      # read from rust-toolchain.toml (rust) and .prototools (moon, protoc),
      # must equal what the flake evaluates to. It does NOT cover the kache
      # pins in the Windows `Start kache` step and dist-build-unix; the
      # "lockstep" comments there are the only guard for those.
      - name: toolVersions text extraction matches the evaluated attrset
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-$(mktemp -d)}"
          nix eval --json .#lib.toolVersions | jq -S . > "$out/evaluated.json"
          # The two pin files are read LAST so their values win the jq merge: a
          # literal smuggled into the table would otherwise match the eval and
          # pass green, defeating the cross-file assertion here. .prototools
          # stops at its first table, where its version lines end.
          {
            sed -n '/toolVersions = {/,/^      };/s/^[[:space:]]*\([A-Za-z][A-Za-z0-9]*\)[[:space:]]*=[[:space:]]*"\([^"]*\)";.*/\1 \2/p' flake.nix
            sed -n '/^\[/q; s/^\([A-Za-z][A-Za-z0-9]*\)[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1 \2/p' .prototools
            sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/rust \1/p' rust-toolchain.toml
          } | jq -Rn '[inputs | split(" ") | {(.[0]): .[1]}] | add' | jq -S . > "$out/extracted.json"
          diff -u "$out/evaluated.json" "$out/extracted.json"
      # The Rust moon tasks take ops/toolchain-id.json as their toolchain input
      # instead of /flake.lock, so a nixpkgs bump no longer invalidates them -
      # but only while the committed ids are the real devShell derivation paths.
      # Evaluating them builds nothing, so this covers all three systems from
      # this x86_64 runner; the devshell action checks only the one system its
      # job runs on, and only when it builds a profile.
      # Files, not process substitution: `set -o pipefail` does not reach into
      # `<(...)`, so a step written that way passes green when BOTH sides fail.
      - name: ops/toolchain-id.json matches the evaluated devShell drvPaths
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-$(mktemp -d)}"
          nix eval --json .#lib.toolchainId | jq -S . > "$out/toolchain-evaluated.json"
          jq -S . ops/toolchain-id.json > "$out/toolchain-committed.json"
          diff -u "$out/toolchain-evaluated.json" "$out/toolchain-committed.json"

  # Windows runs as TWO jobs, deliberately: the test leg gates every main push
  # (and labelled PRs), the dist leg runs only for a release or a dispatch, and
  # each keeps its own kache store. dist-build-windows needs
  # build-and-test-windows, so a shipped zip never comes from a commit its own
  # test leg did not pass. The test leg starts at t=0, so the dist leg waits only
  # for whichever of it and release-prep finishes last: about +6 min on the
  # v0.19.1 release (run 35924997199), not the two legs' sum.
  #
  # build-and-test-windows runs moon's `pond:test-msvc`, never `pond:test`: the
  # task fingerprint carries command/args/deps/env/inputs/outputs but no OS or
  # architecture of its own (crates/task-hasher/src/task_fingerprint.rs), so
  # sharing one task would hit the hash the Linux runner already stored and go
  # green without compiling a line here. `rust: {}` in .moon/toolchains.yml now
  # folds the host triple in as well, but the differing command is what has kept
  # them apart and still does, and the remote cache is what lets a prose-only
  # commit skip the leg entirely.
  # dist-build-windows runs `repo:build-dist-msvc` for the same two reasons: its
  # own task so the OS-less fingerprint cannot collide with `repo:build-dist`,
  # and a moon task so it is cacheable at all.
  #
  # The two carry DIFFERENT kache manifest-keys, and those keys and their S3
  # prefixes still read windows-verify / windows-dist: they are cache
  # identities, not job names, and renaming one forces a cold run. Sharing one
  # would make each overwrite the other's warm-prefetch manifest, silently
  # dropping both to a near-cold fetch.

  # The gate: the full suite, natively. Every main push runs it before anything
  # ships (dist-build-windows, and through it publish-release, needs it); a PR
  # runs it only when labelled `windows`, since most diffs carry no
  # Windows-specific risk and the leg costs ~20 min of a hosted runner. Never on
  # fork PRs: they get no secrets, so kache has no S3 credentials.
  build-and-test-windows:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'windows'))
    runs-on: windows-2025
    # No `needs:` - a root, starting at t=0 alongside the Linux jobs.
    # 180 is measured headroom: this leg was 76 min on a fully cold cache.
    timeout-minutes: 180
    # Cancellable, like build-and-test-linux: a newer push supersedes it. That
    # makes this the one ancestor of publish-release on the Windows side that
    # can be cancelled - dist-build-windows is explicitly not, being an artifact
    # producer. It is safe because release-plz cuts the tag INSIDE
    # publish-release, so a cancelled run leaves is_release still true and the
    # superseding push simply re-runs the whole release path. The same exposure
    # build-and-test-linux already carries. Do not "fix" this to false without
    # that reasoning changing.
    concurrency: { group: "ci-build-and-test-windows-${{ github.ref }}", cancel-in-progress: true }
    # Only a main push may write moon's remote cache. A hash stored by a PR or
    # dispatch run is one main would replay without compiling - but kache may
    # only write its remote from a protected-branch push, so that replay leaves
    # the artifact cache cold and every later PR rebuilds Lance from scratch.
    # PRs still replay docs/CI-only diffs from main's own stored hashes.
    env:
      # A force_build dispatch reads nothing and writes nothing: `off`, not
      # MOON_FORCE, which switches moon to write mode and would let a dispatch
      # on any ref upload hashes main later replays (moon crates/cache/src/cache_engine.rs).
      MOON_CACHE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'read-write' || (inputs.force_build && 'off' || 'read') }}
      # Names the key groups that changed in each miss notice. A fresh runner
      # has no earlier local build, so it can only compare the prefetched
      # entries' target/profile/features, not input groups.
      KACHE_EXPLAIN_MISS: '1'
      # On-demand cache warmer: a main push whose head commit message carries
      # '[force-build]' compiles for real even on a moon hash hit - the way to
      # repopulate a cold kache prefix without waiting for an input-changing
      # merge (dispatch can't do it: kache is read-only outside branch pushes).
      # Renders literal 'true'/'false', the only values moon's --force accepts.
      MOON_FORCE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[force-build]') }}
      # This job's kache identity: each build shape needs its own prefetch
      # manifest, and `Start kache` loads the remote from the
      # .github/kache/<key>.toml it names.
      KACHE_MANIFEST_KEY: windows-verify
      # Test leg only, never dist-build-windows: a restored harness has
      # unresolved .pdb paths, so a failing test gets a weaker backtrace. Worth
      # ~3 min of link time here; not worth it on the leg whose output ships.
      KACHE_CACHE_EXECUTABLES: '1'
    # RUSTFLAGS is deliberately absent: setting it anywhere in this job silently
    # REPLACES the +crt-static rustflags from .cargo/config.toml.
    #
    # BAZEL_REMOTE_AUTH is NOT blanked here, unlike flake-check: moon only skips
    # a task on a cache hit, and a hosted runner starts with an empty local cache
    # every run, so without the remote there is nothing to hit.
    steps:
      # MUST precede checkout. pond's longest tracked path is 456 characters - a
      # claude-desktop fixture nesting an encoded project slug inside a session
      # dir - and Git for Windows refuses it ("Filename too long", exit 128)
      # regardless of the LongPathsEnabled registry key, because git only opts
      # into `\\?\` paths when core.longpaths is set. --system, not --global:
      # actions/checkout relocates HOME while it edits global config.
      - name: Allow long paths in git
        shell: pwsh
        run: git config --system core.longpaths true
      # Full history for the same reason build-and-test-linux needs it: moon's vcs
      # layer resolves vcs.defaultBranch, which a shallow PR checkout lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Anchored and replayed by dist-build-windows, like both kache steps: the
      # two legs drifted apart the one time each carried its own copy (0ed4a0c).
      #
      # moon and protoc are the release zips at the .prototools pins the
      # devshell reads too, since moon refuses a remote cache written by another
      # moon version. The pins are read as text above the file's first table,
      # the same contract flake-check's parity step enforces.
      #
      # CARGO_HOME and TEMP move to D:, the runner's fast local disk (C: is
      # network-attached, actions/runner-images#12416). RUSTUP_HOME stays, which
      # makes `--no-self-update` load-bearing: a self-update looks for
      # rustup.exe in $CARGO_HOME/bin and fails (rust-lang/rustup#2946).
      - &windows-toolchain
        name: Toolchain on the D drive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          function Set-JobEnv($name, $value) {
            Set-Item "env:$name" $value
            Add-Content $env:GITHUB_ENV "$name=$value"
          }
          function Add-JobPath($dir) {
            $env:PATH = "$dir;$env:PATH"
            Add-Content $env:GITHUB_PATH $dir
          }
          function Expand-Release($url, $name) {
            $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
            $dir = Join-Path $env:RUNNER_TEMP $name
            Expand-Archive $zip -DestinationPath $dir
            $dir
          }

          $pins = @{}
          foreach ($line in Get-Content .prototools) {
            if ($line.StartsWith('[')) { break }
            if ($line -match '^(\w+)\s*=\s*"([^"]+)"') { $pins[$Matches[1]] = $Matches[2] }
          }
          foreach ($tool in 'moon', 'protoc') {
            if (-not $pins[$tool]) { throw "no $tool pin above the first table in .prototools" }
          }
          $protoc = Expand-Release "https://github.com/protocolbuffers/protobuf/releases/download/v$($pins.protoc)/protoc-$($pins.protoc)-win64.zip" protoc
          Add-JobPath (Join-Path $protoc bin)
          $moon = Expand-Release "https://github.com/moonrepo/moon/releases/download/v$($pins.moon)/moon_cli-x86_64-pc-windows-msvc.zip" moon
          Add-JobPath $moon
          protoc --version
          moon --version

          New-Item -ItemType Directory -Force -Path D:\temp | Out-Null
          Set-JobEnv CARGO_HOME 'D:\cargo'
          Set-JobEnv TEMP 'D:\temp'
          Set-JobEnv TMP 'D:\temp'
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version

      # kache by pinned sha256 rather than kunobi-ninja/kache-action, whose post
      # step skips cancelled runs (see `Save kache`). KACHE_RELEASE moves in
      # lockstep with dist-build-unix's pin and, when cache keys change, the
      # k-tag in .github/kache/*.toml and dist-build-unix's KACHE_S3_PREFIX.
      #
      # The prefetch caps are 0 (unlimited) because kache's defaults drop
      # expensive crates from this graph, and the store limit stays above the
      # working set prefetch materializes (a 20 GiB cap evicted mid-run on
      # 2026-08-26). The Remote check fails the job here rather than letting a
      # config that did not load run every rustc local-only, since `kache stats`
      # still exits 0 then. The R2 credentials enter here rather than at job
      # level, so checkout and the toolchain downloads never see them.
      - &kache-start
        name: Start kache
        shell: pwsh
        env:
          KACHE_RELEASE: 1.1.1
          KACHE_SHA256: fcd465a4bb804c744dd56f9c2dbd4b701d85f0f408c2eac26e0b93f2904d4ddd
          R2_ACCESS_KEY: ${{ secrets.KACHE_R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.KACHE_R2_SECRET_ACCESS_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          function Set-JobEnv($name, $value) {
            Set-Item "env:$name" $value
            Add-Content $env:GITHUB_ENV "$name=$value"
          }

          $bin = Join-Path $env:RUNNER_TEMP 'kache-bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $exe = Join-Path $bin 'kache.exe'
          Invoke-WebRequest -Uri "https://github.com/kunobi-ninja/kache/releases/download/v$env:KACHE_RELEASE/kache-x86_64-pc-windows-msvc.exe" -OutFile $exe -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $env:KACHE_SHA256) { throw "kache.exe has sha256 $sha, expected $env:KACHE_SHA256" }
          Add-Content $env:GITHUB_PATH $bin
          $env:PATH = "$bin;$env:PATH"
          Set-JobEnv RUSTC_WRAPPER $exe

          Set-JobEnv KACHE_CONFIG (Join-Path $env:GITHUB_WORKSPACE ".github\kache\$env:KACHE_MANIFEST_KEY.toml")
          if (-not (Test-Path $env:KACHE_CONFIG)) { throw "no kache config at $env:KACHE_CONFIG" }
          $match = Select-String -Path $env:KACHE_CONFIG -Pattern '^\s*prefix\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "no [cache.remote] prefix in $env:KACHE_CONFIG" }
          $prefix = $match.Matches[0].Groups[1].Value
          Set-JobEnv KACHE_S3_ACCESS_KEY $env:R2_ACCESS_KEY
          Set-JobEnv KACHE_S3_SECRET_KEY $env:R2_SECRET_KEY
          Set-JobEnv KACHE_LOG 'kache=info'
          Set-JobEnv KACHE_NAMESPACE $env:KACHE_MANIFEST_KEY
          Set-JobEnv KACHE_CACHE_DIR 'D:\kache'
          Set-JobEnv KACHE_MAX_SIZE '40GiB'
          Set-JobEnv KACHE_PREFETCH_MAX_BYTES '0'
          Set-JobEnv KACHE_PREFETCH_MAX_KEYS '0'
          Set-JobEnv KACHE_PREFETCH_DEADLINE_SECS '0'
          $runtime = Join-Path $env:RUNNER_TEMP 'kache-runtime'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Set-JobEnv KACHE_RUNTIME_DIR $runtime

          # Started before cargo so the manifest prefetch overlaps the build.
          kache daemon start
          $stats = kache stats 2>&1
          $stats
          $line = $stats | Select-String -Pattern '^\s*Remote\s+(\S+://\S+)' | Select-Object -First 1
          if (-not $line) { throw "kache stats printed no Remote row - $env:KACHE_CONFIG did not load" }
          $remote = $line.Matches[0].Groups[1].Value
          if ($remote -notmatch "^s3://.+/$([regex]::Escape($prefix))$") {
            throw "kache resolved its remote to '$remote', expected the '$prefix' from $env:KACHE_CONFIG"
          }

      # Full suite, not a subset: DataFusion, axum and rmcp have no Windows CI
      # anywhere upstream, so this is the first place they ever run on Windows.
      # --output-style stream: in CI moon buffers a task with no outputStyle to
      # its exit, so a cold build logged nothing but moon's heartbeat for an hour.
      - name: Test
        run: moon run pond:lint-msvc pond:test-msvc --output-style stream

      # A step, not an action's post hook, so it runs on cancel too, with the
      # manifest the next run prefetches from first: the runner kills a
      # cancelled job after five minutes. Only a successful run publishes with
      # its commit, which drops other commits' stored entries; a failed or
      # cancelled one publishes without it, which merges with entries saved in
      # the last hour and replaces older ones (kache keep_stored_entry).
      #
      # No `kache sync --push`: from the repo root it covers only workspace
      # crates, which the daemon uploads anyway (same as repo:build-dist).
      # continue-on-error: saving never fails the job, and pwsh's appended
      # `exit $LASTEXITCODE` would trip on any non-zero kache exit.
      - &kache-save
        name: Save kache
        if: always()
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 30
        run: |
          if ('${{ job.status }}' -ne 'success') { $env:GITHUB_SHA = '' }
          kache save-manifest --manifest-key $env:KACHE_MANIFEST_KEY --namespace $env:KACHE_NAMESPACE
          (kache report --format github --since 24h) -replace '^### kache build cache$', "### kache build cache: $env:GITHUB_JOB" | Add-Content $env:GITHUB_STEP_SUMMARY
          kache stats
          if ($env:KACHE_EXPLAIN_MISS) {
            # The workspace crates that missed on a same-commit re-run.
            kache explain pond
            kache explain integration
          }
          Get-PSDrive C, D | Format-Table -AutoSize
          # The only record of remote timeouts, named after the socket, which a
          # pull request run scopes (daemon-<scope>.log). Read as a file:
          # `kache daemon log` once followed it forever on Windows.
          Get-ChildItem $env:KACHE_RUNTIME_DIR -Filter 'daemon*.log' | ForEach-Object { "== $($_.Name)"; Get-Content -Tail 200 $_.FullName }
          # Last, because `kache stats` would start a stopped daemon again;
          # stopping drains the queued uploads.
          kache daemon stop

  # The shipped msvc zip. Release-gated rather than per-PR: it produces an
  # artifact nobody consumes outside a release, and it is the only thing in the
  # pipeline that ever executes a Windows binary.
  # `!cancelled()` is load-bearing: release-prep only runs on a main push, and a
  # skipped `needs` skips its dependents, so a bare `needs:` would stop the
  # workflow_dispatch escape hatch ever running. It also drops the implicit
  # success() check, so build-and-test-windows's result is asserted explicitly.
  # Deliberately NOT pre-flighted on the release PR: a failure here cuts no tag,
  # so is_release stays true and `gh run rerun --failed` recovers it.
  dist-build-windows:
    needs: [build-and-test-windows, release-prep]
    if: >-
      !cancelled() && needs.build-and-test-windows.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-prep.outputs.is_release == 'true'
      )
    runs-on: windows-2025
    timeout-minutes: 180
    # Not cancellable, same rule as dist-build-unix: this produces a release
    # artifact publish-release needs. Cancelling it mid-release cancels the publish with
    # it, and after release-plz cuts the tag the is_release gate is false
    # forever - an interrupted publish cannot auto-recover.
    concurrency: { group: "ci-dist-build-windows-${{ github.ref }}", cancel-in-progress: false }
    # Same cache-warming rule as build-and-test-windows: only a main push may
    # write moon's remote cache, so a release push compiles for real inside
    # kache's write window instead of replaying a dispatch-stored hash.
    env:
      # Same rules as build-and-test-windows, force_build `off` included.
      MOON_CACHE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'read-write' || (inputs.force_build && 'off' || 'read') }}
      # Same '[force-build]' warmer as build-and-test-windows.
      MOON_FORCE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[force-build]') }}
      # This leg's kache identity, same shape as build-and-test-windows's.
      KACHE_MANIFEST_KEY: windows-dist
    steps:
      - name: Allow long paths in git
        shell: pwsh
        run: git config --system core.longpaths true
      # Full history, like the sibling Windows job: moon's vcs layer resolves
      # vcs.defaultBranch, which a shallow checkout lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - *windows-toolchain
      - *kache-start

      # Build + smoke + package, as a moon task so the leg gets the same
      # task-level remote cache every other build has. `--profile dist`, not
      # `--release`: `release` is pond's no-LTO iteration profile, and every
      # shipped binary is built with `dist`.
      - name: Build release zip
        run: moon run repo:build-dist-msvc
        env:
          # Makes moon upload this task's ~76 MB artifact to the remote cache
          # INLINE instead of in a background task it may abandon at shutdown
          # (crates/cache-storage/src/storage.rs: `in_background =
          # !is_daemon_env()`). The variable is really moon's own "you are
          # inside the daemon process" signal, borrowed here for that one
          # effect; its only other consequence is that moon skips caching
          # subprocess output (crates/process/src/command.rs), which costs
          # nothing on a task that runs once.
          #
          # The original reason - a hard 60s abort that a 76 MB upload never
          # beat - no longer holds: BACKGROUND_FLUSH_TIMEOUT is 300s as of moon
          # 2.5.2 and stragglers are only dropped past that. Kept anyway until
          # a release proves the background path lands the blob, because the
          # failure mode is silent (the leg simply never caches) and only shows
          # up as a slow release. Drop it and watch one release if you want the
          # simplification.
          MOON_DAEMON_RUNNING: "1"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows
          path: dist/pond-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          retention-days: 7

      # This leg's only manifest save, with the same diagnostics: it runs rarely
      # enough that a silent cache regression would first show as a slow release.
      - *kache-save

  # Maintain the release PR, and report ONLY whether a release is pending.
  # Detection is the tag check - release-plz's own first gate is "skip a package
  # whose tag already exists". (dry-run can't report this: in dry-run release-plz
  # always emits releases_created=false, it only logs the plan.)
  release-prep:
    # A skipped `needs` job skips its dependents, so flake-check must stay
    # unconditional: give it a `paths:` filter or an `if:` and releases silently
    # stop happening.
    needs: [build-and-test-linux, flake-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Normally under a minute. The headroom is for release-plz's source-build
    # fallback (below), which compiles it when binstall cannot find the asset.
    timeout-minutes: 20
    concurrency: { group: "release-plz-${{ github.ref }}", cancel-in-progress: false }
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # SHA-pinned, so the toolchain must be an explicit input (the action
      # otherwise derives it from the ref name).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with: { toolchain: stable }
      # When GitHub's GraphQL API is degraded, the action's cargo-binstall cannot
      # discover the prebuilt release-plz asset and degrades to a source build.
      # RUSTUP_TOOLCHAIN outranks rust-toolchain.toml, so that build uses stable
      # rather than pond's pin, which is too old for release-plz's dep tree.
      - uses: release-plz/action@8e61445f0b34e7c6d985255f2f1f05a36eb350dc # v0.5.137
        with: { command: release-pr, config: .github/release-plz.toml }   # keep the release PR current; never publishes
        env:
          RUSTUP_TOOLCHAIN: stable
          # PAT (not GITHUB_TOKEN) so the opened release PR triggers CI.
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - id: detect
        run: |
          set -euo pipefail
          V=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[]|select(.name=="pond-db").version')
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi

  # Build + Developer ID sign. Split from publish-release so notarization and
  # the macOS checks can gate the publish without re-running the 3-target build.
  dist-build-unix:
    needs: [release-prep]
    if: needs.release-prep.outputs.is_release == 'true'
    # ARC runner pod: rust + its three cross targets, zig/zigbuild/SDK/rcodesign
    # all come from the flake devShell; incremental cache on /ci-cache - no
    # docker, no buildkit.
    runs-on: pond-ci
    # A fully cold 3-target dist build measured 56m; warm runs are minutes.
    timeout-minutes: 90
    concurrency: { group: "pond-dist-${{ github.ref }}", cancel-in-progress: false }
    outputs:
      v: ${{ steps.ver.outputs.v }}
      signed: ${{ steps.identity.outputs.signed }}
    # Job-level, not step-level, so the prefix assertion below sees
    # KACHE_S3_PREFIX and can check it against .github/kache/linux-dist.toml
    # before anything compiles. Bucket/endpoint/region stay here as well because
    # the CLI reads them ahead of the file, so removing them would change which
    # settings are live rather than just where they are written.
    # Credentials are deliberately env-only: they are the two KACHE_S3_*
    # variables a kache daemon spawn does not strip, and they never enter a
    # committed file.
    env:
      KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
      KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}
      KACHE_S3_REGION: nbg1
      KACHE_S3_BUCKET: ttq
      KACHE_S3_ENDPOINT: https://nbg1.your-objectstorage.com
      KACHE_S3_PREFIX: kache/pond/linux-dist/k35
      # Local store on the PVC so pods start warm and sync only moves
      # deltas; cap it well below the 100Gi shared PVC.
      KACHE_CACHE_DIR: /ci-cache/kache
      KACHE_MAX_SIZE: 20GiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/devshell

      # kache is not in the flake devShell (a per-machine tool, and a repo pin
      # that disagreed with developers' own daemons), so this job - the only
      # Linux consumer, through RUSTC_WRAPPER in the repo:build-dist script -
      # installs its own pinned copy. This step only puts the static musl binary
      # on PATH: RUSTC_WRAPPER comes from repo:build-dist and KACHE_CACHE_DIR
      # from the job env, and there is no manifest or daemon lifecycle like the
      # Windows legs' `Start kache`, which would change how this release-only
      # path behaves and cannot be exercised before a release. The sha256s are
      # pinned here, as on Windows, rather than read from the release's own
      # .sha256 sidecar: release assets are mutable, and this binary wraps every
      # rustc call of a shipped build. Bumped in lockstep with the Windows
      # `Start kache` KACHE_RELEASE and, when cache keys change, the k-tag in
      # .github/kache/*.toml and KACHE_S3_PREFIX above, never alone.
      - name: Install kache
        env:
          KACHE_RELEASE: 1.1.1
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "$arch" in
            x86_64) sha256=2ef097121b87ed7a24f9b40fbf5d3799837b4c2ac75391d2264ea5cc6c38b3d7 ;;
            aarch64) sha256=3c2e82f42092123a937004aa1a3b5efa766c39b071eedce2de9e9b51fbe91b08 ;;
            *) echo "no pinned kache for $arch" >&2; exit 1 ;;
          esac
          asset="kache-$arch-unknown-linux-musl.tar.gz"
          dir="$RUNNER_TEMP/kache-bin"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/kunobi-ninja/kache/releases/download/v${KACHE_RELEASE}/${asset}"
          echo "$sha256  $dir/$asset" | sha256sum -c -
          tar -xzf "$dir/$asset" -C "$dir" kache
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/kache" --version

      # This job is the only caller that declares a kache remote, and the CLI
      # reads KACHE_S3_PREFIX ahead of the file. Assert the two agree, so the
      # CLI (env) and a daemon (file) can never split across two prefixes - a
      # split makes prefetch fetch from one place while the manifest is written
      # to another, and nothing says so. It lived in the deleted bootstrap, which
      # every job paid for; here it sits where the remote actually is.
      - name: Assert the kache prefix matches the config file
        run: |
          set -euo pipefail
          test -f "$KACHE_CONFIG"
          file_prefix=$(awk -F'"' '/^[[:space:]]*prefix[[:space:]]*=/ { print $2; exit }' "$KACHE_CONFIG")
          if [ "$file_prefix" != "$KACHE_S3_PREFIX" ]; then
            echo "kache prefix mismatch: $KACHE_CONFIG has '$file_prefix', job env has '$KACHE_S3_PREFIX'" >&2
            exit 1
          fi

      # Reports only whether the cert exists, never its value: the signature
      # and notarize steps skip cleanly until the Apple secrets are populated,
      # so this lands safely before the credentials do.
      - id: identity
        run: echo "signed=${{ secrets.APPLE_P12_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      # The KACHE_S3_* / KACHE_CACHE_DIR block this step used to carry now sits
      # at job level, so the prefix assertion above can read it. Only the
      # signing credentials stay step-scoped.
      - name: Build + package binaries
        run: moon run repo:build-dist
        env:
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}

      - id: ver
        run: echo "v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[]|select(.name=="pond-db").version')" >> "$GITHUB_OUTPUT"

      # Two artifacts, not one: the macOS jobs only need the 38MB darwin
      # tarball, while publish needs all three cross-compiled tarballs plus
      # checksums (the Windows zip reaches it separately, from
      # dist-build-windows).
      # Seven-day retention: "Re-run failed jobs" on publish-release is the
      # recovery path, and it needs these artifacts to still exist.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-darwin
          path: dist/pond-aarch64-apple-darwin.tar.xz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-all
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Notarization does NOT alter the artifact: a bare Mach-O has nowhere to hold
  # a ticket, so Apple serves it online and every sha256 computed from the
  # signed binary in dist-build-unix stays valid.
  #
  # One macOS job does launch smoke, signature assertions, and notarization:
  # macos-15 ships `xcrun notarytool`, so the Mac notarizes itself rather than
  # bouncing the artifact through a second Linux job.
  dist-verify-macos:
    needs: [dist-build-unix]
    runs-on: macos-15
    timeout-minutes: 45
    # Same rule as flake-check: this job runs a binary built elsewhere.
    env: { BAZEL_REMOTE_AUTH: "" }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist-darwin }

      # The cross-compiled Mach-O is never built or run on macOS before this.
      # `completions` is what the Homebrew formula shells out to at install
      # time, so a binary that cannot run here breaks `brew install`, not just
      # `pond`.
      - name: Launch the cross-compiled binary
        run: |
          set -euo pipefail
          tar -xJf pond-aarch64-apple-darwin.tar.xz
          ./pond --version
          ./pond --help > /dev/null
          # Redirect, don't pipe: `grep -q` closes the pipe at its first match,
          # and the EPIPE that hands the still-writing binary is an unwrap inside
          # clap_complete, so the assertion killed the release it was gating.
          ./pond completions zsh > completions.zsh
          grep -q '_pond' completions.zsh
          # Both signing paths pin the identifier that firewall and privacy
          # rules key on (#353), so check it whether or not the cert was present.
          codesign -dvvv ./pond > ident.txt 2>&1
          grep -Fqx 'Identifier=io.github.tenequm.pond' ident.txt

      - name: Verify code signature
        if: needs.dist-build-unix.outputs.signed == 'true'
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 ./pond
          # Gatekeeper cannot be asked directly: `spctl --assess --type exec`
          # rejects ANY bare CLI binary ("does not seem to be an app"), even a
          # correctly notarized one. Assert the two properties notarization
          # actually requires instead, and the team the designated requirement
          # pins alongside the identifier.
          codesign -dvvv ./pond 2>&1 | tee sig.txt
          grep -q 'Authority=Developer ID Application' sig.txt
          grep -qE 'flags=0x[0-9a-f]*\(.*runtime.*\)' sig.txt
          grep -Fqx 'TeamIdentifier=4L9YA7S99L' sig.txt

      - name: Notarize with Apple
        if: needs.dist-build-unix.outputs.signed == 'true'
        env:
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The notary accepts .zip/.dmg/.pkg only - this zip is a submission
          # envelope, never a released asset. A bare Mach-O cannot be stapled,
          # so Apple serves the ticket online and the artifact is unchanged.
          ditto -c -k ./pond notarize.zip
          creds="$(mktemp -d)"
          printf '%s' "$APPLE_ASC_KEY_P8" | base64 --decode > "$creds/key.p8"
          # `notarytool submit --wait` exits 0 even when the notary returns
          # Invalid, so the JSON status is the gate, not the exit code.
          xcrun notarytool submit notarize.zip \
            --key "$creds/key.p8" \
            --key-id "$APPLE_ASC_KEY_ID" \
            --issuer "$APPLE_ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee result.json
          rm -rf "$creds"
          test "$(jq -r .status result.json)" = "Accepted"

  # Publish everywhere. release-plz publishes crates.io + cuts the tag/release
  # HERE (after build AND dist-verify-macos), so crates.io can't ship without
  # binaries, and no channel can ship a binary macOS refuses to run.
  publish-release:
    # build-and-test-windows is implied: dist-build-windows needs it.
    needs: [dist-build-unix, dist-verify-macos, dist-build-windows]
    # GitHub-hosted, no devshell: release-plz only packages and uploads
    # (publish_no_verify in release-plz.toml, so nothing compiles), and gh - which
    # the devShell deliberately ships no copy of - plus jq and sha256sum all come
    # preinstalled on the image. Keeps the release off the ARC pool.
    runs-on: ubuntu-latest
    # 60, not 30: the upload retries are bounded per asset (3 x --max-time 180
    # plus backoff = 10m30s), but five assets and release-plz do not fit in 30,
    # so a degraded network could still have the job SIGKILLed mid-tail - the
    # failure this whole path exists to avoid. The tail is idempotent and exits
    # non-zero with an ::error:: of its own, so letting it fail on its own terms
    # is strictly better than being killed. Five simultaneously-bad assets still
    # exceed even 60; that means uploads.github.com is down and the release is
    # re-run either way.
    timeout-minutes: 60
    permissions:
      contents: write   # release asset uploads to this repo via the workflow token
    # Never cancel a release mid-publish: a newer push queues behind this run
    # instead of killing it between release-plz tagging and the publishes.
    concurrency: { group: "pond-release-${{ github.ref }}", cancel-in-progress: false }
    # The tail runs through `moon run` like every other task, so both remote-cache
    # vars must be blanked, not just the secret: the workflow-level MOON_REMOTE_HOST
    # is set whenever the secret exists, and moon hard-fails a configured remote
    # whose auth header is empty. The task itself is `cache: false`, so there is
    # nothing to cache here anyway.
    env:
      V: ${{ needs.dist-build-unix.outputs.v }}
      BAZEL_REMOTE_AUTH: ""
      MOON_REMOTE_HOST: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist-all, path: dist }
      # The msvc zip is built natively by dist-build-windows, not by the moon dist
      # task, so it arrives as its own artifact.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist-windows, path: dist }
      # Before release-plz: crates.io must not ship unless every archive the
      # tail publishes is here.
      - run: ls -l dist/pond-{x86_64,aarch64}-unknown-linux-gnu.tar.xz dist/pond-aarch64-apple-darwin.tar.xz dist/pond-x86_64-pc-windows-msvc.zip

      # moon is the task surface everywhere else, so the release tail goes
      # through it too. Installed here - BEFORE release-plz, ungated - and not
      # next to the step that uses it: this downloads moon from GitHub releases,
      # and a rate limit or a 5xx on that download must not land after the crate
      # is published and the tag is cut. The version is the .prototools pin,
      # read as text like the Windows legs read it.
      - name: Install moon
        run: |
          set -euo pipefail
          moon=$(sed -n '/^\[/q; s/^moon[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' .prototools)
          if [ -z "$moon" ]; then echo "no moon pin above the first table in .prototools" >&2; exit 1; fi
          dir="$RUNNER_TEMP/moon"
          mkdir -p "$dir"
          curl -fsSL --retry 3 "https://github.com/moonrepo/moon/releases/download/v${moon}/moon_cli-x86_64-unknown-linux-gnu.tar.xz" | tar -xJ --strip-components=1 -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/moon" --version

      # Same pinned action as release-prep. RUSTUP_TOOLCHAIN outranks
      # rust-toolchain.toml, so rustup does not install pond's pin just to run
      # `cargo package`; it also covers release-plz's source-build fallback
      # (binstall cannot find the prebuilt asset when GitHub GraphQL is down).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with: { toolchain: stable }
      - uses: release-plz/action@8e61445f0b34e7c6d985255f2f1f05a36eb350dc # v0.5.137
        id: release-plz
        with: { command: release, config: .github/release-plz.toml }
        env:
          RUSTUP_TOOLCHAIN: stable
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # A re-run finds the tag already cut, so release-plz reports no release;
      # the release existing is what lets the tail (and the jobs after this one)
      # resume. The step passes only when the release exists, so everything
      # downstream can rely on this job's success alone.
      - name: The GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED: ${{ steps.release-plz.outputs.releases_created }}
        run: |
          set -euo pipefail
          if [ "$CREATED" = true ]; then
            exit 0
          fi
          # publish-release only runs while the tag is missing, and release-plz
          # skips a version whose tag exists or whose crate is already on
          # crates.io without creating the release. So a 404 here is a partial
          # publish, and it must fail rather than go green with nothing shipped.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/tenequm/pond/releases/tags/v$V")
          case "$code" in
            200) ;;
            404) echo "::error::release-plz created no release and v$V has none: the crate or tag was published without the GitHub release. Create the v$V release by hand, then re-run this job." >&2; exit 1 ;;
            *) echo "::error::release lookup for v$V returned HTTP $code" >&2; exit 1 ;;
          esac

      # Checksums merge, binary upload, repo flake commit, Homebrew formula.
      # Idempotent, so "Re-run failed jobs" is safe.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: moon run repo:publish-release

  # The npm plugins (openclaw-pond, pi-pond) ride the same release train,
  # published right after the crate release so a new binary never waits on
  # stale plugin descriptions. GitHub-hosted runner ONLY: npm trusted
  # publishing (OIDC) does not support self-hosted runners. Auth is the
  # workflow id-token - no npm token secret exists - which also earns the
  # packages provenance attestations; each package's npmjs.com settings name
  # this repo + ci.yml as the trusted publisher. Idempotent via the
  # registry-version check in the script: a release without a plugin version
  # bump publishes nothing, and "Re-run failed jobs" retries safely.
  publish-npm:
    needs: [publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # OIDC token for npm trusted publishing
      contents: read
    # Same rule as flake-check/dist-verify-macos: the workflow-level env hands
    # the remote-cache secret to every job; nothing here needs it.
    env:
      BAZEL_REMOTE_AUTH: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: ops/scripts/publish-npm.sh packages/openclaw-pond packages/pi-pond

  # publish-winget is OFF until the winget token gets CreateRef on the
  # winget-pkgs fork (komac: "tenequm does not have the correct permissions to
  # execute CreateRef"). Commented out rather than `if: false` so ci-ok's needs
  # list only live jobs; to re-enable, uncomment it and add it there.
  #
  # # Not `on: release`: release-plz publishes the release, and publish-release
  # # uploads the binaries to it several steps later, so a release-triggered run
  # # would hand winget-releaser an empty installer list. Its own job rather than
  # # a step in publish-release so an upstream hiccup cannot red-flag a release
  # # that already published; "Re-run failed jobs" retries just this.
  # publish-winget:
  #   needs: [dist-build-unix, publish-release]
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 15
  #   # Same rule as flake-check/dist-verify-macos: the workflow-level env hands
  #   # this secret to every job, and the action below binstalls and runs komac.
  #   env:
  #     BAZEL_REMOTE_AUTH: ""
  #   steps:
  #     # The bucket's scheduled Excavator picks releases up within 4h on its own;
  #     # this dispatch just cuts the lag to minutes, so a failure only warns.
  #     - name: Trigger Scoop bucket excavator
  #       env:
  #         GH_TOKEN: ${{ secrets.WINGET_PAT }}
  #       run: gh workflow run excavator.yml -R tenequm/scoop-bucket || echo "::warning::excavator dispatch failed; the scoop-bucket schedule will pick up the release within 4h"
  #     # winget-releaser hard-fails until the package exists upstream; self-clears once microsoft/winget-pkgs#419055 merges.
  #     - id: winget
  #       env:
  #         GH_TOKEN: ${{ github.token }}
  #       shell: bash
  #       run: |
  #         if gh api repos/microsoft/winget-pkgs/contents/manifests/t/tenequm/pond >/dev/null 2>&1; then
  #           echo "present=true" >> "$GITHUB_OUTPUT"
  #         else
  #           echo "::notice::winget package tenequm.pond is not yet in microsoft/winget-pkgs (microsoft/winget-pkgs#419055 still open); skipping winget-releaser"
  #           echo "present=false" >> "$GITHUB_OUTPUT"
  #         fi
  #     - if: steps.winget.outputs.present == 'true'
  #       uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
  #       with:
  #         identifier: tenequm.pond
  #         version: ${{ needs.dist-build-unix.outputs.v }}
  #         # Unlimited (the default) would accumulate every pond patch release in
  #         # winget-pkgs. Trades away `winget install --version` for versions
  #         # older than the last 5.
  #         max-versions-to-keep: 5
  #         # Defaults to github.ref_name, which is `main` here.
  #         release-tag: v${{ needs.dist-build-unix.outputs.v }}
  #         # The default regex matches exe/msi/msix/appx only; pond ships a
  #         # portable zip, so without this the manifest gets no installer URL.
  #         installers-regex: '\.zip$'
  #         # Classic PAT: winget-releaser rejects fine-grained tokens.
  #         token: ${{ secrets.WINGET_PAT }}

  # The docs site (docs/site) on Cloudflare, redeployed on every main push
  # rather than only on docs changes: both deploy jobs share one cancellable
  # group, and each builds the whole site from main's head and fetches releases
  # at build time, so a newer deploy supersedes whatever it cancels.
  deploy-docs:
    # Main only: a dispatch on another branch must not ship that branch's docs.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: deploy-docs, cancel-in-progress: true }
    # pnpm install runs third-party lifecycle scripts; nothing here needs the
    # remote-cache secret the workflow-level env hands every job.
    env:
      BAZEL_REMOTE_AUTH: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/docs-deploy
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The changelog page fetches GitHub releases at build time, so a release is
  # a docs change even when no file under docs/ moved.
  deploy-docs-changelog:
    needs: [publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: deploy-docs, cancel-in-progress: true }
    env:
      BAZEL_REMOTE_AUTH: ""
    steps:
      # main, not the release commit: the shared group must only ever deploy
      # main's head, never roll the site back to an older commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main }
      - uses: ./.github/actions/docs-deploy
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The single required check. It needs EVERY job, not just the leaves: a
  # failed root skips its descendants, so a sink watching only leaves would see
  # "skipped" and pass. Skipped is fine here (event-gated jobs); failure and
  # cancelled are not.
  ci-ok:
    needs:
      - build-and-test-linux
      - flake-check
      - build-and-test-windows
      - deploy-docs
      - release-prep
      - dist-build-unix
      - dist-verify-macos
      - dist-build-windows
      - publish-release
      - publish-npm
      - deploy-docs-changelog
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key) (\(.value.result))"')
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad" | while IFS= read -r job; do echo "::error::not ok: $job"; done
            exit 1
          fi
