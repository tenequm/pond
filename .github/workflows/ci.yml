name: CI

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

# Cancel in-flight runs only on pull_request events (push to main keeps its
# own group via `run_id`). https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, linux, x64, bl]
    steps:
      - uses: actions/checkout@v6.0.2

      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked

  release:
    name: release
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, bl]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0   # release-plz needs full git history for changelog

      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
