name: CI

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

# Newer push or PR update on the same ref supersedes the older in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build-and-test
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          clean: false   # keep target/ between runs for cargo freshness + kache

      - run: kache stats
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - run: kache stats

  release-plz:
    name: release-plz
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0   # release-plz needs full git history for changelog
          clean: false     # keep target/ between runs for cargo freshness + kache

      - run: kache stats
      - uses: release-plz/action@v0.5
        with:
          # Default (no command) runs both `release-pr` and `release`.
          # `dry_run` applies only to `release`; `release-pr` opens PRs for real.
          dry_run: true
        env:
          # GH_RELEASE_TOKEN (fine-grained PAT) lets release-plz trigger
          # downstream workflows (binary publish, tap PRs). The default
          # GITHUB_TOKEN does not cascade workflow_run events.
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      - run: kache stats

  publish-release:
    name: publish-release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          clean: false

      # nix-hash, required by goreleaser's `nix` block to compute the NUR sha256.
      - uses: cachix/install-nix-action@v31

      - run: kache stats
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      - run: kache stats
