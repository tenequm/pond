name: Windows build prerequisites
description: >
  Everything the two Windows jobs need after checkout: protoc, moon, the pinned
  Rust toolchain, and the kache S3 build cache. Shared so windows-verify and
  windows-dist cannot drift apart - a protoc version skew between them would
  produce two differently-built binaries from one commit.

  Deliberately NOT including checkout: a local composite action can only be
  resolved once the repository is already checked out, and `git config --system
  core.longpaths true` has to run before checkout anyway (pond's longest
  tracked path is 456 chars and git refuses it otherwise). Both callers do
  those two steps inline.
inputs:
  kache-access-key-id:
    description: S3 access key for the kache remote.
    required: true
  kache-secret-access-key:
    description: S3 secret key for the kache remote.
    required: true
  cache-executables:
    description: >
      Cache the linked executables too. Off by default because a restored
      binary carries unresolved .pdb paths, i.e. weaker backtraces on a failing
      test - a fair trade on the verify leg, not on the leg whose output ships.
    default: 'false'
  manifest-key:
    description: >
      Scopes kache's warm-prefetch manifest. MUST differ per build variant:
      every build sharing the bucket otherwise writes the same triple-keyed
      default and they clobber each other, silently dropping prefetch to zero.

      Doubles as the config selector: this bootstrap loads
      .github/kache/<manifest-key>.toml, so a new build variant gets its own
      remote settings by adding a file with the matching name.
    required: true
  s3-prefix:
    description: >
      Remote key prefix handed to kache-action. Declared once here rather than
      per caller because both Windows legs share it today; the step below
      asserts it equals the `prefix` in the selected .github/kache/*.toml and
      fails the job if they differ.
    default: kache/pond
runs:
  using: composite
  steps:
    # The windows-2025 image ships neither protoc nor NASM. protoc: direct zip,
    # matching lance's own windows-build job (no third-party action).
    - name: Install protoc
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # Keep in lockstep with PROTOC_VERSION in .github/actions/bootstrap.
        $v = '35.1'
        Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$v/protoc-$v-win64.zip" -OutFile protoc.zip
        Expand-Archive protoc.zip -DestinationPath C:\protoc
        "C:\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    # NASM is aws-lc-sys's only extra Windows x86-64 prerequisite, and it ships
    # CI-verified prebuilt objects for exactly that case, so opting in drops a
    # release-critical dependency on community.chocolatey.org - which rate-limits
    # GitHub Actions IPs and reports the refusal as "package was not found".
    # Only forgoes assembly size reduction under opt-level s/z, which neither the
    # release nor the dist profile uses.
    - name: Use aws-lc-sys prebuilt NASM objects
      shell: pwsh
      run: |
        "AWS_LC_SYS_PREBUILT_NASM=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # Pinned to the version .github/actions/bootstrap installs on Linux: the two
    # share a remote cache, and moon refuses a cache written by another version.
    # Located by search rather than by guessing the archive layout.
    - name: Install moon
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $v = '2.5.1'
        Invoke-WebRequest -Uri "https://github.com/moonrepo/moon/releases/download/v$v/moon_cli-x86_64-pc-windows-msvc.zip" -OutFile moon.zip
        Expand-Archive moon.zip -DestinationPath C:\moon
        $dir = (Get-ChildItem C:\moon -Filter moon.exe -Recurse | Select-Object -First 1).DirectoryName
        $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Both kache settings live here rather than in one job's env, which is how
    # they drifted before: 0ed4a0c tuned windows-verify and left windows-dist on
    # the defaults, so the dist leg kept restoring hits across volumes and
    # prefetching almost none of them.
    - name: Tune the kache store
      shell: pwsh
      run: |
        # kache defaults its store to %LOCALAPPDATA% on C:, a slow ~29 GB
        # network-attached disk on this image; D: is ~147 GB of fast local
        # storage and already holds target/ (actions/runner-images#12416).
        "KACHE_CACHE_DIR=D:\kache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        # Prefetch stops at 2GiB of blobs, 2000 entries, or 300s of scheduling
        # by default and this graph is past two of the three - 1454 cached
        # units, lance alone 287 MB of ~790 crates - so what a cap drops is an
        # expensive crate. 0 means unlimited for each (src/config.rs;
        # prefetch_key_budget_overflow returns 0 when max_keys is 0). The key
        # cap is precautionary: 2000 is already above today's 1454.
        "KACHE_PREFETCH_MAX_BYTES=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "KACHE_PREFETCH_MAX_KEYS=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "KACHE_PREFETCH_DEADLINE_SECS=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # Same disk argument as KACHE_CACHE_DIR above: the cargo registry index and
    # the unpacked .crate sources are thousands of small files, and on C: every
    # one is a round trip to a network-attached disk. Set before rustup runs so
    # the toolchain's first cargo invocation already writes to D:.
    #
    # CARGO_HOME moves, RUSTUP_HOME does not: rustup's proxies resolve
    # toolchains out of RUSTUP_HOME and never read CARGO_HOME, and the proxies
    # already on PATH are self-contained copies of rustup.exe, so cargo and
    # rustc keep working with an empty D:\cargo\bin.
    #
    # This makes `--no-self-update` on the next step LOAD-BEARING: rustup's
    # self-update looks for rustup.exe inside $CARGO_HOME/bin and hard-fails
    # with "rustup is not installed at 'D:\cargo'" when it is absent
    # (rust-lang/rustup#2946). Any rustup update added to this job needs the
    # flag too.
    - name: Put the cargo registry on the D drive
      shell: pwsh
      run: |
        "CARGO_HOME=D:\cargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # rustup honors rust-toolchain.toml; the host triple IS the build target,
    # so no extra rust-std is downloaded.
    - name: Materialize the pinned toolchain
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        rustup toolchain install --no-self-update
        rustup show active-toolchain
        cargo --version

    # The remote settings live in a committed file, not in this job's env,
    # because a daemon cannot watch an environment: 0.15.0 strips
    # KACHE_S3_BUCKET/ENDPOINT/REGION/PREFIX/PROFILE from every daemon it
    # spawns itself (src/daemon.rs, AMBIENT_REMOTE_ENV_VARS) and keeps
    # KACHE_CONFIG. Exported BEFORE kache-action so the daemon it starts, every
    # rustc wrapper invocation, and the post step all load the same file.
    # Discovery is KACHE_CONFIG > nearest .kache.toml > XDG, identically at
    # 0.9.0 and 0.14.2 (src/config.rs, resolve_config_path).
    #
    # The assertion is not cosmetic. At 0.14.2 env beats file for the CLI and
    # kache-action always exports KACHE_S3_PREFIX; at 0.15 the daemon loses the
    # env prefix but keeps the file. A mismatch therefore means the daemon
    # prefetches from and uploads to one prefix while save-manifest writes
    # another - prefetch silently never lands, which is the exact failure this
    # whole arrangement exists to remove.
    - name: Select the kache config
      shell: pwsh
      env:
        KACHE_CONFIG_NAME: ${{ inputs.manifest-key }}
        KACHE_PREFIX_EXPECTED: ${{ inputs.s3-prefix }}
      run: |
        $ErrorActionPreference = 'Stop'
        $config = Join-Path $env:GITHUB_WORKSPACE ".github\kache\$($env:KACHE_CONFIG_NAME).toml"
        if (-not (Test-Path $config)) { throw "no kache config at $config" }
        $match = Select-String -Path $config -Pattern '^\s*prefix\s*=\s*"([^"]+)"' | Select-Object -First 1
        if (-not $match) { throw "no [cache.remote] prefix in $config" }
        $filePrefix = $match.Matches[0].Groups[1].Value
        if ($filePrefix -ne $env:KACHE_PREFIX_EXPECTED) {
          throw "kache prefix mismatch: $config has '$filePrefix', kache-action is given '$($env:KACHE_PREFIX_EXPECTED)'"
        }
        "KACHE_CONFIG=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "kache config $config, prefix $filePrefix"

    # kache on S3, deliberately NOT GitHub's cache: GitHub caps a repository at
    # 10 GB (raisable only as a paid metered SKU) and scopes entries per branch
    # so siblings cannot share. This graph does not fit that, and Windows work
    # happens on feature branches. kache is content-addressed in the same
    # Hetzner bucket the dist build uses - no ceiling, no GitHub storage
    # billing, keys portable across branches and runners.
    #
    # Pinned to main, NOT the v1 tag: v1 predates Windows support and fails
    # outright with "Unsupported platform: win32-x64".
    #
    # Accepted limitation: kache is a RUSTC_WRAPPER, so it caches rustc units
    # but not build-script EXECUTION - aws-lc-sys under cmake, plus ring,
    # blake3 and zstd-sys, recompile their native halves every run.
    #
    # Its post step is `success() || failure()`, so a red run still saves, which
    # matters because Windows iteration means a test failing after a long compile.
    - uses: kunobi-ninja/kache-action@a257c055543c2840700a9bbca8f9c3094a421b1b # main @ 2026-06-19
      with:
        s3-bucket: ttq
        s3-endpoint: https://nbg1.your-objectstorage.com
        s3-region: nbg1
        # Same prefix as the dist build's raw-kache usage. Content-addressed and
        # triple-keyed, so sharing can only add hits, never cross-contaminate.
        # Asserted equal to the config file's `prefix` by the step above.
        s3-prefix: ${{ inputs.s3-prefix }}
        s3-access-key-id: ${{ inputs.kache-access-key-id }}
        s3-secret-access-key: ${{ inputs.kache-secret-access-key }}
        github-cache: false
        # Pinned like Linux pins KACHE_VERSION: the default resolves latest at
        # run time, so an upstream cache-key bump invalidates the store with no
        # commit here. 0.14.0's bump cost a 138 min run against 9.5 min warm.
        version: v0.14.2
        manifest-key: ${{ inputs.manifest-key }}
        # The hosted runner's disk is far smaller than kache's 50GiB default,
        # and an evicted local entry costs a remote fetch, not a rebuild.
        max-size: 20GiB
        # ~3 min of link time on unchanged sources; the trade is unresolved
        # .pdb paths on a restored harness. Revert this line alone if job time
        # regresses - it is independent of everything else in the round.
        cache-executables: ${{ inputs.cache-executables }}
        # Would require `pull-requests: write`, which this workflow deliberately
        # does not grant. The job summary carries the same report.
        pr-comment: false

    # The one kache step deliberately allowed to redden the job, and the reason
    # a bad config file makes CI red rather than slow: the wrapper calls
    # Config::load() on every rustc invocation, so a TOML typo or a rejected
    # prefix would otherwise kill 1454 compiles one at a time instead of once
    # here. A config gate, not a connectivity gate - the `Remote:` line is
    # resolved from the config without the bucket having to answer. Expect an
    # auto-start line: `kache stats` starts a daemon if none is reachable, which
    # is harmless here.
    #
    # The exit code is NOT the gate. Measured against 0.9.0: a config whose TOML
    # does not parse makes `kache stats` print `Remote: not configured` and exit
    # 0, which is precisely the silent local-only run this arrangement exists to
    # prevent. So the assertion is on the line itself.
    - name: Verify the kache config loads
      shell: pwsh
      env:
        KACHE_PREFIX_EXPECTED: ${{ inputs.s3-prefix }}
      run: |
        $ErrorActionPreference = 'Stop'
        $stats = kache stats 2>&1
        $stats
        $line = $stats | Select-String -Pattern '^Remote:\s+(\S+)' | Select-Object -First 1
        if (-not $line) { throw "kache stats printed no Remote: line" }
        $remote = $line.Matches[0].Groups[1].Value
        if ($remote -notmatch "^s3://.+/$([regex]::Escape($env:KACHE_PREFIX_EXPECTED))$") {
          throw "kache resolved its remote to '$remote', expected an s3 remote ending in '$($env:KACHE_PREFIX_EXPECTED)' - the config at $env:KACHE_CONFIG did not load as intended"
        }
