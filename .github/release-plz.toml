[workspace]
publish = true
# Skip the `cargo publish` verify build: build-and-test already compiled this
# exact code on the self-hosted runner (with protoc + kache), and a cold lance
# build on ubuntu-latest risks the publish timeout. Packaging contents are
# gated in CI by pond:check-package (cargo package --list vs include_str!).
publish_no_verify = true
# Release whenever main has an unpublished version bump (the release-plz
# default). The release PR still drives version/changelog; this just also covers
# the case where the bump is already on main but unpublished.
release_always = true
# pond ships as a CLI + MCP server; the `pond` lib exists only so the binary and
# integration tests share code, not as a public API others depend on. cargo-
# semver-checks guards library consumers we don't have, so skip it - it otherwise
# adds a multi-minute cold rustdoc build of the heavy dep tree to every release.
semver_check = false
# Label the release PR so it is findable deterministically
# (`gh pr list --label release`), not by title pattern-matching.
pr_labels = ["release"]

# The crate now lives at packages/pond, so this is a cargo workspace. Without
# these overrides release-plz would switch to workspace-style `pond-db-v{{
# version }}` tags and write packages/pond/CHANGELOG.md - both would break the
# release pipeline (the publish-release job, Homebrew formula, and nix flake all
# key off a `vX.Y.Z` tag; the changelog gate reads the root CHANGELOG.md).
[[package]]
name = "pond-db"
# Pin the pre-workspace tag + GitHub-release scheme.
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
# Keep the changelog at the repo root (path is relative to the workspace root),
# where check-changelog-headers.sh and the pre-commit hook already read it.
changelog_path = "CHANGELOG.md"

# Lance-style release notes: emoji-grouped sections, scope-bolded entries, PR
# links, breaking markers, and a per-version compare link. release-plz strips the
# `## [version]` heading line when posting the GitHub release body (GitHub shows
# the tag as the title already), so the compare link also lives in a `**Full
# Changelog**` footer that survives into the release body - the heading link is
# only for CHANGELOG.md structure. The `<!-- N -->` prefixes order the sections
# (group_by sorts alphabetically; GitHub renders the HTML comments invisibly).
[changelog]
# Explicit header: new sections insert right after this exact text. Without it,
# each release glues onto `# Changelog`, eating one newline per release
# (0.11.1 lost the blank line; 0.11.2 lost the newline itself).
header = """# Changelog

"""
# The entry is generated from squash-commit messages alone, so it survives every
# release-PR refresh (release-plz force-pushes/reopens the release PR on each main
# push - hand edits there are lost by design). The squash body is the full PR
# description, landed automatically by the repo's squash defaults
# (squash_merge_commit_title = PR_TITLE, squash_merge_commit_message = PR_BODY -
# repo settings, load-bearing: see AGENTS.md "Changelog authoring"), so the
# template extracts what it needs itself. Per commit, in order:
# a `## Release note` section renders as indented prose under that commit's
# bullet (the rest of the description never reaches the changelog); a body with
# other `## ` sections but no release-note section contributes nothing (a
# structured PR body whose author declared nothing user-visible); a body with no
# markdown sections at all renders whole, as before (plain/direct commits). A
# section after a lone `[release-note]` line is hoisted to the top of the entry
# (release lead paragraph / Upgrading block).
# Prose comes from `raw_message`, not `body`: the conventional parser eats a
# trailer-shaped FINAL paragraph ("Fixture: three replays converge.") into
# `footers`, silently dropping it from `body` - raw_message keeps every line, and
# the line filter below strips the real trailers (Co-authored-by etc.) instead.
# The section split pattern is "\n## Release note" (line-anchored by the leading
# newline) so prose that merely mentions the section name cannot trigger it.
body = """
## [{{ version }}]{% if release_link %}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{%- for commit in commits %}
{%- if commit.raw_message is containing("\n## Release note") %}{% set hoist_src = commit.raw_message | split(pat="\n## Release note") | last | split(pat="\n## ") | first %}{% else %}{% set hoist_src = commit.raw_message %}{% endif %}
{%- if hoist_src is containing("[release-note]") %}
{% set note = hoist_src | split(pat="[release-note]") | last | trim %}
{%- for line in note | split(pat="\n") %}
{%- if line is starting_with("Co-authored-by") or line is starting_with("Signed-off-by") or line is starting_with("Reviewed-by") or line is starting_with("changelog:") or line is starting_with("BREAKING") %}{% else %}
{{ line }}
{%- endif %}
{%- endfor %}
{%- endif %}{% endfor %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}{% if commit.scope %}- **{{ commit.scope }}:** {% else %}- {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/tenequm/pond/commit/{{ commit.id }}))
{%- if commit.raw_message is containing("\n## Release note") %}
{%- set prose_src = commit.raw_message | split(pat="\n## Release note") | last | split(pat="\n## ") | first %}
{%- elif commit.raw_message is containing("\n## ") %}
{%- set prose_src = "" %}
{%- else %}
{%- set prose_src = commit.raw_message | split(pat="\n") | slice(start=1) | join(sep="\n") %}
{%- endif %}
{%- set prose = prose_src | split(pat="[release-note]") | first | trim %}
{%- if prose %}
{%- for line in prose | split(pat="\n") %}
{%- if line is starting_with("Co-authored-by") or line is starting_with("Signed-off-by") or line is starting_with("Reviewed-by") or line is starting_with("changelog:") or line is starting_with("BREAKING") %}{% else %}
{% if line %}  {{ line }}{% endif %}
{%- endif %}
{%- endfor %}
{%- endif %}
{% endfor %}{% endfor %}{% if release_link %}
**Full Changelog**: {{ release_link }}
{% endif %}"""
trim = true
protect_breaking_commits = true
commit_preprocessors = [
  # FIRST, before the PR-link rewrite below: it needs the bare `(#N)` in the
  # subject to find the PR. Recovers a `## Release note` from the pull request
  # when the squash commit landed without one (see the script for why that
  # happens and why it cannot be fixed after the fact). Both the changelog and
  # the GitHub release body render from this, so both stay correct.
  { pattern = '(?s)^.*$', replace_command = "ops/scripts/release-note-from-pr.sh" },
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/tenequm/pond/pull/${1}))" },
]
commit_parsers = [
  # Commit-level opt-out: a `changelog: ignore` footer excludes the commit.
  { footer = "^changelog: ?ignore", skip = true },
  { message = "^chore: release", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 0 -->🛠 Breaking Changes" },
  { body = "^BREAKING CHANGE", group = "<!-- 0 -->🛠 Breaking Changes" },
  { message = "^feat", group = "<!-- 1 -->🎉 New Features" },
  { message = "^fix", group = "<!-- 2 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->🚀 Performance" },
  { message = "^refactor", group = "<!-- 4 -->🚜 Refactor" },
  { message = "^docs", group = "<!-- 5 -->📚 Documentation" },
  { message = "^chore|^ci|^build|^test", group = "<!-- 6 -->🧹 Chores" },
  { message = "^.*", group = "<!-- 7 -->🔧 Other" },
]
