# moon v2.x workspace config. packages/ monorepo: the Rust crate under
# packages/pond, the OpenClaw plugin under packages/openclaw-pond, the Hermes
# plugin under packages/hermes-pond, the pi extension under packages/pi-pond,
# and repo-level tasks (changelog gate, dist build) on the root `repo` project.
projects:
  pond: 'packages/pond'
  openclaw-pond: 'packages/openclaw-pond'
  hermes-pond: 'packages/hermes-pond'
  pi-pond: 'packages/pi-pond'
  repo: '.'

vcs:
  defaultBranch: 'main'
  # sync: true wires core.hooksPath -> .moon/hooks on every moon run, so the
  # pre-commit gate configures itself on any fresh clone (no manual setup).
  # The gate is moon tasks directly - one moon session, portable to the .ps1
  # hooks moon generates on Windows. check-changelog and check-knowledge
  # declare inputs, so an untouched input is an instant cache replay;
  # secret-scan reads the git index and never caches.
  hooks:
    pre-commit:
      - 'moon run repo:secret-scan repo:check-changelog repo:check-knowledge'
  sync: true

# .claude/ and .agents/ hold local Claude Code settings and skill symlinks that
# point outside the repo; moon's vcs walk follows them, so exclude from hashing.
hasher:
  ignorePatterns:
    - '.claude/**/*'
    - '.agents/**/*'

remote:
  # Enabled per-context via MOON_REMOTE_HOST (unset = remote cache off).
  # Fork PRs get no secrets; an empty auth header hard-fails the task.
  auth:
    headers:
      Authorization: '${BAZEL_REMOTE_AUTH}'
  cache:
    instanceName: 'pond'
    compression: 'zstd'
