# moon v2.x workspace config. One flat crate at the repo root (per CLAUDE.md).
projects:
  pond: '.'

vcs:
  defaultBranch: 'main'
  # sync: true wires core.hooksPath -> .moon/hooks on every moon run, so the
  # secret-scan gate configures itself on any fresh clone (no manual setup).
  hooks:
    pre-commit:
      - './.github/hooks/pre-commit'
  sync: true

# .claude/ and .agents/ hold local Claude Code settings and skill symlinks that
# point outside the repo; moon's vcs walk follows them, so exclude from hashing.
hasher:
  ignorePatterns:
    - '.claude/**/*'
    - '.agents/**/*'

remote:
  # Enabled per-context via MOON_REMOTE_HOST (unset = remote cache off).
  # Fork PRs get no secrets; an empty auth header hard-fails the task.
  auth:
    headers:
      Authorization: '${BAZEL_REMOTE_AUTH}'
  cache:
    instanceName: 'pond'
    compression: 'zstd'
