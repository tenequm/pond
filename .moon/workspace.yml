# moon v2.x workspace config. packages/ monorepo: the Rust crate under
# packages/pond, the OpenClaw plugin under packages/openclaw-pond, the Hermes
# plugin under packages/hermes-pond, the pi extension under packages/pi-pond,
# and repo-level tasks (changelog gate, dist build) on the root `repo` project.
projects:
  pond: 'packages/pond'
  openclaw-pond: 'packages/openclaw-pond'
  hermes-pond: 'packages/hermes-pond'
  pi-pond: 'packages/pi-pond'
  repo: '.'

vcs:
  defaultBranch: 'main'
  # sync: true wires core.hooksPath -> .moon/hooks on every moon run, so the
  # secret-scan gate configures itself on any fresh clone (no manual setup).
  hooks:
    pre-commit:
      - './.github/hooks/pre-commit'
  sync: true

# .claude/ and .agents/ hold local Claude Code settings and skill symlinks that
# point outside the repo; moon's vcs walk follows them, so exclude from hashing.
hasher:
  ignorePatterns:
    - '.claude/**/*'
    - '.agents/**/*'
  # 'accuracy' parses every declared lockfile into the task hash; pond's
  # Cargo.lock is ~800 crates and gets parsed once per task. 'performance'
  # skips that parse and hashes manifest version ranges instead. A dependency
  # change still invalidates, but for a different reason than before: the
  # lockfiles are declared FILE inputs - Cargo.lock through the shared `sources`
  # fileGroup, package-lock.json on every plugin task - and a file input is
  # hashed by content under either setting. The rule that follows: a task that
  # omits its lockfile from `inputs` now silently survives a dependency bump.
  optimization: 'performance'

remote:
  # Enabled per-context via MOON_REMOTE_HOST (unset = remote cache off).
  # Fork PRs get no secrets; an empty auth header hard-fails the task.
  auth:
    headers:
      Authorization: '${BAZEL_REMOTE_AUTH}'
  cache:
    instanceName: 'pond'
    compression: 'zstd'
