language: typescript

# Wrappers over the package's own npm scripts (tsc + vitest). node and npm come
# from the moon toolchain (.moon/toolchains.yml), which provisions them via
# proto, so these run on a machine that has never had node installed.
#
# package-lock.json is an input everywhere: it pins the installed tree, so a
# dependency bump changes what tsc and vitest actually run against. Without it
# a lockfile-only commit serves a cached pass for a tree that was never checked.
tasks:
  # moon provisions node and npm but does not install the package's own
  # dependencies: the JavaScript toolchain's install only triggers for a
  # package.json at a JS workspace root, and this one is a lone manifest inside
  # a Rust-first monorepo. So the install is declared.
  #
  # cache: false is load-bearing. The cache key would be the lockfile while the
  # real artifact is node_modules/, which a fresh CI checkout never has - a hit
  # would skip `npm ci` and leave the dependents with no tsc and no vitest,
  # which is precisely how this suite failed before it was wired up.
  #
  # The moon v2.4 `condition` check is the safe form of that skip: it asks the
  # filesystem instead of a hash. `npm ci` wipes node_modules/ before it
  # installs, so a stamp INSIDE node_modules/ that still matches the manifests
  # can only mean this tree was installed from them. A condition check skips the
  # task only when it exits 0, so every doubt - no node_modules/, a changed
  # manifest, no `cmp` on the machine - runs the install as before. This is what
  # stops agents and warm runners reinstalling node_modules on every invocation.
  #
  # The stamp covers package.json as well as the lockfile, and has to: `npm ci`
  # validates the two against each other and fails on a desync, but it only
  # reaches that check - and only wipes node_modules/ - when it actually runs.
  # Stamping the lockfile alone would skip the install after a package.json-only
  # edit, and the desync `npm ci` exists to catch would go unreported.
  install:
    script: 'npm ci && cat package.json package-lock.json > node_modules/.moon-install-stamp'
    checks:
      - check: 'condition'
        script: 'cat package.json package-lock.json | cmp -s - node_modules/.moon-install-stamp'
    inputs:
      - 'package.json'
      - 'package-lock.json'
    options:
      cache: false

  typecheck:
    command: 'npm run typecheck'
    deps: ['~:install']
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - 'index.ts'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'package.json'
      - 'package-lock.json'

  test:
    command: 'npm test'
    deps: ['~:install']
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - 'index.ts'
      - 'vitest.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'package.json'
      - 'package-lock.json'
