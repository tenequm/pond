language: typescript

# Minimal wrappers over the package's own npm scripts (tsc + vitest). Uses the
# system node toolchain; all paths inside the package are already package-relative.
tasks:
  typecheck:
    command: 'npm run typecheck'
    toolchains: ['system']
    inputs: ['src/**/*', 'test/**/*', 'index.ts', 'tsconfig.json', 'tsconfig.build.json', 'package.json']
  test:
    command: 'npm test'
    toolchains: ['system']
    inputs: ['src/**/*', 'test/**/*', 'index.ts', 'vitest.config.ts', 'tsconfig.json', 'package.json']
