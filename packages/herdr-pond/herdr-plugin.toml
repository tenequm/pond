id = "pond"
name = "pond"
version = "0.1.0"
# Floor for: agent focus moves clients, the plugin-pane PWD fix, and a plugin
# registry that survives client-only updates.
min_herdr_version = "0.9.1"
description = "Search and read every agent session from your pond store - all harnesses, all machines."
platforms = ["macos", "linux"]

[[actions]]
id = "desk"
title = "pond: session desk"
contexts = ["pane", "workspace"]
command = ["bin/herdr-pond", "open"]

# The title becomes the pane label, which `open` uses as the dedupe key.
[[panes]]
id = "desk"
title = "pond desk"
placement = "overlay"
command = ["bin/herdr-pond", "tui"]

[[events]]
on = "pane.agent_status_changed"
command = ["bin/herdr-pond", "hook"]

[[startup]]
command = ["bin/herdr-pond", "serve-daemon"]
