[package]
name = "herdr-pond"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "herdr plugin for pond: sync-on-idle and a read-only session desk"
repository = "https://github.com/tenequm/pond"
publish = false

# A thin HTTP client of `pond serve`: never depend on the pond crate, which
# drags in lance, datafusion, candle and protoc.
[dependencies]
anyhow = "1"
chrono = { version = "0.4.44", default-features = false, features = ["std", "clock", "serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
nix = { version = "0.31", features = ["process", "signal", "fs", "hostname"] }
ratatui = "0.30.2"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
textwrap = "0.16"
tokio = { version = "1.52", features = ["rt", "macros", "time", "sync", "signal", "process"] }
toml = "1.1"
unicode-width = "0.2"

[dev-dependencies]
tokio = { version = "1.52", features = ["test-util", "net", "io-util"] }

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
implicit_clone = "warn"
print_stdout = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
uninlined_format_args = "warn"
unwrap_used = "warn"
