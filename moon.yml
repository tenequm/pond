language: rust

env:
  CARGO_TERM_COLOR: always

# Repo-level project: tasks that operate on the whole tree from the repo root
# (changelog gate, the multi-target dist build that writes dist/ + target/ at
# root). The crate itself is the `pond` project under packages/pond.
#
# Same completeness rule as the crate's own group: SKILL.md is embedded into the
# binary via include_str!, and this root manifest carries every [profile.*], so
# both must invalidate the dist build - a cached dist/ would otherwise ship the
# previous skill text or the previous dist profile.
fileGroups:
  sources:
    - 'packages/pond/src/**/*'
    - 'packages/pond/build.rs'
    - 'packages/pond/SKILL.md'
    - 'packages/pond/Cargo.toml'
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain.toml'
    # The msvc rustflags (+crt-static) live here, and a moon fingerprint that
    # omits them lets a rustflags change be served from a cache entry built with
    # the old ones. kache's own keys already include the flags, so adding this
    # costs one moon run and no cold cache.
    - '.cargo/config.toml'
  tests:
    - 'packages/pond/tests/**/*'

tasks:
  # Gate the top CHANGELOG.md section's `###` headers to the canonical emoji
  # taxonomy from .github/release-plz.toml, and require release-note prose on
  # user-visible entries. The release body is that section verbatim
  # (release-plz git_release_body default), and it fans out to the GitHub
  # release + homebrew-tap + pond-nix, so a hand-edit that drops the emoji
  # headers silently de-styles all three.
  check-changelog:
    script: |
      set -euo pipefail

      file=CHANGELOG.md

      allowed=(
        "🛠 Breaking Changes"
        "🎉 New Features"
        "🐛 Bug Fixes"
        "🚀 Performance"
        "🚜 Refactor"
        "📚 Documentation"
        "🧹 Chores"
        "🔧 Other"
      )

      section=$(awk '/^## \[/{n++} n==1{print} n==2{exit}' "$file")
      [ -n "$section" ] || { echo "check-changelog: no '## [version]' section in $file" >&2; exit 1; }

      bad=0
      while IFS= read -r line; do
        [[ "$line" == "### "* ]] || continue
        header=$(printf '%s' "$line" | sed -E 's/^### +//; s/<!--[^>]*-->//; s/^ *//; s/ *$//')
        ok=0
        for a in "${allowed[@]}"; do [ "$header" = "$a" ] && { ok=1; break; }; done
        if [ "$ok" -eq 0 ]; then
          echo "check-changelog: non-canonical header: ### $header" >&2
          bad=1
        fi
      done <<< "$section"

      if [ "$bad" -ne 0 ]; then
        echo >&2
        echo "Allowed headers (keep release-plz's generated emoji form, add prose under them):" >&2
        printf '  ### %s\n' "${allowed[@]}" >&2
        exit 1
      fi

      # Backstop for the release-note flow: a user-visible entry with no prose
      # under it means the note is missing at the source - the PR description
      # had no `## Release note` section either, since a squash that merely
      # lost its body is repaired at generation time from the PR (see AGENTS.md
      # "Changelog authoring"). Fix it by adding the section to that PR's
      # description, which the next release PR refresh picks up; the release PR
      # can also be hand-patched before it ships.
      #
      # Only checked when this change actually writes the top entry - i.e. the
      # release PR. An entry already on `main` is shipped history the flow
      # cannot fix, and enforcing prose there would block every later commit on
      # someone else's miss.
      # No pipe here: awk exits at the second version heading, and a CHANGELOG
      # past the 64KB pipe buffer would SIGPIPE git show, which pipefail turns
      # into exit 141.
      main_changelog=$(git show origin/main:"$file" 2>/dev/null || true)
      base_section=$(awk '/^## \[/{n++} n==1{print} n==2{exit}' <<< "$main_changelog")
      # An unresolvable origin/main (a fresh clone before its first fetch, a
      # remote under another name, a shallow checkout) leaves the base empty,
      # and the gate then cannot tell a new entry from shipped history;
      # skipping is correct because the prose gate must never fire on an entry
      # this flow cannot fix. CI always has a base, since it checks out at
      # fetch-depth: 0.
      if [ -z "$base_section" ] || [ "$section" = "$base_section" ]; then
        exit 0
      fi

      bare=$(awk '
        /^### / { visible = ($0 ~ /(New Features|Bug Fixes|Performance|Breaking Changes)/); next }
        /^- / { if (visible) { entry = $0; if ((getline nxt) <= 0 || nxt !~ /^  /) print entry } }
      ' <<< "$section")

      if [ -n "$bare" ]; then
        echo "check-changelog: user-visible entries with no release-note prose:" >&2
        printf '  %s\n' "$bare" >&2
        echo >&2
        echo "Write the prose in the squash-commit body at merge time (PR's '## Release note')." >&2
        echo "For an already-merged commit, hand-patch this entry on the release PR." >&2
        exit 1
      fi
    inputs: ['CHANGELOG.md']

  # Validate the Open Knowledge Format (OKF) bundle under docs/knowledge/:
  # every concept file has valid frontmatter with a non-empty scalar type, each
  # concept sits in the directory its type names, relative markdown links
  # resolve to existing files, index.md and the concept files on disk stay in
  # sync, and log.md is present.
  #
  # Link checking covers only links INSIDE the bundle. Paths that name a concept
  # from elsewhere in the repo (docs/spec.md, the add-adapter playbook, adapter
  # doc comments) are invisible here, so renaming a concept means sweeping the
  # repo for them by hand - a bundle rename passed every gate while leaving 19
  # dangling references exactly once.
  check-knowledge:
    script: |
      set -euo pipefail

      if ! command -v python3 >/dev/null 2>&1; then
        echo "check-knowledge: python3 not found; SKIPPING - CI is the hard gate" >&2
        exit 0
      fi

      python3 - <<'PY'
      import os
      import re
      import sys

      try:
          import yaml
          HAVE_YAML = True
      except ImportError:
          HAVE_YAML = False
          sys.stderr.write("check-knowledge: warning: yaml module not found, full YAML validation skipped\n")

      bundle_dir = os.path.join("docs", "knowledge")
      index_file = os.path.join(bundle_dir, "index.md")
      log_file = os.path.join(bundle_dir, "log.md")

      # A concept's directory is derivable from its type, which is what keeps
      # filing mechanical instead of a judgment call. Enforce the match here or
      # it silently stops being true.
      TYPE_DIRS = {"Decision": "decisions", "Finding": "findings", "Reference": "references", "Runbook": "runbooks"}

      violations = []

      if not os.path.isdir(bundle_dir):
          sys.stderr.write(f"check-knowledge: {bundle_dir}: bundle directory does not exist\n")
          sys.exit(1)

      # 1. log.md must exist.
      if not os.path.isfile(log_file):
          violations.append(f"check-knowledge: {log_file}: file does not exist")

      # 2. index.md must exist.
      if not os.path.isfile(index_file):
          violations.append(f"check-knowledge: {index_file}: file does not exist")

      # Collect all *.md files under docs/knowledge/ recursively
      all_md_files = []
      for root, _, files in os.walk(bundle_dir):
          for f in files:
              if f.endswith(".md"):
                  all_md_files.append(os.path.normpath(os.path.join(root, f)))

      norm_index = os.path.normpath(index_file)
      norm_log = os.path.normpath(log_file)

      concept_files = [f for f in all_md_files if f != norm_index and f != norm_log]
      concept_set = set(concept_files)

      # 3. Validate frontmatter of concept files
      for file_path in concept_files:
          try:
              with open(file_path, "r", encoding="utf-8") as f:
                  content = f.read()
          except Exception as e:
              violations.append(f"check-knowledge: {file_path}: cannot read file: {e}")
              continue

          lines = content.splitlines()
          if not lines or lines[0].strip() != "---":
              violations.append(f"check-knowledge: {file_path}: missing opening frontmatter delimiter (---)")
              continue

          closing_idx = -1
          for idx in range(1, len(lines)):
              if lines[idx].strip() == "---":
                  closing_idx = idx
                  break

          if closing_idx == -1:
              violations.append(f"check-knowledge: {file_path}: missing closing frontmatter delimiter (---)")
              continue

          fm_text = "\n".join(lines[1:closing_idx])

          if HAVE_YAML:
              try:
                  data = yaml.safe_load(fm_text)
              except Exception as e:
                  violations.append(f"check-knowledge: {file_path}: invalid YAML frontmatter: {e}")
                  continue

              if not isinstance(data, dict):
                  violations.append(f"check-knowledge: {file_path}: frontmatter is not a mapping")
                  continue

              type_val = data.get("type")
              if type_val is None:
                  violations.append(f"check-knowledge: {file_path}: missing 'type' in frontmatter")
              elif isinstance(type_val, (dict, list)):
                  violations.append(f"check-knowledge: {file_path}: 'type' must be a non-empty scalar value")
              elif isinstance(type_val, str) and not type_val.strip():
                  violations.append(f"check-knowledge: {file_path}: 'type' must be a non-empty scalar value")
          else:
              # Fallback structural check
              type_found = False
              type_val = None
              for fm_line in lines[1:closing_idx]:
                  m = re.match(r"^type\s*:\s*(.*?)(?:\s+#.*)?$", fm_line)
                  if m:
                      type_found = True
                      val = m.group(1).strip()
                      if (val.startswith('"') and val.endswith('"')) or (val.startswith("'") and val.endswith("'")):
                          val = val[1:-1].strip()
                      type_val = val
                      break

              if not type_found:
                  violations.append(f"check-knowledge: {file_path}: missing 'type' in frontmatter")
              elif not type_val or type_val.startswith(("[", "{")):
                  violations.append(f"check-knowledge: {file_path}: 'type' must be a non-empty scalar value")

          if isinstance(type_val, str) and type_val.strip():
              want = TYPE_DIRS.get(type_val.strip())
              got = os.path.basename(os.path.dirname(file_path))
              if want is None:
                  violations.append(f"check-knowledge: {file_path}: unknown type '{type_val.strip()}'; vocabulary is {', '.join(sorted(TYPE_DIRS))}")
              elif got != want:
                  violations.append(f"check-knowledge: {file_path}: type '{type_val.strip()}' belongs in {want}/, not {got}/")

      # 4. Check relative markdown links in concept files, index.md, and log.md
      link_pattern = re.compile(r'\[(?:\\\]|[^\]])*\]\(([^)]+)\)')

      def extract_links(content):
          targets = []
          for m in link_pattern.finditer(content):
              raw = m.group(1).strip()
              t = raw.split()[0] if raw else ""
              if t.startswith("<") and t.endswith(">"):
                  t = t[1:-1]
              targets.append((raw, t))
          return targets

      index_concept_links = set()

      for file_path in all_md_files:
          try:
              with open(file_path, "r", encoding="utf-8") as f:
                  content = f.read()
          except Exception as e:
              violations.append(f"check-knowledge: {file_path}: cannot read file: {e}")
              continue

          for raw_target, target in extract_links(content):
              if not target:
                  continue
              if target.startswith(("http://", "https://", "#", "mailto:")):
                  continue

              target_no_frag = target.split("#", 1)[0]
              if not target_no_frag:
                  continue

              if target_no_frag.startswith("/"):
                  resolved = os.path.normpath(os.path.join(bundle_dir, target_no_frag.lstrip("/")))
              else:
                  resolved = os.path.normpath(os.path.join(os.path.dirname(file_path), target_no_frag))

              if not os.path.isfile(resolved):
                  violations.append(f"check-knowledge: {file_path}: broken link '{raw_target}' (resolved to '{resolved}')")

              if file_path == norm_index:
                  if resolved != norm_index and resolved != norm_log:
                      index_concept_links.add(resolved)

      # 5. index.md must link every concept file on disk, and every concept link in index.md must exist on disk
      if os.path.isfile(index_file):
          unindexed = concept_set - index_concept_links
          for f in sorted(unindexed):
              violations.append(f"check-knowledge: {index_file}: concept file not listed in index: {f}")

          nonexistent = index_concept_links - concept_set
          for f in sorted(nonexistent):
              violations.append(f"check-knowledge: {index_file}: concept link target does not exist on disk: {f}")

      if violations:
          for v in violations:
              sys.stderr.write(f"{v}\n")
          sys.exit(1)
      PY
    inputs: ['docs/knowledge/**/*']
    options:
      # The validator resolves links that leave the bundle (six concepts link
      # into docs/researches/), so a target can be deleted or renamed without
      # changing this task's fingerprint, and a cached pass would then survive
      # the break it exists to catch - on the pre-commit hook and in CI alike.
      cache: false

  # Scan staged changes for secrets before they enter history - the only cheap
  # moment to stop them, since a committed secret lives in git history forever
  # even after deletion. Runs from the pre-commit hook (.moon/workspace.yml
  # vcs.hooks) as the sole automated gate; there is no CI backstop. Rules +
  # verified-false-positive allowlist: .github/gitleaks.toml.
  secret-scan:
    script: |
      set -euo pipefail

      if ! command -v gitleaks >/dev/null 2>&1; then
        echo "secret-scan: gitleaks not installed; SKIPPING the secret scan." >&2
        echo "  install: brew install gitleaks" >&2
        exit 0
      fi

      if ! gitleaks git --staged --no-banner --redact -v --config .github/gitleaks.toml; then
        echo >&2
        echo "secret-scan: gitleaks flagged a staged secret (above)." >&2
        echo "  real secret?    unstage it, rotate the credential, then re-stage" >&2
        echo "  false positive? add a narrow allowlist block to .github/gitleaks.toml" >&2
        exit 1
      fi
    # cache: false alone still makes moon hash the whole project; the empty
    # list states that no file inputs apply.
    inputs: []
    options:
      # Reads the git index, which no input glob can represent.
      cache: false

  # Publish the npm plugin packages that ride a pond release. Idempotent: a
  # package publishes only when its package.json version is absent from the
  # registry, so bump-less releases and job re-runs are no-ops. Auth is npm
  # trusted publishing (OIDC): the npm CLI exchanges the GitHub Actions
  # id-token itself - no npm token exists anywhere.
  publish-npm:
    script: |
      set -euo pipefail
      for dir in packages/openclaw-pond packages/pi-pond; do
        name=$(node -p "require('./$dir/package.json').name")
        version=$(node -p "require('./$dir/package.json').version")
        if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
          echo "$name@$version already published - skipping"
          continue
        fi
        echo "publishing $name@$version"
        (cd "$dir" && npm ci && npm publish --access public)
      done
    inputs: []
    options:
      cache: false
      outputStyle: stream
      # The task type makes it selectable by moon check and moon ci, so without
      # this a local `moon check --all` runs `npm publish`. `only` keeps the
      # explicit `moon run repo:publish-npm` that the release workflow issues
      # working, while removing it from every local sweep. `inputs: []` states
      # that nothing file-based makes it affected.
      runInCI: 'only'

  # The Windows leg lives in `build-dist-msvc` below, built natively rather than
  # cross-compiled. It is a separate task for the same reason `test-msvc` is
  # separate from `test`: moon's fingerprint carries no OS, so a shared task
  # would hit the hash this one already cached and ship nothing.
  #
  # Machine cross-compile on the pond-ci runner (no docker/buildkit): needs the
  # pond-runner image toolchain (zig 0.16 + cargo-zigbuild + macOS SDK via
  # SDKROOT + rcodesign) and rustup on PATH. Incremental cache = the runner's
  # persistent CARGO_TARGET_DIR. Runs from the repo root: cargo resolves the
  # workspace target dir and dist/ lands at the root where publish-release reads it.
  build-dist:
    script: |
      set -euo pipefail
      export POND_BUILD_COMMIT="$(git rev-parse --short HEAD)"
      TD="${CARGO_TARGET_DIR:-target}"

      # `profile = "minimal"` + targets-in-toml does not reliably fetch
      # rust-std for non-host targets.
      rustup target add aarch64-apple-darwin \
                        aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu

      # kache (S3 rustc cache): warm builds ride CARGO_TARGET_DIR; this is the
      # cold-start net for a fresh /ci-cache. The remote is no longer written
      # here - it lives in .github/kache/linux-dist.toml, which the bootstrap
      # selects through KACHE_CONFIG, so the wrapper and any daemon kache spawns
      # for itself both resolve it from a file they can re-read. The old stub
      # named no bucket and leaned on the job's KACHE_S3_* env, which 0.15.0
      # strips from a daemon spawn. Push on EXIT, not after success: crates
      # compiled before a failure still warm the retry.
      # --all: one paginated LIST of the per-job prefix instead of one LIST
      # per Cargo.lock crate (~833 serial LISTs, 89 s measured from a laptop,
      # worse from a runner). Safe only because the prefix holds exactly this
      # job's artifacts. --allow-partial: 0.15.0 exits non-zero on any failed
      # transfer, and under `set -euo pipefail` that would redden a job that
      # would compile through fine - a partial pull is a slower build, never a
      # broken one.
      export RUSTC_WRAPPER=kache
      kache sync --pull --all --allow-partial
      trap 'kache sync --push || true' EXIT

      # Cargo unifies features across all targets in one invocation, leaking
      # cfg-gated deps across platforms, so macOS builds alone: it pulls
      # candle's macOS-only `metal`, which the linux pair must not see.
      #
      # Windows is not here at all - the msvc zip is built natively by the
      # windows-dist job in ci.yml and handed to publish-release as its own
      # artifact. Cross-compiling Windows was dropped with the gnu target: it
      # never worked at runtime and no CI job ever executed it.
      cargo zigbuild --locked --profile dist --target aarch64-apple-darwin
      cargo zigbuild --locked --profile dist \
        --target aarch64-unknown-linux-gnu \
        --target x86_64-unknown-linux-gnu

      mkdir -p target/dist
      cp "$TD/aarch64-apple-darwin/dist/pond" target/dist/pond-aarch64-apple-darwin
      # zig records LC_BUILD_VERSION sdk >= 26, which makes macOS 26 dyld
      # reject its duplicate libobjc load command; rewrite the recorded sdk to
      # 15.0 and ad-hoc re-sign (the byte-patch invalidates the signature).
      python3 .github/scripts/patch-macos-sdk.py target/dist/pond-aarch64-apple-darwin
      # Developer ID + hardened runtime when the cert is present (release CI),
      # ad-hoc otherwise so local and fork builds still get a loadable arm64
      # binary. Gatekeeper denies unnotarized Developer ID outright, so the
      # cert path is only ever taken by CI, which pairs it with notarization.
      if [ -n "${APPLE_P12_BASE64:-}" ]; then
        creds="$(mktemp -d)"
        printf '%s' "$APPLE_P12_BASE64" | base64 -d > "$creds/id.p12"
        printf '%s' "${APPLE_P12_PASSWORD:-}" > "$creds/id.pass"
        rcodesign --config-file /dev/null sign \
          --p12-file "$creds/id.p12" --p12-password-file "$creds/id.pass" \
          --code-signature-flags runtime \
          target/dist/pond-aarch64-apple-darwin
        rm -rf "$creds"
      else
        rcodesign --config-file /dev/null sign target/dist/pond-aarch64-apple-darwin
      fi
      cp "$TD/aarch64-unknown-linux-gnu/dist/pond" target/dist/pond-aarch64-unknown-linux-gnu
      cp "$TD/x86_64-unknown-linux-gnu/dist/pond" target/dist/pond-x86_64-unknown-linux-gnu
      ls -lh target/dist/

      # Completion scripts are target-independent, so one native run of the
      # linux-amd64 binary (this runner's arch) generates them for every
      # tarball. They must ship pre-generated: nix can't execute the binary
      # in installPhase (autoPatchelfHook only fixes the interpreter later,
      # in fixupPhase).
      rm -rf completions
      mkdir -p completions
      chmod +x target/dist/pond-x86_64-unknown-linux-gnu
      target/dist/pond-x86_64-unknown-linux-gnu completions bash > completions/pond.bash
      target/dist/pond-x86_64-unknown-linux-gnu completions zsh  > completions/_pond
      target/dist/pond-x86_64-unknown-linux-gnu completions fish > completions/pond.fish

      # Package into the archive names brew/nix reference, `pond` at the root.
      # rm first: moon can hydrate a previously cached dist/ into the tree.
      rm -rf dist
      mkdir -p dist
      for t in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
        install -m755 "target/dist/pond-$t" pond
        tar -cJf "dist/pond-$t.tar.xz" pond completions
      done
      rm -f pond
      rm -rf completions
      # Covers only what this task produced. publish-release regenerates it
      # over the merged dist/ once the natively-built Windows zip lands, so
      # this copy never reaches a release.
      ( cd dist && sha256sum pond-* > checksums.txt )
      ls -lh dist/
    # No @group(tests): tests and benches are not linked into the shipped
    # binary, so a test-only change cannot alter dist/ and should not pay a
    # three-target cross-compile.
    #
    # Caveat worth knowing before narrowing these further: the script bakes
    # `git rev-parse HEAD` into the binary via POND_BUILD_COMMIT, and no
    # content hash can represent HEAD. What keeps a cache hit from shipping a
    # stale commit string is that this task only runs on a release, and a
    # release commit always bumps the version in packages/pond/Cargo.toml,
    # which IS an input. Re-running the same release commit is the case the
    # cache is for, and there HEAD is unchanged.
    inputs:
      - '@group(sources)'
      - '.github/scripts/patch-macos-sdk.py'
    outputs:
      - 'dist/pond-aarch64-apple-darwin.tar.xz'
      - 'dist/pond-x86_64-unknown-linux-gnu.tar.xz'
      - 'dist/pond-aarch64-unknown-linux-gnu.tar.xz'
      - 'dist/checksums.txt'
    options:
      cache: true
      outputStyle: stream

  # The shipped msvc zip, built natively on a Windows runner. A moon task rather
  # than inline job steps so it gets the same task-level remote cache every other
  # build leg has - as raw `cargo build` it could never be skipped, and paid a
  # full thin-LTO link on every release even when nothing had changed.
  #
  # Completions come from the just-built binary, the same way the Linux tarballs
  # get theirs. `Out-Null` and `Set-Content` both consume the whole stream, so
  # neither trips the EPIPE that a short-circuiting matcher like
  # `Select-String -Quiet` hands the still-writing binary - which is why the
  # emptiness check reads the file back instead of piping into it.
  #
  # Same POND_BUILD_COMMIT caveat as build-dist: no content hash represents HEAD,
  # and what keeps a hit from shipping a stale commit string is that a release
  # commit always bumps the version in packages/pond/Cargo.toml, which IS an input.
  build-dist-msvc:
    script: |
      $ErrorActionPreference = 'Stop'
      $env:POND_BUILD_COMMIT = (git rev-parse --short HEAD)
      # --features windows-launcher builds pondw.exe (gated in Cargo.toml).
      cargo build --locked --profile dist --target x86_64-pc-windows-msvc --features windows-launcher

      $exe = "target\x86_64-pc-windows-msvc\dist\pond.exe"
      & $exe --version
      & $exe --help | Out-Null

      # rm first: moon can hydrate a previously cached dist/ into the tree.
      Remove-Item -Recurse -Force stage -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force -Path stage\completions | Out-Null
      Copy-Item $exe stage\pond.exe
      # The windowless launcher the scheduled task Execs; `pond schedule start`
      # refuses to register without it.
      Copy-Item target\x86_64-pc-windows-msvc\dist\pondw.exe stage\pondw.exe
      & $exe completions powershell | Set-Content -Encoding utf8 stage\completions\_pond.ps1
      & $exe completions bash       | Set-Content -Encoding utf8 stage\completions\pond.bash
      & $exe completions zsh        | Set-Content -Encoding utf8 stage\completions\_pond
      & $exe completions fish       | Set-Content -Encoding utf8 stage\completions\pond.fish
      if (-not (Select-String -Path stage\completions\_pond.ps1 -Pattern 'pond' -Quiet)) { throw 'empty completions' }

      New-Item -ItemType Directory -Force -Path dist | Out-Null
      Compress-Archive -Path stage\pond.exe,stage\pondw.exe,stage\completions -DestinationPath dist\pond-x86_64-pc-windows-msvc.zip -Force
      Remove-Item -Recurse -Force stage
    inputs:
      - '@group(sources)'
    outputs:
      - 'dist/pond-x86_64-pc-windows-msvc.zip'
    options:
      cache: true
      outputStyle: stream
      windowsShell: 'pwsh'
