language: rust

env:
  CARGO_TERM_COLOR: always

# Repo-level project: tasks that operate on the whole tree from the repo root
# (changelog gate, the multi-target dist build that writes dist/ + target/ at
# root). The crate itself is the `pond` project under packages/pond.
#
# Same completeness rule as the crate's own group: SKILL.md is embedded into the
# binary via include_str!, and this root manifest carries every [profile.*], so
# both must invalidate the dist build - a cached dist/ would otherwise ship the
# previous skill text or the previous dist profile.
fileGroups:
  sources:
    - 'packages/pond/src/**/*'
    - 'packages/pond/build.rs'
    - 'packages/pond/SKILL.md'
    - 'packages/pond/Cargo.toml'
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain.toml'
    # The msvc rustflags (+crt-static) live here, and a moon fingerprint that
    # omits them lets a rustflags change be served from a cache entry built with
    # the old ones. kache's own keys already include the flags, so adding this
    # costs one moon run and no cold cache.
    - '.cargo/config.toml'
  tests:
    - 'packages/pond/tests/**/*'
    - 'packages/pond/benches/**/*'
  # The flake devShell is the Linux and macOS toolchain, and this file holds its
  # derivation path per system (`lib.toolchainId`): it moves when anything the
  # shell is built from moves - zig, cargo-zigbuild, rcodesign, the C compiler,
  # cmake, protoc, the SDK stubs, the zigbuild patch - and not on a `nixpkgs`
  # bump, which only feeds packages.pond. /flake.lock itself is deliberately
  # not an input: it moved on every such bump and invalidated every Rust task,
  # the msvc ones included. The CI devshell step fails a job whose entry for the
  # runner's own system is stale, so no cache entry is written under an outdated
  # id; flake-check covers the other two systems. Not in `sources`:
  # the msvc tasks share that group and never enter the flake - they take
  # windows-bootstrap, where their pins live, instead.
  nixToolchain:
    - 'ops/toolchain-id.json'

tasks:
  check-changelog:
    command: 'bash ops/scripts/check-changelog-headers.sh'
    toolchains: 'system'
    inputs: ['CHANGELOG.md', 'ops/scripts/check-changelog-headers.sh']

  # The release gate, both halves in one target: perf (CLI probes + gate
  # benches + map-vs-scan equivalence against the live remote store, ~30 min of
  # S3 wall-clock) and memory (one mem_bench scenario per process, ~40 min on
  # the large profile). Appends one row per measurement unit to
  # docs/benchmarks/baseline.jsonl and prints the delta vs the previous run for
  # the same (scenario, profile, host). Never cached, always live. Pass flags
  # through: `moon run repo:bench -- --profile large`, `-- --only perf`.
  #
  # `command`, not `script`: moon forwards passthrough args only for the former.
  # No `toolchains: 'system'` either - this project is `language: rust`, so a
  # plain cargo command gets the Rust toolchain moon already provisions.
  #
  # The trailing `--` is load-bearing: moon appends passthrough args to the
  # command, and without the separator `-- --profile large` would reach cargo's
  # own `--profile` instead of the gate's.
  bench:
    command: 'cargo bench --bench gate --'
    options:
      cache: false
      outputStyle: stream
      # The gate writes scratch stores beside the configured store and reads a
      # shared corpus cache; two overlapping runs would measure each other.
      mutex: 'bench-store'

  # CI shape of the gate: the same memory scenarios, but compared against the
  # last committed baseline row per (scenario, profile, host) instead of
  # appended, failing past MEM_GATE_MAX_REGRESSION_PCT (default 20%). The perf
  # numbers are record-only and never gated, so --check skips that half.
  # Cached and input-hashed so an unchanged tree - or a PR that touches none of
  # the inputs, under `moon ci` affected filtering - skips the run.
  # Deliberately NOT wired into any workflow yet (plan hardening phase).
  bench-check:
    extends: 'bench'
    args: '--check'
    inputs:
      - 'packages/pond/src/**/*'
      - 'packages/pond/benches/mem_bench.rs'
      - 'packages/pond/benches/gate.rs'
      - 'packages/pond/build.rs'
      - 'packages/pond/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # A toolchain bump changes codegen and with it what the row measures; omit
      # it and moon replays a cached pass over a different compiler.
      - 'rust-toolchain.toml'
      - '@group(nixToolchain)'
      - 'docs/benchmarks/baseline.jsonl'
    options:
      cache: true

  # Allocation-site attribution for one mem_bench scenario:
  # `moon run repo:profile-mem -- <scenario> [heaptrack|dhat]`.
  profile-mem:
    command: 'bash ops/scripts/profile-mem.sh'
    toolchains: 'system'
    options:
      cache: false
      outputStyle: stream

  # The release tail (checksums, asset upload, flake commit, Homebrew formula),
  # so CI reaches it through the same `moon run` surface as everything else
  # rather than calling the script directly. Never cached: it is a one-shot
  # side-effecting publish, and a "cached, up to date" skip here would mean a
  # tag with no binaries. `toolchains: 'system'` provisions nothing - the
  # publish job is GitHub-hosted with no devshell on purpose, and moon is only
  # the process runner.
  publish-release:
    command: 'bash ops/scripts/publish-release.sh'
    toolchains: 'system'
    # 'run', not the inferred 'test': keeps it out of `moon check`, which sweeps
    # up every build/test task in the project.
    type: 'run'
    options:
      cache: false
      # Must be true, and `type: run` already defaults it to false: with it
      # false, `moon run repo:publish-release` under CI=true resolves ZERO
      # targets ("No tasks found", exit 1) and the publish job goes red having
      # published nothing. Nothing sweeps it up regardless - the one `moon ci`
      # call here passes an explicit target list, and `moon check` skips
      # `type: run`.
      runInCI: true
      outputStyle: stream

  # The Windows leg lives in `build-dist-msvc` below, built natively rather than
  # cross-compiled. It is a separate task for the same reason `test-msvc` is
  # separate from `test`: moon's own fingerprint carries no OS, so a shared task
  # would hit the hash this one already cached and ship nothing. `rust: {}` now
  # adds the host triple on top; the separate task is still what guarantees it.
  #
  # Machine cross-compile on the pond-ci runner (no docker/buildkit): the whole
  # toolchain (rust + its three cross targets, zig 0.16, cargo-zigbuild, the
  # macOS SDK via SDKROOT, rcodesign) comes from the flake devShell the job
  # enters before this runs. Incremental cache = the runner's persistent
  # CARGO_TARGET_DIR. Runs from the repo root: cargo resolves the workspace
  # target dir and dist/ lands at the root where publish-release reads it.
  # Inline on purpose: a file would be hashed by content just the same, and
  # moon substitutes its own `$` tokens ($target, $os, $arch, $time, ...) in a
  # script, matched as a prefix - never start a shell variable's name with one.
  build-dist:
    script: |
      set -euo pipefail

      # Assigned before export: `export X="$(...)"` returns export's status, so a
      # failing git would slip past `set -e` and bake an empty commit into the binary.
      POND_BUILD_COMMIT="$(git rev-parse --short HEAD)"
      export POND_BUILD_COMMIT
      TD="${CARGO_TARGET_DIR:-target}"

      # No `rustup target add` here any more: rust-toolchain.toml lists all three
      # targets and rust-overlay materializes them with the toolchain, so there is
      # nothing left to fetch imperatively - and no rustup to fetch it with.

      # kache (S3 rustc cache): warm builds ride CARGO_TARGET_DIR; this is the
      # cold-start net for a fresh /ci-cache. The remote is no longer written
      # here - it lives in .github/kache/linux-dist.toml, which
      # .github/actions/devshell selects through KACHE_CONFIG, so the wrapper and
      # any daemon kache spawns for itself both resolve it from a file they can
      # re-read. The old stub named no bucket and leaned on the job's KACHE_S3_*
      # env, which kache strips from a daemon spawn. No `kache sync --push`: it
      # covers only workspace crates, which every release's version bump makes
      # unhittable, and the daemon uploads them anyway. On EXIT, not after success,
      # `stats` reports the store and `daemon stop` gives the upload queue up to
      # 30 s to drain before the pod goes away; what is left stays queued on the
      # PVC for the next daemon.
      # --all: one paginated LIST of the per-job prefix instead of one LIST
      # per Cargo.lock crate (~833 serial LISTs, 89 s measured from a laptop,
      # worse from a runner). Safe only because the prefix holds exactly this
      # job's artifacts. --allow-partial: kache exits non-zero on any failed
      # transfer, and under `set -euo pipefail` that would redden a job that
      # would compile through fine - a partial pull is a slower build, never a
      # broken one.
      export RUSTC_WRAPPER=kache
      kache sync --pull --all --allow-partial
      trap 'kache stats || true; kache daemon stop || true' EXIT

      # Cargo unifies features across all targets in one invocation, leaking
      # cfg-gated deps across platforms, so macOS builds alone: it pulls
      # candle's macOS-only `metal`, which the linux pair must not see.
      #
      # Windows is not here at all - the msvc zip is built natively by the
      # windows-dist job in ci.yml and handed to publish-release as its own
      # artifact. Cross-compiling Windows was dropped with the gnu target: it
      # never worked at runtime and no CI job ever executed it.
      cargo zigbuild --locked --profile dist --target aarch64-apple-darwin
      cargo zigbuild --locked --profile dist \
        --target aarch64-unknown-linux-gnu \
        --target x86_64-unknown-linux-gnu

      mkdir -p target/dist
      cp "$TD/aarch64-apple-darwin/dist/pond" target/dist/pond-aarch64-apple-darwin
      # zig records LC_BUILD_VERSION sdk >= 26, which makes macOS 26 dyld
      # reject its duplicate libobjc load command; rewrite the recorded sdk to
      # 15.0 and ad-hoc re-sign (the byte-patch invalidates the signature).
      python3 ops/scripts/patch-macos-sdk.py target/dist/pond-aarch64-apple-darwin
      # Developer ID + hardened runtime when the cert is present (release CI),
      # ad-hoc otherwise so local and fork builds still get a loadable arm64
      # binary. Gatekeeper denies unnotarized Developer ID outright, so the
      # cert path is only ever taken by CI, which pairs it with notarization.
      # The identifier is pinned because a bare Mach-O has no bundle ID to
      # default to: rcodesign would keep the linker's `pond-<cargo hash>`, which
      # changes every release and breaks firewall and privacy rules keyed on it.
      if [ -n "${APPLE_P12_BASE64:-}" ]; then
        creds="$(mktemp -d)"
        printf '%s' "$APPLE_P12_BASE64" | base64 -d > "$creds/id.p12"
        printf '%s' "${APPLE_P12_PASSWORD:-}" > "$creds/id.pass"
        rcodesign --config-file /dev/null sign \
          --p12-file "$creds/id.p12" --p12-password-file "$creds/id.pass" \
          --code-signature-flags runtime \
          --binary-identifier io.github.tenequm.pond \
          target/dist/pond-aarch64-apple-darwin
        rm -rf "$creds"
      else
        rcodesign --config-file /dev/null sign \
          --binary-identifier io.github.tenequm.pond \
          target/dist/pond-aarch64-apple-darwin
      fi
      cp "$TD/aarch64-unknown-linux-gnu/dist/pond" target/dist/pond-aarch64-unknown-linux-gnu
      cp "$TD/x86_64-unknown-linux-gnu/dist/pond" target/dist/pond-x86_64-unknown-linux-gnu
      ls -lh target/dist/

      # Completion scripts are target-independent, so one native run of the
      # linux-amd64 binary (this runner's arch) generates them for every
      # tarball. They must ship pre-generated: nix can't execute the binary
      # in installPhase (autoPatchelfHook only fixes the interpreter later,
      # in fixupPhase).
      rm -rf completions
      mkdir -p completions
      chmod +x target/dist/pond-x86_64-unknown-linux-gnu
      target/dist/pond-x86_64-unknown-linux-gnu completions bash > completions/pond.bash
      target/dist/pond-x86_64-unknown-linux-gnu completions zsh  > completions/_pond
      target/dist/pond-x86_64-unknown-linux-gnu completions fish > completions/pond.fish

      # Package into the archive names brew/nix reference, `pond` at the root.
      # rm first: moon can hydrate a previously cached dist/ into the tree.
      rm -rf dist
      mkdir -p dist
      for t in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
        install -m755 "target/dist/pond-$t" pond
        tar -cJf "dist/pond-$t.tar.xz" pond completions
      done
      rm -f pond
      rm -rf completions
      # Covers only what this task produced. publish-release regenerates it
      # over the merged dist/ once the natively-built Windows zip lands, so
      # this copy never reaches a release.
      ( cd dist && sha256sum pond-* > checksums.txt )
      ls -lh dist/
    # No @group(tests): tests and benches are not linked into the shipped
    # binary, so a test-only change cannot alter dist/ and should not pay a
    # three-target cross-compile.
    #
    # Caveat worth knowing before narrowing these further: the script bakes
    # `git rev-parse HEAD` into the binary via POND_BUILD_COMMIT, and no
    # content hash can represent HEAD. What keeps a cache hit from shipping a
    # stale commit string is that this task only runs on a release, and a
    # release commit always bumps the version in packages/pond/Cargo.toml,
    # which IS an input. Re-running the same release commit is the case the
    # cache is for, and there HEAD is unchanged.
    inputs:
      - '@group(sources)'
      # Covers the macOS SDK stubs and the cargo-zigbuild patch too: both are
      # part of the devShell derivation, so flake.nix itself is not needed.
      - '@group(nixToolchain)'
      - 'ops/scripts/patch-macos-sdk.py'
    outputs:
      - 'dist/pond-aarch64-apple-darwin.tar.xz'
      - 'dist/pond-x86_64-unknown-linux-gnu.tar.xz'
      - 'dist/pond-aarch64-unknown-linux-gnu.tar.xz'
      - 'dist/checksums.txt'
    options:
      cache: true
      outputStyle: stream
      # moon falls back to sh when bash is not on PATH; this script needs bash.
      unixShell: 'bash'

  # The shipped msvc zip, built natively on a Windows runner. A moon task rather
  # than inline job steps so it gets the same task-level remote cache every other
  # build leg has - as raw `cargo build` it could never be skipped, and paid a
  # full thin-LTO link on every release even when nothing had changed.
  #
  # Same POND_BUILD_COMMIT caveat as build-dist: no content hash represents HEAD,
  # and what keeps a hit from shipping a stale commit string is that a release
  # commit always bumps the version in packages/pond/Cargo.toml, which IS an input.
  #
  # Inline like build-dist, same `$` token rule. moon runs a pwsh script as
  # `pwsh -NoLogo -NoProfile -EncodedCommand`, so no runner-image profile applies.
  build-dist-msvc:
    script: |
      # Completions come from the just-built binary, the same way the Linux tarballs
      # get theirs. `Out-Null` and `Set-Content` both consume the whole stream, so
      # neither trips the EPIPE that a short-circuiting matcher like
      # `Select-String -Quiet` hands the still-writing binary - which is why the
      # emptiness check reads the file back instead of piping into it.
      $ErrorActionPreference = 'Stop'
      # 'Stop' alone governs cmdlets only - a native command that exits non-zero is
      # not an error to PowerShell, and this variable is what makes it one (pwsh 7.3+,
      # default $false). Without it a failed `cargo build` falls through to the
      # packaging below, which is the one way this task could ship a zip built from
      # something other than this commit. Today every later step would still throw on
      # the missing exe, but that is a property of a runner whose target/ starts
      # empty, not of this script.
      $PSNativeCommandUseErrorActionPreference = $true
      $env:POND_BUILD_COMMIT = (git rev-parse --short HEAD)
      # --features windows-launcher builds pondw.exe (gated in Cargo.toml).
      cargo build --locked --profile dist --target x86_64-pc-windows-msvc --features windows-launcher

      $exe = "target\x86_64-pc-windows-msvc\dist\pond.exe"
      & $exe --version
      & $exe --help | Out-Null

      # rm first: moon can hydrate a previously cached dist/ into the tree.
      Remove-Item -Recurse -Force stage -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force -Path stage\completions | Out-Null
      Copy-Item $exe stage\pond.exe
      # The windowless launcher the scheduled task Execs; `pond schedule start`
      # refuses to register without it.
      Copy-Item target\x86_64-pc-windows-msvc\dist\pondw.exe stage\pondw.exe
      & $exe completions powershell | Set-Content -Encoding utf8 stage\completions\_pond.ps1
      & $exe completions bash       | Set-Content -Encoding utf8 stage\completions\pond.bash
      & $exe completions zsh        | Set-Content -Encoding utf8 stage\completions\_pond
      & $exe completions fish       | Set-Content -Encoding utf8 stage\completions\pond.fish
      if (-not (Select-String -Path stage\completions\_pond.ps1 -Pattern 'pond' -Quiet)) { throw 'empty completions' }

      New-Item -ItemType Directory -Force -Path dist | Out-Null
      Compress-Archive -Path stage\pond.exe,stage\pondw.exe,stage\completions -DestinationPath dist\pond-x86_64-pc-windows-msvc.zip -Force
      Remove-Item -Recurse -Force stage
    inputs:
      - '@group(sources)'
      # This leg's toolchain pins (moon, protoc, kache) live in the action, not
      # the flake.
      - '.github/actions/windows-bootstrap/action.yml'
    outputs:
      - 'dist/pond-x86_64-pc-windows-msvc.zip'
    options:
      cache: true
      outputStyle: stream
      # Pinned so a host without pwsh fails instead of falling back to Windows
      # PowerShell 5.1, which ignores $PSNativeCommandUseErrorActionPreference.
      windowsShell: 'pwsh'
