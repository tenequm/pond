language: rust

env:
  CARGO_TERM_COLOR: always

fileGroups:
  sources:
    - 'src/**/*'
    - 'Cargo.{toml,lock}'
    - 'rust-toolchain.toml'
  tests:
    - 'tests/**/*'
    - 'benches/**/*'

tasks:
  format:
    command: 'cargo fmt --check'
    inputs: ['@group(sources)', '@group(tests)']
  lint:
    command: 'cargo clippy --locked -- -D warnings'
    inputs: ['@group(sources)', '@group(tests)']
  test:
    command: 'cargo test --locked'
    inputs: ['@group(sources)', '@group(tests)']
  check-changelog:
    command: 'bash ops/scripts/check-changelog-headers.sh'
    toolchains: 'system'
    inputs: ['CHANGELOG.md', 'ops/scripts/check-changelog-headers.sh']

  # Machine cross-compile on the pond-ci runner (no docker/buildkit): needs the
  # pond-runner image toolchain (zig 0.16 + cargo-zigbuild + macOS SDK via
  # SDKROOT + rcodesign) and rustup on PATH. Incremental cache = the runner's
  # persistent CARGO_TARGET_DIR.
  build-dist:
    script: |
      set -euo pipefail
      export POND_BUILD_COMMIT="$(git rev-parse --short HEAD)"
      TD="${CARGO_TARGET_DIR:-target}"

      # `profile = "minimal"` + targets-in-toml does not reliably fetch
      # rust-std for non-host targets.
      rustup target add aarch64-apple-darwin x86_64-pc-windows-gnu \
                        aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu

      # kache (S3 rustc cache): warm builds ride CARGO_TARGET_DIR; this is the
      # cold-start net for a fresh /ci-cache. No KACHE_REMOTE_TYPE env exists -
      # the two-line config file is required to activate s3. Push on EXIT, not
      # after success: crates compiled before a failure still warm the retry.
      export RUSTC_WRAPPER=kache
      mkdir -p ~/.config/kache
      printf '[cache.remote]\ntype = "s3"\n' > ~/.config/kache/config.toml
      kache sync --pull
      trap 'kache sync --push || true' EXIT

      # Cargo unifies features across all targets in one invocation, leaking
      # cfg-gated deps across platforms. macOS and Windows each build alone:
      # macOS pulls candle's macOS-only `metal`, and the two linux targets
      # enable xet-data's `cfg(not(windows))` sha2 `asm` feature, which drags
      # sha2-asm (a Windows compile_error!) into the Windows build.
      cargo zigbuild --locked --profile dist --target aarch64-apple-darwin
      cargo zigbuild --locked --profile dist \
        --target aarch64-unknown-linux-gnu \
        --target x86_64-unknown-linux-gnu
      cargo zigbuild --locked --profile dist --target x86_64-pc-windows-gnu

      mkdir -p target/dist
      cp "$TD/aarch64-apple-darwin/dist/pond" target/dist/pond-aarch64-apple-darwin
      # zig records LC_BUILD_VERSION sdk >= 26, which makes macOS 26 dyld
      # reject its duplicate libobjc load command; rewrite the recorded sdk to
      # 15.0 and ad-hoc re-sign (the byte-patch invalidates the signature).
      python3 ops/scripts/patch-macos-sdk.py target/dist/pond-aarch64-apple-darwin
      rcodesign --config-file /dev/null sign target/dist/pond-aarch64-apple-darwin
      cp "$TD/aarch64-unknown-linux-gnu/dist/pond" target/dist/pond-aarch64-unknown-linux-gnu
      cp "$TD/x86_64-unknown-linux-gnu/dist/pond" target/dist/pond-x86_64-unknown-linux-gnu
      cp "$TD/x86_64-pc-windows-gnu/dist/pond.exe" target/dist/pond-x86_64-pc-windows-gnu.exe
      ls -lh target/dist/

      # Completion scripts are target-independent, so one native run of the
      # linux-amd64 binary (this runner's arch) generates them for every
      # tarball. They must ship pre-generated: nix can't execute the binary
      # in installPhase (autoPatchelfHook only fixes the interpreter later,
      # in fixupPhase).
      rm -rf completions
      mkdir -p completions
      chmod +x target/dist/pond-x86_64-unknown-linux-gnu
      target/dist/pond-x86_64-unknown-linux-gnu completions bash > completions/pond.bash
      target/dist/pond-x86_64-unknown-linux-gnu completions zsh  > completions/_pond
      target/dist/pond-x86_64-unknown-linux-gnu completions fish > completions/pond.fish

      # Package into the archive names brew/nix reference, `pond` at the root.
      # rm first: the self-hosted runner persists dist/ across runs, so stale
      # files (e.g. goreleaser-era leftovers) must not accumulate.
      rm -rf dist
      mkdir -p dist
      for t in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
        install -m755 "target/dist/pond-$t" pond
        tar -cJf "dist/pond-$t.tar.xz" pond completions
      done
      install -m755 target/dist/pond-x86_64-pc-windows-gnu.exe pond.exe
      zip -j "dist/pond-x86_64-pc-windows-gnu.zip" pond.exe
      rm -f pond pond.exe
      rm -rf completions
      ( cd dist && sha256sum pond-* > checksums.txt )
      ls -lh dist/
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - 'ops/scripts/patch-macos-sdk.py'
    outputs:
      - 'dist/pond-aarch64-apple-darwin.tar.xz'
      - 'dist/pond-x86_64-unknown-linux-gnu.tar.xz'
      - 'dist/pond-aarch64-unknown-linux-gnu.tar.xz'
      - 'dist/pond-x86_64-pc-windows-gnu.zip'
      - 'dist/checksums.txt'
    options:
      cache: true
      outputStyle: stream
