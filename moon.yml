language: rust

env:
  CARGO_TERM_COLOR: always
  BUILDX_BUILDER: pond-hetzner

fileGroups:
  sources:
    - 'src/**/*'
    - 'Cargo.{toml,lock}'
    - 'rust-toolchain.toml'
  tests:
    - 'tests/**/*'
    - 'benches/**/*'

tasks:
  format:
    command: 'cargo fmt --check'
    inputs: ['@group(sources)', '@group(tests)']
  lint:
    command: 'cargo clippy --locked -- -D warnings'
    inputs: ['@group(sources)', '@group(tests)']
  test:
    command: 'cargo test --locked'
    inputs: ['@group(sources)', '@group(tests)']

  # One-time builder setup (pool is amd64 ccx43, isolated by nodeselector):
  #   docker buildx create --name pond-hetzner --driver kubernetes \
  #     --driver-opt namespace=pond-buildkit,replicas=1,nodeselector=workload=buildkit \
  #     --driver-opt requests.cpu=12,requests.memory=24Gi,limits.memory=48Gi \
  #     --driver-opt persistent-volume-claim.requests.storage=100Gi \
  #     --platform linux/amd64 --bootstrap
  build-dist:
    script: |
      set -euo pipefail
      mkdir -p target/dist

      BUCKET=ttq
      # KACHE_S3_ENDPOINT is bucket-virtual-host (ttq.nbg1...); strip the bucket subdomain.
      S3_ENDPOINT="${KACHE_S3_ENDPOINT/${BUCKET}./}"
      BUILDX_PREFIX=pond-buildkit/multiarch

      docker buildx build \
        --progress=plain \
        --platform linux/amd64 \
        --target output \
        --cache-from "type=s3,region=${KACHE_S3_REGION},bucket=${BUCKET},endpoint_url=${S3_ENDPOINT},name=pond-multiarch,blobs_prefix=${BUILDX_PREFIX}/blobs/,manifests_prefix=${BUILDX_PREFIX}/manifests/,access_key_id=${KACHE_S3_ACCESS_KEY},secret_access_key=${KACHE_S3_SECRET_KEY}" \
        --cache-to   "type=s3,region=${KACHE_S3_REGION},bucket=${BUCKET},endpoint_url=${S3_ENDPOINT},name=pond-multiarch,blobs_prefix=${BUILDX_PREFIX}/blobs/,manifests_prefix=${BUILDX_PREFIX}/manifests/,access_key_id=${KACHE_S3_ACCESS_KEY},secret_access_key=${KACHE_S3_SECRET_KEY},mode=max,ignore-error=true" \
        --secret "id=kache_s3_access_key,env=KACHE_S3_ACCESS_KEY" \
        --secret "id=kache_s3_secret_key,env=KACHE_S3_SECRET_KEY" \
        --output "type=local,dest=target/dist" \
        -f Dockerfile \
        .
      ls -lh target/dist/

      # Package into the archive names brew/nix reference, `pond` at the root.
      mkdir -p dist
      for t in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
        install -m755 "target/dist/pond-$t" pond
        tar -cJf "dist/pond-$t.tar.xz" pond
      done
      install -m755 target/dist/pond-x86_64-pc-windows-gnu.exe pond.exe
      zip -j "dist/pond-x86_64-pc-windows-gnu.zip" pond.exe
      rm -f pond pond.exe
      ( cd dist && sha256sum pond-* > checksums.txt )
      ls -lh dist/
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - 'Dockerfile'
      - '.dockerignore'
    outputs:
      - 'dist/pond-aarch64-apple-darwin.tar.xz'
      - 'dist/pond-x86_64-unknown-linux-gnu.tar.xz'
      - 'dist/pond-aarch64-unknown-linux-gnu.tar.xz'
      - 'dist/pond-x86_64-pc-windows-gnu.zip'
      - 'dist/checksums.txt'
    options:
      cache: true
      outputStyle: stream

  # Render Formula/pond.rb from dist/*.tar.xz and push to the tap.
  # Env: V (version), GH_RELEASE_TOKEN. Run locally after build-dist to recover.
  publish-brew:
    script: |
      set -euo pipefail
      base="https://github.com/tenequm/homebrew-tap/releases/download/pond-v$V"
      sha() { sha256sum "dist/pond-$1.tar.xz" | cut -d' ' -f1; }
      rm -rf tap
      git clone --depth 1 "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/homebrew-tap" tap
      cat > tap/Formula/pond.rb <<EOF
      # typed: false
      # frozen_string_literal: true
      class Pond < Formula
        desc "Lossless storage and hybrid search for AI agent sessions, across every agentic client."
        homepage "https://github.com/tenequm/homebrew-tap"
        version "$V"
        license "Apache-2.0"
        on_macos do
          if Hardware::CPU.arm?
            url "$base/pond-aarch64-apple-darwin.tar.xz"
            sha256 "$(sha aarch64-apple-darwin)"
            def install; bin.install "pond"; end
          end
        end
        on_linux do
          if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
            url "$base/pond-x86_64-unknown-linux-gnu.tar.xz"
            sha256 "$(sha x86_64-unknown-linux-gnu)"
            def install; bin.install "pond"; end
          end
          if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
            url "$base/pond-aarch64-unknown-linux-gnu.tar.xz"
            sha256 "$(sha aarch64-unknown-linux-gnu)"
            def install; bin.install "pond"; end
          end
        end
      end
      EOF
      git -C tap add Formula/pond.rb
      git -C tap diff --quiet --staged || git -C tap -c user.name=ci -c user.email=ci@pond commit -m "pond $V"
      git -C tap push
    options:
      cache: false

  # Render pkgs/pond/default.nix from dist/*.tar.xz and push to nur-packages.
  # Env: V, GH_RELEASE_TOKEN, plus nix on PATH (nix-hash). Run locally after build-dist.
  publish-nur:
    script: |
      set -euo pipefail
      base="https://github.com/tenequm/homebrew-tap/releases/download/pond-v$V"
      nix32() { nix-hash --type sha256 --to-base32 "$(sha256sum "dist/pond-$1.tar.xz" | cut -d' ' -f1)"; }
      rm -rf nur
      git clone --depth 1 "https://x-access-token:$GH_RELEASE_TOKEN@github.com/tenequm/nur-packages" nur
      mkdir -p nur/pkgs/pond
      cat > nur/pkgs/pond/default.nix <<EOF
      { lib, fetchurl, stdenvNoCC }:
      let
        inherit (stdenvNoCC.hostPlatform) system;
        shaMap = {
          x86_64-linux = "$(nix32 x86_64-unknown-linux-gnu)";
          aarch64-linux = "$(nix32 aarch64-unknown-linux-gnu)";
          aarch64-darwin = "$(nix32 aarch64-apple-darwin)";
        };
        urlMap = {
          x86_64-linux = "$base/pond-x86_64-unknown-linux-gnu.tar.xz";
          aarch64-linux = "$base/pond-aarch64-unknown-linux-gnu.tar.xz";
          aarch64-darwin = "$base/pond-aarch64-apple-darwin.tar.xz";
        };
      in
      stdenvNoCC.mkDerivation {
        pname = "pond";
        version = "$V";
        src = fetchurl { url = urlMap.\${system}; sha256 = shaMap.\${system}; };
        sourceRoot = ".";
        installPhase = ''mkdir -p \$out/bin && cp ./pond \$out/bin/pond'';
        meta = {
          description = "Lossless storage and hybrid search for AI agent sessions, across every agentic client.";
          homepage = "https://github.com/tenequm/homebrew-tap";
          license = lib.licenses.asl20;
          mainProgram = "pond";
          platforms = [ "aarch64-darwin" "aarch64-linux" "x86_64-linux" ];
        };
      }
      EOF
      git -C nur add pkgs/pond/default.nix
      git -C nur diff --quiet --staged || git -C nur -c user.name=ci -c user.email=ci@pond commit -m "pond $V"
      git -C nur push
    options:
      cache: false
