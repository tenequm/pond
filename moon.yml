language: rust

env:
  CARGO_TERM_COLOR: always

# Repo-level project: tasks that operate on the whole tree from the repo root
# (changelog gate, the multi-target dist build that writes dist/ + target/ at
# root). The crate itself is the `pond` project under packages/pond.
#
# Same completeness rule as the crate's own group: SKILL.md is embedded into the
# binary via include_str!, and this root manifest carries every [profile.*], so
# both must invalidate the dist build - a cached dist/ would otherwise ship the
# previous skill text or the previous dist profile.
fileGroups:
  sources:
    - 'packages/pond/src/**/*'
    - 'packages/pond/build.rs'
    - 'packages/pond/SKILL.md'
    - 'packages/pond/Cargo.toml'
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain.toml'
    # The msvc rustflags (+crt-static) live here, and a moon fingerprint that
    # omits them lets a rustflags change be served from a cache entry built with
    # the old ones. kache's own keys already include the flags, so adding this
    # costs one moon run and no cold cache.
    - '.cargo/config.toml'
  tests:
    - 'packages/pond/tests/**/*'
    - 'packages/pond/benches/**/*'
  # The flake devShell is the Linux and macOS toolchain, and this file holds its
  # derivation path per system (`lib.toolchainId`): it moves when anything the
  # shell is built from moves - zig, cargo-zigbuild, rcodesign, the C compiler,
  # cmake, protoc, the SDK stubs, the zigbuild patch - and not on a `nixpkgs`
  # bump, which only feeds packages.pond. /flake.lock itself is deliberately
  # not an input: it moved on every such bump and invalidated every Rust task,
  # the msvc ones included. The CI devshell step fails a job whose entry for the
  # runner's own system is stale, so no cache entry is written under an outdated
  # id; flake-check covers the other two systems. Not in `sources`:
  # the msvc tasks share that group and never enter the flake - they take
  # windows-bootstrap, where their pins live, instead.
  nixToolchain:
    - 'ops/toolchain-id.json'

tasks:
  check-changelog:
    command: 'bash ops/scripts/check-changelog-headers.sh'
    toolchains: 'system'
    inputs: ['CHANGELOG.md', 'ops/scripts/check-changelog-headers.sh']

  # Pre-release validation against the live remote store: gate benches + CLI
  # probes + map-vs-scan equivalence, appending to
  # docs/benchmarks/bench-gate-baseline.jsonl and printing the delta vs the
  # previous run. ~30 min of S3 wall-clock; never cached, always live.
  bench-gate:
    command: 'bash ops/scripts/bench-gate.sh'
    toolchains: 'system'
    options:
      cache: false
      outputStyle: stream

  # Memory gate (#245, track A): one mem_bench scenario per process, appending
  # to docs/benchmarks/mem-gate-baseline.jsonl and printing the delta vs the
  # previous run. Local-only in v1 - no thresholds, not in CI. Pass flags
  # through: `moon run repo:mem-gate -- --profile large`.
  mem-gate:
    command: 'bash ops/scripts/mem-gate.sh'
    toolchains: 'system'
    options:
      cache: false
      outputStyle: stream

  # CI shape of the memory gate: same scenarios, but compares against the last
  # committed baseline row per (scenario, profile) instead of appending, and
  # fails past MEM_GATE_MAX_REGRESSION_PCT (default 20%). Cached and
  # input-hashed so an unchanged tree - or a PR that touches none of the
  # inputs, under `moon ci` affected filtering - skips the ~40 min run.
  # Deliberately NOT wired into any workflow yet (plan hardening phase).
  mem-gate-ci:
    extends: 'mem-gate'
    args: '--check'
    inputs:
      - 'packages/pond/src/**/*'
      - 'packages/pond/benches/mem_bench.rs'
      - 'packages/pond/build.rs'
      - 'packages/pond/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # A toolchain bump changes codegen and with it what the row measures; omit
      # it and moon replays a cached pass over a different compiler.
      - 'rust-toolchain.toml'
      - '@group(nixToolchain)'
      - 'ops/scripts/mem-gate.sh'
      - 'docs/benchmarks/mem-gate-baseline.jsonl'
    options:
      cache: true

  # Allocation-site attribution for one mem_bench scenario:
  # `moon run repo:profile-mem -- <scenario> [heaptrack|dhat]`.
  profile-mem:
    command: 'bash ops/scripts/profile-mem.sh'
    toolchains: 'system'
    options:
      cache: false
      outputStyle: stream

  # The Windows leg lives in `build-dist-msvc` below, built natively rather than
  # cross-compiled. It is a separate task for the same reason `test-msvc` is
  # separate from `test`: moon's own fingerprint carries no OS, so a shared task
  # would hit the hash this one already cached and ship nothing. `rust: {}` now
  # adds the host triple on top; the separate task is still what guarantees it.
  #
  # Machine cross-compile on the pond-ci runner (no docker/buildkit): the whole
  # toolchain (rust + its three cross targets, zig 0.16, cargo-zigbuild, the
  # macOS SDK via SDKROOT, rcodesign) comes from the flake devShell the job
  # enters before this runs. Incremental cache = the runner's persistent
  # CARGO_TARGET_DIR. Runs from the repo root: cargo resolves the workspace
  # target dir and dist/ lands at the root where publish-release reads it.
  # The body lives in ops/scripts/build-dist.sh, not inline here: moon
  # fingerprints an inline `script:` verbatim, so every comment edit in it
  # invalidated a three-target cross-compile. As a declared input below, only a
  # real change to the script does.
  build-dist:
    command: 'bash ops/scripts/build-dist.sh'
    # No @group(tests): tests and benches are not linked into the shipped
    # binary, so a test-only change cannot alter dist/ and should not pay a
    # three-target cross-compile.
    #
    # Caveat worth knowing before narrowing these further: the script bakes
    # `git rev-parse HEAD` into the binary via POND_BUILD_COMMIT, and no
    # content hash can represent HEAD. What keeps a cache hit from shipping a
    # stale commit string is that this task only runs on a release, and a
    # release commit always bumps the version in packages/pond/Cargo.toml,
    # which IS an input. Re-running the same release commit is the case the
    # cache is for, and there HEAD is unchanged.
    inputs:
      - '@group(sources)'
      # Covers the macOS SDK stubs and the cargo-zigbuild patch too: both are
      # part of the devShell derivation, so flake.nix itself is not needed.
      - '@group(nixToolchain)'
      - 'ops/scripts/build-dist.sh'
      - 'ops/scripts/patch-macos-sdk.py'
    outputs:
      - 'dist/pond-aarch64-apple-darwin.tar.xz'
      - 'dist/pond-x86_64-unknown-linux-gnu.tar.xz'
      - 'dist/pond-aarch64-unknown-linux-gnu.tar.xz'
      - 'dist/checksums.txt'
    options:
      cache: true
      outputStyle: stream

  # The shipped msvc zip, built natively on a Windows runner. A moon task rather
  # than inline job steps so it gets the same task-level remote cache every other
  # build leg has - as raw `cargo build` it could never be skipped, and paid a
  # full thin-LTO link on every release even when nothing had changed.
  #
  # Same POND_BUILD_COMMIT caveat as build-dist: no content hash represents HEAD,
  # and what keeps a hit from shipping a stale commit string is that a release
  # commit always bumps the version in packages/pond/Cargo.toml, which IS an input.
  #
  # The body lives in ops/scripts/build-dist-msvc.ps1 for the same hash-churn
  # reason as build-dist, and is a declared input below. `-NoProfile` so a
  # runner-image profile cannot change what a release builds; `-File` rather
  # than `-Command` so the script's own $ErrorActionPreference governs.
  build-dist-msvc:
    command: 'pwsh -NoProfile -File ops/scripts/build-dist-msvc.ps1'
    inputs:
      - '@group(sources)'
      # This leg's toolchain pins (moon, protoc, kache) live in the action, not
      # the flake.
      - '.github/actions/windows-bootstrap/action.yml'
      - 'ops/scripts/build-dist-msvc.ps1'
    outputs:
      - 'dist/pond-x86_64-pc-windows-msvc.zip'
    options:
      cache: true
      outputStyle: stream
