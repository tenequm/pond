[workspace]
resolver = "3"
members = ["packages/pond"]

# Profiles are honored only at the workspace root, so they live here (not in the
# member manifest, where cargo ignores them). The crate is packages/pond.

# Keeps file/line info for panic backtraces; drops the per-variable debuginfo
# only a step-debugger uses. Faster codegen on every rebuild.
[profile.dev]
opt-level = 0
incremental = true
split-debuginfo = "unpacked"   # faster linking on Mac
debug = 1                       # faster than debug = 2

# Optimize dependency crates even in dev/test - the hot code (lance, arrow,
# candle) lives there; pond's own crate stays unoptimized for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

# Iteration profile: no LTO so local-crate rebuilds relink in seconds.
# Ship-grade optimization is `dist`.
[profile.release]

# Ship profile: thin-LTO + single codegen unit. Used only for release artifacts.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
