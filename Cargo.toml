[package]
name = "pond"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.102"
async-stream = "0.3.6"
axum = "0.8.9"
candle-core = "0.10.2"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
lance = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.8" }
lance-encoding = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.8" }
lance-file = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.8" }
lance-index = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.8" }
lance-io = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.8" }
lance-linalg = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.8" }
lance-namespace = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.8" }
lance-namespace-impls = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.8" }
lance-table = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.8" }
rmcp = { version = "1.7", features = ["transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["full"] }
tokio-stream = "0.1.18"
toml = "1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.23", features = ["v7"] }

# `ort` is a non-optional dependency of fastembed 5.13.4; `ort-load-dynamic`
# keeps it from static-linking ONNX Runtime (or downloading the binary). pond's
# Qwen3 path is pure candle and never dlopens onnxruntime, so this is free.
[target.'cfg(target_os = "macos")'.dependencies]
fastembed = { version = "5.13.4", default-features = false, features = ["qwen3", "hf-hub-rustls-tls", "ort-load-dynamic", "metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
fastembed = { version = "5.13.4", default-features = false, features = ["qwen3", "hf-hub-rustls-tls", "ort-load-dynamic"] }

[dev-dependencies]
# Also a regular dependency; declared here so integration tests can name
# `MetricType` when asserting the distance-metric mapping.
lance-linalg = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.8" }
# `rmcp` is a regular dependency too; the `client` feature is dev-only so the
# MCP integration test can drive the server with an in-process client. Cargo
# unifies it into the test build without adding `client` to the shipped binary.
rmcp = { version = "1.7", features = ["client"] }
tempfile = "3.25"
# `oneshot` lets the HTTP integration test drive the axum `Router` directly,
# with no socket bind and no HTTP client dependency.
tower = { version = "0.5", features = ["util"] }

[features]
# Opt-in NVIDIA GPU embeddings for non-macOS builds: forwards to fastembed's
# `cuda` feature (-> `candle-core/cuda`). Off by default because `candle-core/cuda`
# needs the CUDA toolkit (`nvcc`) at build time - the default non-macOS build is
# plain CPU candle and CI never enables this. Build on a CUDA host with
# `cargo build --features cuda`; candle's `cuda_if_available` then selects the GPU
# automatically (it returns CPU when this feature is not compiled in).
cuda = ["fastembed/cuda"]

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
implicit_clone = "warn"
print_stdout = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
uninlined_format_args = "warn"
unwrap_used = "warn"
