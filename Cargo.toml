[package]
name = "pond"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anstyle = "1"
anyhow = "1.0.102"
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
comfy-table = "7"
dialoguer = { version = "0.12", default-features = false }
# Embedding stack for `intfloat/multilingual-e5-small`. Backend chosen at
# runtime in `src/embed.rs`: Metal on macOS (via the `[target.*]` block
# below), CUDA via `--features cuda`, CPU otherwise.
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
fastrand = "2"
hf-hub = "0.4"
indicatif = "0.18"
lance = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16", features = ["protoc"] }
lance-arrow = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
half = { version = "2.1", default-features = false }
lance-datafusion = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16", features = ["protoc"] }
lance-file = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
lance-index = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
lance-io = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
lance-linalg = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
lance-namespace = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
lance-namespace-impls = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
rmcp = { version = "1.7", features = ["transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.25"
# Streaming JSON pull-parser for the adapter seam's oversized-line slow path:
# records over `RECORD_CAP` are cap-parsed leaf-by-leaf so peak memory stays
# bounded (see src/adapter/jsonl.rs).
struson = "0.7"
thiserror = "2.0.18"
tokenizers = "0.21"
tokio = { version = "1.52", features = ["full"] }
tokio-stream = "0.1.18"
toml = "1.1"
toml_edit = "0.23"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.23", features = ["v7"] }
walkdir = "2.5"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.10", features = ["metal"] }
candle-nn = { version = "0.10", features = ["metal"] }
candle-transformers = { version = "0.10", features = ["metal"] }

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dev-dependencies]
# Re-declared (also in `[dependencies]`) so integration tests can name `MetricType`.
lance-linalg = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
# Re-declared so the MCP integration test can drive the server in-process via the `client` feature.
rmcp = { version = "1.7", features = ["client"] }
insta = "1.47.2"
tempfile = "3.25"
# Lets the HTTP integration test drive axum's `Router` without binding a socket.
tower = { version = "0.5", features = ["util"] }
s3s = "0.13"
s3s-fs = "0.13"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }

# Plain `fn main` binaries (not libtest). Run with `cargo bench --bench <name> -- --help`.
[[bench]]
name = "embed_bench"
harness = false

[[bench]]
name = "ingest_bench"
harness = false

[[bench]]
name = "backend_bench"
harness = false

[[bench]]
name = "serve_mem_bench"
harness = false

# Keeps file/line info for panic backtraces; drops the per-variable debuginfo
# only a step-debugger uses. Faster codegen on every rebuild.
[profile.dev]
debug = "line-tables-only"

# Optimize dependency crates even in dev/test - the hot code (lance, arrow,
# candle) lives there; pond's own crate stays unoptimized for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

# Iteration profile: no LTO so local-crate rebuilds relink in seconds.
# Ship-grade optimization is `dist`.
[profile.release]

# Ship profile: thin-LTO + single codegen unit. Used only for release artifacts.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
implicit_clone = "warn"
print_stdout = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
uninlined_format_args = "warn"
unwrap_used = "warn"
