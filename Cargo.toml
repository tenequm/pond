[package]
name = "pond"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anstyle = "1"
anyhow = "1.0.102"
async-stream = "0.3.6"
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
comfy-table = "7"
dialoguer = { version = "0.12", default-features = false }
# Embedding stack for `intfloat/multilingual-e5-base` (XLM-RoBERTa) - see
# `src/embed/e5.rs`. These declare the CPU baseline; the GPU backend is added
# per target - Metal automatically on macOS via the `[target.*]` block below,
# CUDA via the opt-in `cuda` feature. `hf-hub` fetches the weights,
# `tokenizers` does the SentencePiece tokenization.
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
fastrand = "2"
hf-hub = "0.4"
humantime = "2"
indicatif = "0.18"
lance = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16", features = ["protoc"] }
# Vendored protoc (protobuf-src) so builds need no system protoc. `lance`'s `protoc`
# feature omits lance-datafusion, so it is declared here only to carry the feature.
lance-datafusion = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16", features = ["protoc"] }
lance-file = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
lance-index = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
lance-io = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
lance-linalg = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
lance-namespace = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
lance-namespace-impls = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
rmcp = { version = "1.7", features = ["transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# Streaming JSON pull-parser for the adapter seam's oversized-line slow path:
# a record over `RECORD_CAP` is cap-parsed leaf-by-leaf so peak memory stays
# bounded instead of materializing a multi-GiB value (see src/adapter/jsonl.rs).
struson = "0.7"
thiserror = "2.0.18"
tokenizers = "0.21"
tokio = { version = "1.52", features = ["full"] }
tokio-stream = "0.1.18"
toml = "1.1"
toml_edit = "0.23"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.23", features = ["v7"] }

# macOS always ships Metal as a system framework, so the embedding model gets
# its GPU backend automatically here - a plain `cargo build` works on macOS
# (Metal) and Linux (candle CPU) alike, with no feature flags. Linux + NVIDIA
# opts into the GPU with `--features cuda` (see `[features]`).
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.10", features = ["metal"] }
candle-nn = { version = "0.10", features = ["metal"] }
candle-transformers = { version = "0.10", features = ["metal"] }

[features]
# Opt-in NVIDIA GPU path: `cargo build --features cuda` on a Linux host with
# the CUDA toolkit installed. macOS needs no feature - Metal is wired in via
# the `[target.'cfg(target_os = "macos")']` block above. `select_device` in
# `src/embed/e5.rs` picks the live backend at runtime.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dev-dependencies]
# Also a regular dependency; declared here so integration tests can name
# `MetricType` when asserting the distance-metric mapping.
lance-linalg = { git = "https://github.com/lance-format/lance", tag = "v7.0.0-beta.16" }
# `rmcp` is a regular dependency too; the `client` feature is dev-only so the
# MCP integration test can drive the server with an in-process client. Cargo
# unifies it into the test build without adding `client` to the shipped binary.
rmcp = { version = "1.7", features = ["client"] }
insta = "1.47.2"
tempfile = "3.25"
# `oneshot` lets the HTTP integration test drive the axum `Router` directly,
# with no socket bind and no HTTP client dependency.
tower = { version = "0.5", features = ["util"] }

# `benches/embed_bench.rs` is a parameterized stress-test harness, not a
# `cargo bench` micro-benchmark - `harness = false` makes it a plain `fn main`
# binary. Run: `cargo bench --bench embed_bench -- --help`.
[[bench]]
name = "embed_bench"
harness = false

# `benches/ingest_bench.rs` measures the ingest path: per-stage timing plus a
# per-table merge_insert breakdown captured via a `pond::perf` tracing layer.
# Run: `cargo bench --bench ingest_bench -- --source-dir <PATH> [--source-dir <PATH>...]`
[[bench]]
name = "ingest_bench"
harness = false

# `line-tables-only` keeps file/line info for panic and `RUST_BACKTRACE`
# backtraces but drops the richer per-variable debuginfo only a step-debugger
# uses. Less debuginfo for rustc to emit means faster codegen on every rebuild.
[profile.dev]
debug = "line-tables-only"

# Build dependencies optimized even in dev/test builds. The hot code lives in
# the dependency graph (lance, arrow, candle); leaving it unoptimized makes
# `cargo test` and the embed worker crawl. pond's own crate stays unoptimized
# and incremental, so the edit -> check -> test loop stays fast. One-time cost:
# the dep graph is rebuilt once under this setting, then cached.
[profile.dev.package."*"]
opt-level = 3

# Plain `release` is the iteration profile - no LTO, default codegen-units - so
# `cargo build --release` and `cargo bench` (which inherits `release`) relink in
# seconds on a local-crate change. Ship-grade optimization lives in `dist`.
[profile.release]

# `dist` is the ship profile: whole-program thin-LTO and a single codegen unit.
# Used only for release artifacts (`cargo build --profile dist`), never the
# edit loop - it rebuilds the dependency graph once under its own settings.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
implicit_clone = "warn"
print_stdout = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
uninlined_format_args = "warn"
unwrap_used = "warn"
