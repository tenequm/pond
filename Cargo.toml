[package]
# Published to crates.io as `pond-db` (the `pond` name is taken by an unrelated
# crate). The library and binary stay `pond` via [lib]/[[bin]] below, so the
# command and `use pond::...` are unchanged - only `cargo install pond-db` differs.
name = "pond-db"
version = "0.2.8"
edition = "2024"
# MSRV pinned to the toolchain we build and test with (rust-toolchain.toml).
rust-version = "1.95"
license = "Apache-2.0"
description = "Lossless storage and hybrid search for sessions from any AI agent client"
repository = "https://github.com/tenequm/pond"
homepage = "https://pond.cascade.fyi/"
documentation = "https://pond.cascade.fyi/"
readme = "README.md"
keywords = ["agents", "mcp", "lance", "search", "session-logs"]
categories = ["command-line-utilities", "database", "artificial-intelligence"]
# Publish only what `cargo install` compiles. The repo's bulk is dev-only:
# tests/fixtures (~10 MiB) and docs/references vendored trees + PDFs (~5 MiB).
# benches/ stays - the [[bench]] targets declare paths cargo resolves on build.
exclude = [
    "tests/",
    "docs/",
    "scripts/",
    "ops/",
    ".github/",
    ".moon/",
    "moon.yml",
    "Dockerfile",
    ".dockerignore",
    "AGENTS.md",
    "CLAUDE.md",
    "SECURITY.md",
    "release-plz.toml",
    "*.pdf",
    "**/.DS_Store",
]

# cargo-binstall: binaries live on the PUBLIC homebrew-tap release (pond is a
# private repo), under tag `pond-vX.Y.Z` with `pond` at the archive root - so the
# URL is fully custom; binstall's default `{ repo }` + `v{version}` tag would
# 404. `{ bin }` resolves to `pond` (the [[bin]] name), not the crate `pond-db`.
[package.metadata.binstall]
pkg-url = "https://github.com/tenequm/homebrew-tap/releases/download/pond-v{ version }/pond-{ target }{ archive-suffix }"
pkg-fmt = "txz"
bin-dir = "{ bin }{ binary-ext }"

# Windows ships a .zip; every other target is .tar.xz.
[package.metadata.binstall.overrides."x86_64-pc-windows-gnu"]
pkg-fmt = "zip"

[lib]
name = "pond"

[[bin]]
name = "pond"
path = "src/main.rs"

[dependencies]
anstyle = "1"
anyhow = "1.0.102"
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
clap-verbosity-flag = { version = "3", default-features = false, features = ["tracing"] }
comfy-table = "7"
dialoguer = { version = "0.12", default-features = false }
human-panic = { version = "2", default-features = false }
# Embedding stack for `intfloat/multilingual-e5-small`: candle XLM-RoBERTa
# FP16 on Metal (macOS) / CUDA (`--features cuda`) / CPU. `LazyEmbedder`
# (`src/embed.rs`) idle-evicts the loaded backend after
# `embed::DEFAULT_IDLE_EVICTION` (5 min) of no use - the macOS Metal-buffer-pool
# retention costs phys_footprint only during the brief active query burst
# after each idle period.
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
fastrand = "2"
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
indicatif = "0.18"
lance = { version = "7.0.0", features = ["protoc"] }
lance-arrow = "7.0.0"
half = { version = "2.1", default-features = false }
lance-file = "7.0.0"
lance-index = "7.0.0"
lance-io = "7.0.0"
lance-linalg = "7.0.0"
lance-namespace = "7.0.0"
lance-namespace-impls = "7.0.0"
rmcp = { version = "1.7", features = ["transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.25"
# Streaming JSON pull-parser for the adapter seam's oversized-line slow path:
# records over `RECORD_CAP` are cap-parsed leaf-by-leaf so peak memory stays
# bounded (see src/adapter/jsonl.rs).
struson = "0.7"
thiserror = "2.0.18"
tokenizers = { version = "0.22", default-features = false, features = ["progressbar", "onig"] }
tokio = { version = "1.52", features = ["fs", "io-util", "io-std", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.18"
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.23", features = ["v7"] }
walkdir = "2.5"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.10", features = ["metal"] }
candle-nn = { version = "0.10", features = ["metal"] }
candle-transformers = { version = "0.10", features = ["metal"] }

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dev-dependencies]
# Re-declared (also in `[dependencies]`) so integration tests can name `MetricType`.
lance-linalg = "7.0.0"
# Re-declared so the MCP integration test can drive the server in-process via the `client` feature.
rmcp = { version = "1.7", features = ["client"] }
insta = "1.47.2"
tempfile = "3.25"
# Lets the HTTP integration test drive axum's `Router` without binding a socket.
tower = { version = "0.5", features = ["util"] }
s3s = "0.13"
s3s-fs = "0.13"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }

# macOS-only dev-dep so `benches/serve_mem_bench.rs` can sample
# `phys_footprint` via `libc::proc_pid_rusage(RUSAGE_INFO_V4)` - the same
# ledger Activity Monitor / `footprint(1)` / `top` / WebKit / psutil read.
# RSS on macOS is wrong in both directions (overcounts shared dyld pages,
# undercounts compressed pages); phys_footprint is the load-bearing metric.
[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"

# Plain `fn main` binaries (not libtest). Run with `cargo bench --bench <name> -- --help`.
[[bench]]
name = "embed_bench"
harness = false

[[bench]]
name = "ingest_bench"
harness = false

[[bench]]
name = "backend_bench"
harness = false

[[bench]]
name = "serve_mem_bench"
harness = false

# Keeps file/line info for panic backtraces; drops the per-variable debuginfo
# only a step-debugger uses. Faster codegen on every rebuild.
[profile.dev]
opt-level = 0
incremental = true
split-debuginfo = "unpacked"   # faster linking on Mac
debug = 1                       # faster than debug = 2

# Optimize dependency crates even in dev/test - the hot code (lance, arrow,
# candle) lives there; pond's own crate stays unoptimized for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

# Iteration profile: no LTO so local-crate rebuilds relink in seconds.
# Ship-grade optimization is `dist`.
[profile.release]

# Ship profile: thin-LTO + single codegen unit. Used only for release artifacts.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

[lints.rust]
# `deny` not `forbid` so candle's mmap-based safetensors loader (an inherently
# unsafe FFI to memmap2) can be opted into per-call. See src/embed.rs.
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
implicit_clone = "warn"
print_stdout = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
uninlined_format_args = "warn"
unwrap_used = "warn"
