# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: pond

builds:
  # Binaries are cross-compiled upstream by `moon run pond:build-dist` (Hetzner
  # buildkit) into target/dist/. goreleaser only packages them - it does not build.
  - id: pond
    builder: prebuilt
    binary: pond
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: darwin, goarch: amd64 }   # no Intel mac
      - { goos: windows, goarch: arm64 }  # no windows arm64
    prebuilt:
      # Map goreleaser's goos/goarch to the Rust-triple filenames build-dist emits.
      path: 'target/dist/pond-{{ if eq .Os "darwin" }}aarch64-apple-darwin{{ else if and (eq .Os "linux") (eq .Arch "amd64") }}x86_64-unknown-linux-gnu{{ else if and (eq .Os "linux") (eq .Arch "arm64") }}aarch64-unknown-linux-gnu{{ else }}x86_64-pc-windows-gnu.exe{{ end }}'

archives:
  - id: pond
    formats: [tar.xz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    # Preserve the existing `pond-<rust-triple>` asset names (stable download URLs).
    name_template: 'pond-{{ if eq .Os "darwin" }}aarch64-apple-darwin{{ else if and (eq .Os "linux") (eq .Arch "amd64") }}x86_64-unknown-linux-gnu{{ else if and (eq .Os "linux") (eq .Arch "arm64") }}aarch64-unknown-linux-gnu{{ else }}x86_64-pc-windows-gnu{{ end }}'

release:
  # pond is private; private-repo release assets 404 for unauthenticated clients
  # (incl. brew/nix). Publish binaries to the public homebrew-tap so the download
  # URLs below resolve. release-plz still cuts the tag + changelog on pond itself.
  github:
    owner: tenequm
    name: homebrew-tap
  # Namespace the tap release tag per-app so the tap can host other private CLIs
  # without version-tag collisions (.Tag is the raw vX.Y.Z). The url_templates in
  # brews/nix below must match this exactly - their default uses the unprefixed
  # .Tag and would 404.
  tag: "pond-{{ .Tag }}"

brews:
  - name: pond
    repository:
      owner: tenequm
      name: homebrew-tap
      token: "{{ .Env.GH_RELEASE_TOKEN }}"
    directory: Formula
    url_template: "https://github.com/tenequm/homebrew-tap/releases/download/pond-{{ .Tag }}/{{ .ArtifactName }}"
    homepage: https://github.com/tenequm/homebrew-tap
    description: Lossless storage and hybrid search for AI agent sessions, across every agentic client.
    license: Apache-2.0

nix:
  - name: pond
    repository:
      owner: tenequm
      name: nur-packages
      branch: main
      token: "{{ .Env.GH_RELEASE_TOKEN }}"
    path: pkgs/pond/default.nix
    url_template: "https://github.com/tenequm/homebrew-tap/releases/download/pond-{{ .Tag }}/{{ .ArtifactName }}"
    homepage: https://github.com/tenequm/homebrew-tap
    description: Lossless storage and hybrid search for AI agent sessions, across every agentic client.
    license: asl20
    main_program: pond

# release-plz owns CHANGELOG.md; don't double-generate.
changelog:
  disable: true
