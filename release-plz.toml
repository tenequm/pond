[workspace]
publish = true
# Skip the `cargo publish` verify build: build-and-test already compiled this
# exact code on the self-hosted runner (with protoc + kache), and a cold lance
# build on ubuntu-latest risks the publish timeout. Packaging is verified
# locally via `cargo publish --dry-run` before release.
publish_no_verify = true
# Release whenever main has an unpublished version bump (the release-plz
# default). The release PR still drives version/changelog; this just also covers
# the case where the bump is already on main but unpublished.
release_always = true
# pond ships as a CLI + MCP server; the `pond` lib exists only so the binary and
# integration tests share code, not as a public API others depend on. cargo-
# semver-checks guards library consumers we don't have, so skip it - it otherwise
# adds a multi-minute cold rustdoc build of the heavy dep tree to every release.
semver_check = false

# Lance-style release notes: emoji-grouped sections, scope-bolded entries, PR
# links, breaking markers, and a per-version compare link. The `## [version]`
# heading stays parseable - release-plz reads it to extract each release's notes
# for the GitHub release. The `<!-- N -->` prefixes order the sections (group_by
# sorts alphabetically; GitHub renders the HTML comments invisibly).
[changelog]
body = """
## [{{ version }}]{% if release_link %}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}{% if commit.scope %}- **{{ commit.scope }}:** {% else %}- {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% endfor %}{% endfor %}"""
trim = true
protect_breaking_commits = true
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/tenequm/pond/pull/${1}))" },
]
commit_parsers = [
  { message = "^chore: release", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 0 -->🛠 Breaking Changes" },
  { body = "^BREAKING CHANGE", group = "<!-- 0 -->🛠 Breaking Changes" },
  { message = "^feat", group = "<!-- 1 -->🎉 New Features" },
  { message = "^fix", group = "<!-- 2 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->🚀 Performance" },
  { message = "^refactor", group = "<!-- 4 -->🚜 Refactor" },
  { message = "^docs", group = "<!-- 5 -->📚 Documentation" },
  { message = "^chore|^ci|^build|^test", group = "<!-- 6 -->🧹 Chores" },
  { message = "^.*", group = "<!-- 7 -->🔧 Other" },
]
